<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Before we start</title>
<!--
  The clickable mock-up for punch list #382, Before we start.
  It is the spike's own page, not a drawing: built from branch spike/before-we-start
  (src/spike/beforeWeStart/ and src/lib/startChecks/startChecks.ts) with React bundled in,
  so it opens with nothing running. Three seats over one store kept in this browser:
  the office, the GC's page and the crew's phone. A press in one seat shows in the others.
  Every site, customer, person, job, date and figure is made up. Nothing here reads or
  writes the app. The card's README says how to rebuild this file from the branch.
-->
