<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Text the bill · The hold on a first text</title>
<style>body{margin:0;padding:24px;background:#e5e7eb} a{color:#2563eb} a:hover{color:#1d4ed8}</style>
</head>
<body>
<div style="width: 720px; height: 320px; box-sizing: border-box; padding: 24px 28px; background: #ffffff; border: 1px solid #e5e7eb; border-radius: 14px; color: #1a1a1a; font-family: -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif; font-size: 14px; display: flex; flex-direction: column; gap: 12px">
  <div style="display: flex; align-items: baseline; gap: 10px">
    <span style="font-weight: 600">What goes</span>
    <span style="color: #6b7280; font-size: 13px">· the office trimmed the opening</span>
  </div>
  <label for="words2" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">The text</label>
  <textarea id="words2" rows="3" style="width: 100%; box-sizing: border-box; border: 1px solid #dc2626; border-radius: 8px; padding: 12px 14px; font: inherit; font-size: 15px; line-height: 1.5; color: #1a1a1a; background: #ffffff; resize: vertical">Your bill for the water heater is ready, $1,850.00. Pay it here: https://my.clickplumbing.com/pay/k7x2m9pq4n</textarea>
  <div style="display: flex; gap: 10px; align-items: flex-start; color: #b91c1c; line-height: 1.45">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#b91c1c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4m0 4h.01"></path></svg>
    <div>This is Dana’s first text from us, so it has to say who is writing. Put <strong>this is Rosa with Click Plumbing</strong> back, or press <strong>Put the opening back</strong>.</div>
  </div>
  <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border-top: 1px solid #e5e7eb; padding-top: 14px; margin-top: auto">
    <button type="button" disabled style="background: #e5e7eb; color: #6b7280; border: 0; border-radius: 8px; padding: 11px 16px; font-size: 15px; font-weight: 600; min-height: 44px">Send the text</button>
    <button type="button" style="background: transparent; color: #2563eb; border: 1px solid #93c5fd; border-radius: 8px; padding: 11px 14px; font-size: 14px; min-height: 44px">Put the opening back</button>
    <span style="color: #6b7280; font-size: 13px">A later text is not held. Only the first one has to introduce you.</span>
  </div>
</div>
</body>
</html>
