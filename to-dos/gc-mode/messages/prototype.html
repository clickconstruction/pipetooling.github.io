      <div class="foot">${COMPANY.name}, ${COMPANY.addr}. ${job?'About '+esc(jobById(job).name)+'. ':''}A copy of this email is kept in Documents.</div></div>
      ${!c.emails.length?'<div class="pv-warn">They have no email on file. Add one on the To line and the email can go.</div>':''}
      <div class="pv-note">The subject comes from the job and your first line; the greeting from their contact name; the letterhead from who the job is for (Click Construction on a GC job); the signature from your account, your title and your cell if you have one there. Nothing here is typed twice.</div>`;
    } else { const prior=[...messages].filter(m=>m.c===c.id&&m.ch==='text').sort((a,b)=>a.at-b.at).slice(-2); const segs=Math.max(1,Math.ceil(body.length/160)); const first=firstTextEver(c); const footer=first?`\n\n${COMPANY.name}. Reply STOP to opt out.`:''; const full=body+footer; const fsegs=Math.max(1,Math.ceil(full.length/160));
      html=`${tabs}<p class="note">What ${esc(c.name)} sees on their phone, under the texts already there.</p>
      <div class="to-line"><b>To:</b> ${toLine(c,'phone')}</div>
      <div class="phone"><div class="bar"><b>${COMPANY.name}</b>${COMPANY.phone}</div><div class="screen">
        ${prior.map(m=>`<div class="bub ${m.dir==='in'?'them':'us'}">${esc(m.text)}</div>`).join('')}
        <div class="stamp">Today 10:32 AM</div>
        <div class="bub us new">${esc(full)}</div><div class="dl">Delivered</div></div></div>
      ${c.optout?'<div class="pv-warn">They sent STOP. The app will not send this text.</div>':''}
      ${!c.phones.length?'<div class="pv-warn">They have no mobile number on file. Add one on the To line and the text can go.</div>':''}
      ${fsegs>2?`<div class="pv-warn">${full.length} characters is ${fsegs} texts. Long texts arrive in pieces on some phones; an email may read better.</div>`:''}
      <div class="pv-note">${full.length} characters · ${fsegs} text${fsegs>1?'s':''}${first?' · their first text from us carries the company name and the opt-out line the carriers require':''}. Sent from the company number, so their reply lands back in this thread whoever answers.</div>`; }
    return html; };
  const bg=document.createElement('div'); bg.className='modal-bg'; const m=document.createElement('div'); m.className='modal wide'; bg.appendChild(m);
  const paint=()=>{ m.innerHTML=`<h2>Before it goes, this is what they see</h2>${draw()}<div class="owe-ask ${c.owe?'has':''}">${c.owe?`<label class="owe-toggle" for="settleck"><input type="checkbox" id="settleck"><span class="box"></span><span class="words"><b>This message gets ${esc(c.owe.what)} done</b><small>Tick it and what we owe is done when this goes. Leave it and it stays our move.</small></span></label>`:`<label class="owe-toggle" for="oweck"><input type="checkbox" id="oweck"><span class="box"></span><span class="words"><b>Something is still on us after this goes</b><small>Tick it and it stays our move; Follow up lists it under We owe them.</small></span></label><div class="owe-fields"><input id="owew" placeholder="what we still owe them, in a few words" autocomplete="off"><input id="oweb" placeholder="by when" autocomplete="off" style="width:120px"></div>`}</div><div class="btns"><button onclick="this.closest('.modal-bg').remove()">Change it</button><button onclick="toast('A test copy went to your own address.')">Send a test to me</button><button class="primary" ${cur==='text'&&(c.optout||!c.phones.length)?'disabled':''} ${cur==='email'&&!c.emails.length?'disabled':''} onclick="window.__oweFromSend('${c.id}');replyKind='${cur}';this.closest('.modal-bg').remove();render();document.getElementById('box').value=window.__pvBody;sendReply('${c.id}')">Send as ${cur}</button></div>`; };
  window.__pvBody=body; window.__pvSet=k=>{cur=k;toEditing=null;paint();}; window.__pvPaint=paint; m.addEventListener('change',e=>{ if(e.target.id==='oweck'&&e.target.checked) setTimeout(()=>document.getElementById('owew')?.focus(),60); }); window.__oweFromSend=cid=>{ const sk=document.getElementById('settleck'); if(sk&&sk.checked){ const cc=cById(cid); pendingSettle={what:cc.owe.what, by:cc.owe.by}; } const ck=document.getElementById('oweck'); if(ck&&ck.checked&&!ck.disabled){ const w=(document.getElementById('owew')?.value||'').trim(); if(w){ const cc=cById(cid); cc.owe={what:w, by:(document.getElementById('oweb')?.value||'').trim()||null, since:NOW_WORDS, at:NOW, who:ME}; messages.push({id:++seq,c:cid,job:null,ch:'event',dir:'team',who:ME,at:NOW+messages.length,text:`${ME} marked that we owe ${cc.name} ${w}${cc.owe.by?' by '+cc.owe.by:''}.`}); } } }; paint(); document.body.appendChild(bg); bg.onclick=e=>{ if(e.target===bg) bg.remove(); }; }

// ---------- modal / sheet ----------
function modal(title, body, onOk){ const bg=document.createElement('div'); bg.className='modal-bg'; bg.innerHTML=`<div class="modal"><h2>${title}</h2>${body}<div class="btns"><button id="mcancel">Not now</button><button class="primary" id="mok">Save</button></div></div>`; document.body.appendChild(bg); bg.querySelector('#mcancel').onclick=()=>bg.remove(); bg.querySelector('#mok').onclick=()=>{ if(onOk()!==false) bg.remove(); }; bg.onclick=e=>{ if(e.target===bg) bg.remove(); }; const f=bg.querySelector('input'); if(f) f.focus(); }
function sheet(title, optsHtml){ closeSheet(); const s=document.createElement('div'); s.className='sheet'; s.id='sheet'; s.innerHTML=`<h2>${title}</h2><div class="opts">${optsHtml}<button class="quiet" onclick="closeSheet()">Cancel</button></div>`; document.body.appendChild(s); }
function closeSheet(){ document.getElementById('sheet')?.remove(); }

// ---------- hover cards: what a control does, and what it changes ----------
// The card's calendar (the owner, 2026-10-11): the last weeks as rows, S M T W T F S, each day colored by who wrote that
// day (blue us, green them, both split), a yellow dot for a team note, today outlined, days to come dashed. Six weeks, or back
// to the first message when that is sooner.
function stampCalendar(c){ const DAY=86400000; const mine=messages.filter(m=>m.c===c.id&&m.ch!=='event'); if(!mine.length) return '';
  const key=ts=>new Date(ts).toDateString(); const byDay={}; for(const m of mine){ const k=key(m.at); const d=byDay[k]=byDay[k]||{inN:0,outN:0,note:0}; if(m.dir==='in') d.inN++; else if(m.dir==='out') d.outN++; else d.note++; }
  const today=new Date(NOW); today.setHours(0,0,0,0); const first=new Date(Math.min(...mine.map(m=>m.at))); first.setHours(0,0,0,0);
  const sixWeeksBack=new Date(today.getTime()-DAY*41); const start=new Date(Math.max(first.getTime(), sixWeeksBack.getTime())); start.setDate(start.getDate()-start.getDay());
  const end=new Date(today); end.setDate(end.getDate()+(6-end.getDay()));
  let html='<div class="cal">'+['S','M','T','W','T','F','S'].map(h=>`<span class="h">${h}</span>`).join('')+'<span></span>';
  const md=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  for(let w=new Date(start); w<=end; w.setDate(w.getDate()+7)){ const m1=new Date(w), m2=new Date(w); m2.setDate(m2.getDate()+6); const thisWeek=today>=m1&&today<=m2; const lbl=`${md(m1)} – ${m2.getMonth()===m1.getMonth()?m2.getDate():md(m2)}${thisWeek?' · this week':''}`;
    for(let d=0; d<7; d++){ const day=new Date(w); day.setDate(day.getDate()+d); const k=key(day); const v=byDay[k]; const fut=day>today; const cls=['c', fut?'future':'', v?(v.inN&&v.outN?'both':v.inN?'them':v.outN?'us':''):'', v&&v.note?'note':'', day.getTime()===today.getTime()?'today':''].filter(Boolean).join(' '); const n=v?v.inN+v.outN:0; html+=`<span class="${cls}">${n>1?n:''}</span>`; } html+=`<span class="m">${lbl}</span>`; }
  html+='</div><div class="callg"><span><i class="us"></i>us</span><span><i class="them"></i>them</span><span><i class="both"></i>both</span><span><i class="note"></i>a team note</span><span><i class="today"></i>today</span><span>· a number is how many that day</span></div>';
  return html; }
// A card may carry a legend (data-tip-legend), drawn when it opens from the page's own state, so the sample chips are the real ones.
const TIP_LEGENDS = {
  stamps(){ const c=cById(openContact); if(!c) return ''; const i=lastInOnly(c), o=lastOut(c);
    return `<div class="leg"><div><b style="width:36px;text-align:right;flex:none">Them</b><span class="w">${i?esc(stampFull(i)):'nothing yet'}</span></div><div><b style="width:36px;text-align:right;flex:none">Us</b><span class="w">${o?esc(stampFull(o)):'nothing yet'}</span></div></div>${stampCalendar(c)}`; },
  jobs(){ const c=cById(openContact); if(!c) return ''; const nm=id=>jobById(id)?jobById(id).name:''; const def=c.def?nm(c.def):null; const blueId=jobFilter||c.jobs.find(j=>j!==c.def)||c.def; const blue=blueId?nm(blueId):'a job'; const blueJ=blueId?jobById(blueId):null; const defJ=c.def?jobById(c.def):null; const first=c.name.split(' ').filter(w=>!/^dr\.?$/i.test(w))[0];
    return `<div class="leg">
      <div><span class="jobtile mini on"><span class="ln"><span class="num ${blueJ?blueJ.kind:'bid'}">${esc(blueJ?jobNum(blueJ):'B?')}</span><span class="nm">${esc(blue)}</span></span></span><span class="w"><b>Blue</b> is what you are looking at: the thread shows only the lines tied to that job. Click it again, or <i>show all</i>, to see everything.</span></div>
      <div><span class="jobtile mini"><span class="ln"><span class="star">★</span>${defJ?`<span class="num ${defJ.kind}">${esc(jobNum(defJ))}</span>`:''}<span class="nm">${esc(def||'none yet')}</span></span></span><span class="w"><b>The gold star</b> is where new messages from ${esc(first)} land until someone changes it. Click ☆ on another job to move it. It never changes what you are looking at.</span></div>
      <div><span class="jobchip" style="color:var(--text-muted)">⧉ ×</span><span class="w">⧉ opens the job's card; × takes the job off ${esc(first)} (the lines tied to it keep their tie). The second line is the job's day in words: a bid's day, a project's stage, a Pipeline job's step.</span></div>
      <div><span class="jobchip ghost">drag</span><span class="w">Drag a tile onto a line to tie that one message there; press and hold on a phone. A line with no job sits on the person alone.</span></div>
    </div>`; }
};
(function(){ const tip=document.createElement('div'); tip.className='tip'; document.body.appendChild(tip); let timer=null, cur=null;
  const show=el=>{ const [head,what,changes]=el.dataset.tip.split('|'); const [lk,la]=(el.dataset.tipLegend||'').split(':'); const leg=lk&&TIP_LEGENDS[lk]?TIP_LEGENDS[lk](la):''; tip.innerHTML=`<b>${esc(head)}</b>${what?`<p class="what">${esc(what)}</p>`:''}${changes?`<p class="changes">${esc(changes)}</p>`:''}${leg}`; const r=el.getBoundingClientRect(); tip.style.left='0px'; tip.style.top='0px'; tip.classList.add('show'); const w=tip.offsetWidth, h=tip.offsetHeight; let x=r.left+r.width/2-w/2, y=r.bottom+8; if(x<8) x=8; if(x+w>window.innerWidth-8) x=window.innerWidth-8-w; if(y+h>window.innerHeight-8) y=Math.max(8, window.innerHeight-8-h); tip.style.left=x+'px'; tip.style.top=y+'px'; };
  const hide=()=>{ clearTimeout(timer); tip.classList.remove('show'); cur=null; };
  document.addEventListener('mouseover',e=>{ const el=e.target.closest('[data-tip]'); if(!el||el===cur) return; hide(); cur=el; timer=setTimeout(()=>show(el),300); });
  document.addEventListener('mouseout',e=>{ const el=e.target.closest('[data-tip]'); if(el&&el===cur&&!el.contains(e.relatedTarget)) hide(); });
  document.addEventListener('focusin',e=>{ const el=e.target.closest('[data-tip]'); if(el){ cur=el; show(el); } });
  document.addEventListener('focusout',hide); document.addEventListener('click',()=>setTimeout(hide,0),true); window.addEventListener('scroll',hide,true); })();

window.addEventListener('resize',()=>render());
render();
</script>
