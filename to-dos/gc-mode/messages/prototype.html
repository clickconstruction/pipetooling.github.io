<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Messages prototype</title>
<meta name="description" content="Prototype: every call, text and email with a contact in one place; jobs hang off the contact; a message can be tied to one job. GC mode, Click Construction. Made-up people. Nothing is saved.">
<style>
:root{--bg:#f6f7f9;--surface:#fff;--text:#1b1f24;--text-muted:#5c6470;--border:#dde1e6;--accent:#1f5fbf;--accent-soft:#e8f0fc;--team:#fff6c2;--team-border:#e9d77a;--warn:#b35c00;--warn-soft:#fff1e0;--ok:#1a7f3c;--ok-soft:#e6f6ec;--danger:#b3261e;--chip:#eef1f5;--radius:10px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:6px 10px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.quiet{border-color:transparent;background:transparent;color:var(--accent);padding:4px 6px}

button:disabled{opacity:.45;cursor:not-allowed}
button.danger{color:var(--danger);border-color:#f0c2be;background:var(--surface)}
.modal .facts2{display:flex;flex-direction:column;gap:8px;margin:10px 0 4px;font-size:14px;line-height:1.4}
.modal .facts2 div{display:flex;gap:10px;align-items:flex-start}
.modal .facts2 .k{flex:none;width:22px;text-align:center;font-size:15px}
.modal .facts2 b{font-weight:600}
input,select,textarea{font:inherit;border:1px solid var(--border);border-radius:8px;padding:7px 9px;background:var(--surface);color:var(--text)}
header.top{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 16px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header.top .brand{font-weight:700;margin-right:8px}
header.top nav{display:flex;gap:4px;flex-wrap:wrap}
header.top nav button{border-color:transparent;background:transparent;padding:6px 10px;border-radius:999px}
header.top nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--danger);color:#fff;font-size:12px;line-height:20px;text-align:center;margin-left:4px}
header.top .me{margin-left:auto;color:var(--text-muted);font-size:13px}
main{max-width:1180px;margin:0 auto;padding:16px}
.note{color:var(--text-muted);font-size:13px}
.lead{margin:0 0 12px;font-size:17px}
.two{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px}
.two.collapsed{grid-template-columns:64px minmax(0,1fr)}
.two.with-flow{grid-template-columns:340px minmax(0,1fr) 300px}
.two.with-flow.collapsed{grid-template-columns:64px minmax(0,1fr) 300px}
.two.with-frail{grid-template-columns:340px minmax(0,1fr) 64px}
.two.with-frail.collapsed{grid-template-columns:64px minmax(0,1fr) 64px}
@media(max-width:1040px){.two.with-flow,.two.with-flow.collapsed{grid-template-columns:64px minmax(0,1fr) 280px}}
/* 761–860 px: the people list is hidden (narrow), so the grid must not keep its column; the thread and the flow share the row (v1.47) */
@media(min-width:761px) and (max-width:860px){.two.with-flow,.two.with-flow.collapsed{grid-template-columns:minmax(0,1fr) 280px}}
@media(max-width:760px){.two.with-flow,.two.with-flow.collapsed{grid-template-columns:minmax(0,1fr)}.two.with-flow .list,.two.with-flow .rail{display:none}.fpanel{position:static;max-height:none}}
.fpanel{background:#fbfbfc;align-self:start}
.rail{align-self:start;position:sticky;top:58px}
.frail{align-self:start;position:sticky;top:var(--hdrh,58px);display:flex;flex-direction:column;align-items:center;padding:8px 4px 10px;gap:0}
.frail .open{font-size:14px;color:var(--accent);border:1px solid var(--border);border-radius:50%;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;background:var(--surface);margin-bottom:6px;padding:0;cursor:pointer}
.frail .lane{font-size:9px;letter-spacing:.6px;color:var(--text-muted);text-transform:uppercase;margin:6px 0 2px}
.frail .stepw{display:flex;flex-direction:column;align-items:center}
.frail .st{width:16px;height:16px;border-radius:50%;border:2px solid #cfd5dd;background:var(--surface);box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer;color:var(--text-muted)}
.frail .st.done{background:var(--ok);border-color:var(--ok);color:#fff}
.frail .st.now{border-color:var(--warn);background:var(--warn-soft);width:20px;height:20px}
.frail .st.now::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--warn)}
.frail .st.now.them{border-color:var(--ok);background:var(--ok-soft)}.frail .st.now.them::after{background:var(--ok)}
.frail .st.dec{border-radius:4px}
.frail .ln{width:2px;height:10px;background:var(--border)}.frail .ln.done{background:var(--ok)}
.frail .tag{font-size:9px;font-weight:700;padding:0 5px;border-radius:999px;margin-top:3px}
.frail .tag.us{background:var(--warn-soft);color:var(--warn)}.frail .tag.them{background:var(--ok-soft);color:var(--ok)}.frail .tag.both{background:var(--bg);color:var(--text-muted)}
.frail .cnt{font-size:11px;font-weight:700;color:var(--text);margin-top:8px}
.fpanel .ph2{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.fpanel .ph2 b{font-size:13px}
.flow{display:flex;flex-direction:column;gap:6px;font-size:12px}
.flow .lane{border:1px solid var(--border);border-radius:10px;padding:8px;background:var(--surface)}
.flow .lane .t{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.flow .boxes{display:flex;flex-direction:column;align-items:stretch;gap:2px}
.flow .box{border:1px solid var(--border);border-radius:7px;padding:6px 9px;background:var(--surface);position:relative;display:flex;align-items:center;gap:6px 8px;font-size:12.5px;flex-wrap:wrap}
.flow .box>span:first-child{flex:1 1 auto}
.flow .box>span:first-child{flex:1;min-width:0}
.flow .box.done{background:var(--ok-soft);border-color:#bfe3c9;color:var(--ok)}
.flow .box.now{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);font-weight:600}
.flow .box.dec{border-left:4px solid #c9b7ea}
.flow .box.dec.done{border-left-color:#8fcf9f}
.flow .box.dec.now{border-left-color:var(--warn)}
.flow .arr{color:#9aa4b1;text-align:center;font-size:11px;line-height:1;margin:1px 0}
.flow .loop{border:1px dashed #c9d0d8;border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:4px}
.flow .loop .lt{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;padding:0 3px}
.flow .loop .rounds{display:flex;gap:4px;flex-wrap:wrap;padding:0 3px}
.flow .loop .rounds span{font-size:10.5px;border:1px solid var(--border);border-radius:999px;padding:0 6px;background:var(--surface)}
.flow .loop .rounds span.done{background:var(--ok-soft);border-color:#bfe3c9;color:var(--ok)}
.flow .loop .rounds span.now{background:var(--warn-soft);border-color:#f0d3b0;color:var(--warn)}
.flow .who{font-size:10px;border-radius:999px;padding:0 7px;border:1px solid;background:var(--surface);font-weight:700;flex:none;line-height:16px}
.flow .who.us{color:var(--warn);border-color:#f0d3b0;background:var(--warn-soft)}
.flow .who.them{color:var(--ok);border-color:#bfe3c9;background:var(--ok-soft)}
.flow .who.both{color:var(--text-muted);border-color:var(--border)}
.fnext{font-size:12px;color:var(--text-muted);margin-top:8px;border-top:1px solid var(--border);padding-top:8px}
.fnext b{color:var(--text)}
.feditor .tabs{display:flex;gap:6px;margin:6px 0 10px}
.feditor .tabs button{border-radius:999px}
.feditor .tabs button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.feditor table{width:100%;border-collapse:collapse;font-size:13px}
.feditor th{text-align:left;font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;border-bottom:1px solid var(--border)}
.feditor td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top}
.feditor td.g{color:var(--text-muted)}
.feditor td input{width:100%;padding:3px 6px}
.feditor .lanehead td{background:var(--bg);font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em}
.rail{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 6px}
.rail .avatar{cursor:pointer;position:relative;width:38px;height:38px}
.rail .avatar.on{outline:2px solid var(--accent);outline-offset:2px}
.rail .avatar .cd{position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border-radius:50%;border:2px solid var(--surface);background:#cfd5dd}
.rail .avatar .cd.ours{background:var(--warn)}.rail .avatar .cd.theirs{background:#1a7f3c}
.list .lhead{display:flex;align-items:center;gap:6px;padding:8px 10px 0}
.list .lhead input{flex:1;min-width:0}
.collapse{width:30px;height:30px;padding:0;border-radius:50%;font-size:15px;flex:none}
.two>*{min-width:0}
@media(max-width:860px){.two{grid-template-columns:1fr}.list.hidden-narrow{display:none}.two.with-frail{grid-template-columns:minmax(0,1fr) 64px}}
@media(max-width:760px){.two.with-frail,.two.with-frail.collapsed{grid-template-columns:minmax(0,1fr)}.frail{order:-1;position:static;flex-direction:row;flex-wrap:wrap;justify-content:center;padding:8px 10px;gap:0}.frail .lane{writing-mode:horizontal-tb;margin:0 8px 0 4px}.frail .ln{width:10px;height:2px}.frail .cnt{margin:0 0 0 8px}.frail .open{margin:0 8px 0 0}.frail .stepw{flex-direction:row}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px}
.list .row{display:flex;gap:10px;padding:10px;border-top:1px solid var(--border);cursor:pointer;align-items:flex-start}
.list .row:first-child{border-top:0}
.list .row.on{background:var(--accent-soft)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none;color:var(--text-muted)}
.avatar.cust{background:#e6f1ff;color:#1f5fbf}.avatar.trade{background:#eef7ea;color:#1a7f3c}.avatar.arch{background:#f3eaff;color:#6d3fb8}.avatar.unknown{background:#fff1e0;color:#b35c00}
.row .who{font-weight:600}
.row .sub{color:var(--text-muted);font-size:13px}
.row .last{font-size:14px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .right{margin-left:auto;text-align:right;font-size:12px;color:var(--text-muted);flex:none;max-width:132px}
.court.tiny{font-size:11px;padding:1px 7px 1px 5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-flex}
.list .row > div:nth-child(2){flex:1;min-width:0}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--chip);color:var(--text-muted);margin-right:4px}
.pill.waiting{background:var(--warn-soft);color:var(--warn)}
.pill.has{background:var(--accent-soft);color:var(--accent)}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.promise{background:#eef7ea;color:var(--ok)}
.pill.stop{background:#fde7e5;color:var(--danger)}
h2{font-size:18px;margin:0 0 8px}
h3{font-size:14px;margin:14px 0 6px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em}
.thread-head{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.hdr .row1{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hdr .row1 .name{flex:1 1 180px;min-width:0}
.hdr .row1 .corner{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.hdr .row1 h2{margin:0;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .row1 .email{font-size:13px;color:var(--text-muted);margin-top:1px}
.hdr .row2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 0;color:var(--text-muted);font-size:14px}
.court{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:2px 9px 2px 7px;border-radius:999px;border:1px solid var(--border);background:var(--surface)}
.court i{width:9px;height:9px;border-radius:50%;background:#cfd5dd;display:inline-block}
.court.ours{color:var(--warn);border-color:#f0d3b0;background:var(--warn-soft)}.court.ours i{background:var(--warn)}
.court.theirs{color:#1a7f3c;border-color:#bfe3c9;background:#eef7ea}.court.theirs i{background:#1a7f3c}
.court.none{color:var(--text-muted)}
button.court{cursor:pointer;line-height:inherit}button.court:hover{filter:brightness(.97)}
.whopick .ph b{color:var(--text)}
.stamps{margin-left:auto;display:grid;grid-template-columns:auto auto;column-gap:8px;row-gap:1px;font-size:12px;color:var(--text-muted);text-align:right;flex-shrink:0;align-self:flex-start}
.stamps b{font-weight:600;color:var(--text)}.stamps span{white-space:nowrap}
.hdr .row3{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;margin:6px 0 0}.hdr .row3 .court,.hdr .row3>button{margin-top:1px}
.thread{container-type:inline-size}
/* The conversation sits in a tinted well between the header and the reply box (v1.68, thread-regions-mockups A): a shade
   of its own, so the card still reads as a card and the well as the band inside it that moves. */
.thread #lines{background:#eef1f5;margin:10px -12px 0;padding:6px 12px 10px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);flex:1}
.thread .msg.in{background:var(--surface)}
/* The thread as a window (v1.69, thread-regions-mockups B, the second step of D): the card takes the window's height, the name
   row pins at the top and the reply box at the bottom, and the rest of the header scrolls away with the conversation. */
.thread.card{padding:0;position:sticky;top:var(--hdrh,58px);height:calc(100vh - var(--hdrh,58px) - 32px);display:flex;flex-direction:column}
.thread .hdr-top{padding:12px 12px 8px;box-shadow:0 6px 14px -10px rgba(0,0,0,.3);position:relative;z-index:2;background:var(--surface);border-radius:var(--radius) var(--radius) 0 0}
.thread .scrollarea{flex:1;min-height:0;overflow:auto;padding:0 12px;display:flex;flex-direction:column}
.thread .hdr-rest{flex:none}
.thread .reply{flex:none;border-top:0;margin-top:0;padding:10px 12px 12px;box-shadow:0 -6px 14px -10px rgba(0,0,0,.3);position:relative;z-index:2;background:var(--surface);border-radius:0 0 var(--radius) var(--radius)}
.list.card{position:sticky;top:var(--hdrh,58px);max-height:calc(100vh - var(--hdrh,58px) - 32px);overflow:auto;align-self:start}
/* The composer band stays short: the quick replies' groups scroll inside a bounded box, the step's group at the top. */
.thread .quickwrap .qgroups{max-height:118px;overflow:auto;scrollbar-width:thin;mask-image:linear-gradient(#000 calc(100% - 18px),transparent);-webkit-mask-image:linear-gradient(#000 calc(100% - 18px),transparent);padding-bottom:14px}
@container (max-width: 640px){ .quickwrap .ql > span:not(.gpills){display:none} .quickwrap .ql .qfilter{flex:1;min-width:90px} }
.hdr .row1 .sub2,.hdr .corner .statepill,.stamps .diff,.stamps .short,.hdr .jobs-rail .sep{display:none}
.hdr .row2 a.fact{color:inherit;text-decoration:none}
.statepill{display:none;align-items:center;gap:4px;border:1px solid var(--accent);border-radius:999px;padding:3px 10px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:600;white-space:nowrap}
.statepill.snoozed{border-color:var(--border);background:var(--chip);color:var(--text-muted)}.statepill.done{border-color:#bfe3c9;background:var(--ok-soft);color:var(--ok)}
.ago{font-size:11.5px;font-weight:700;color:var(--text-muted);cursor:help;display:inline-block}
.stampsn{display:none;width:100%;margin-top:2px;font-size:13px;color:var(--text-muted);cursor:help;line-height:1.35}
.stampsn b{color:var(--text);font-weight:600}
.stamps .diff{font-size:11px;font-weight:700;border:1px solid var(--border);border-radius:999px;padding:0 6px;color:var(--text-muted);background:var(--surface);cursor:help;line-height:16px}
.stamps .diff.behind{color:var(--warn);border-color:#f0d3b0;background:var(--warn-soft)}.stamps .diff.ahead{color:var(--ok);border-color:#bfe3c9;background:var(--ok-soft)}
@container (max-width: 640px){
  .hdr .row1{flex-wrap:nowrap;gap:10px}.hdr .row1 .name{flex:1 1 0}.hdr .row1 h2{font-size:18px}.hdr .row1 .sub2{display:block;font-size:13px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hdr .row1 .sub2 b{font-weight:600;color:var(--text)}
  .hdr .corner{flex-wrap:nowrap;gap:6px}.hdr .corner .seg{display:none}.hdr .corner .statepill{display:inline-flex}
  .haspill .lbl,.haspill .since{display:none}.haspill{padding-right:8px}
  .hdr .row2 .kindco,.hdr .row2 .sepdot{display:none}.hdr .row2{gap:4px 10px}.hdr .row2 a.fact{color:var(--accent)}
  .stamps{display:none}.stampsn{display:block}
  .hdr .tools{display:flex;gap:6px;overflow-x:auto;align-items:center;margin:10px 0 2px;padding:8px 2px 6px;border-top:1px solid var(--border);scrollbar-width:thin;mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent);-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent)}
  .hdr .tools>.toolbar,.hdr .tools>.jobs-rail{display:contents}.hdr .tools>*>*{flex:none;white-space:nowrap}.hdr .tools .jobs-rail .lbl{display:none}.hdr .jobs-rail .sep{display:inline-block;width:1px;height:22px;background:var(--border);margin:0 4px}.jobtile{width:220px}.hdr .tools .jobs-rail .tiles{display:contents}
}

.hdr .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 0;padding-top:8px;border-top:1px solid var(--border)}
.hdr .toolbar .grow{flex:1}
.hdr .jobs-rail{margin:10px 0 2px}
.hdr .jobs-rail{flex-wrap:nowrap;align-items:flex-start}

// ---------- helpers ----------
const fmt = ts => { const d=new Date(ts); const today=new Date(2026,9,2); const same=d.toDateString()===today.toDateString(); const h=d.getHours(), m=String(d.getMinutes()).padStart(2,'0'); const hh=((h+11)%12)+1, ap=h<12?'AM':'PM'; return same? `${hh}:${m} ${ap}` : d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})+` · ${hh}:${m} ${ap}`; };
const isToday = ts => new Date(ts).toDateString()===new Date(2026,9,2).toDateString();
const fmtDay = ts => isToday(ts) ? `today · ${fmt(ts)}` : fmt(ts);
// A stamp on the header's block also says how many days ago, as a small mark, (+6) (the owner, 2026-10-11); today needs no more.
const agoDays = ts => { const n=dayDiff(NOW,ts); return n<=0 ? '' : ` <span class="ago">(+${n})</span>`; };
const agoWordsOf = ts => { const n=dayDiff(NOW,ts); return n<=0 ? '' : n===1 ? ' · yesterday' : ` · ${n} days ago`; };
// The stamp's compact form (the owner's pick 4, 2026-10-11): today keeps its time, an older one is its date with the +N mark.
const stampShort = ts => isToday(ts) ? `today · ${fmt(ts)}` : new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric'});
const stampFull = m => `${chWord(m).toLowerCase()} · ${fmtDay(m.at)}${agoWordsOf(m.at)}`;
const dayOf = ts => { const d=new Date(ts); const today=new Date(2026,9,2); return d.toDateString()===today.toDateString()?'Today, Fri Oct 2':d.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'}); };
const lastOut = c => [...messages].filter(m=>m.c===c.id&&m.dir==='out').sort((a,b)=>b.at-a.at)[0];
const agoWords = ts => { const mins=Math.max(1,Math.round((NOW-ts)/60000)); if(mins<60) return `${mins} min`; if(mins<60*24) return `${Math.round(mins/60)} h`; return `${Math.round(mins/1440)} d`; };
const lastInOnly = c => [...messages].filter(m=>m.c===c.id&&m.dir==='in').sort((a,b)=>b.at-a.at)[0];
const courtOf = c => { const i=lastInOnly(c), o=lastOut(c); if(c.optout) return {side:'none', word:'opted out'}; if(c.owe) return {side:'ours', word:`Our move · we owe ${c.owe.what}${c.owe.by?' · by '+c.owe.by:''}`, owe:true}; if(!i&&!o) return {side:'none', word:'no messages yet'}; if(!o || (i && i.at>o.at)) return {side:'ours', word:`Our move · ${agoWords(i.at)}`, since:i.at}; return {side:'theirs', word:c.promise?`Their move · ${c.promise.replace('promised ','until ')}`:`Their move · ${agoWords(o.at)}`, since:o.at}; };
const courtStrip = c => { const k=courtOf(c), i=lastInOnly(c), o=lastOut(c); if(k.owe) return `<span class="whowrap"><button type="button" class="court ours owed" data-tip="What we owe|We owe ${esc(firstName(c))} ${esc(c.owe.what)}${c.owe.by?' by '+esc(c.owe.by):''}. It stays our move until it is done.|Press to go to the reply box, where the ways to deal with it are." onclick="owedAt('${c.id}')"><i></i>${esc(k.word)} ▾</button></span><span class="stamps" data-tip="Them and Us||" data-tip-legend="stamps"><b>Them</b><span>${i?`${chWord(i).toLowerCase()} · ${stampShort(i.at)}${agoDays(i.at)}`:'nothing yet'}</span><b>Us</b><span>${o?`${chWord(o).toLowerCase()} · ${stampShort(o.at)}${agoDays(o.at)}`:'nothing yet'}</span></span>${stampSentence(c,i,o)}`;
  return `<span class="court ${k.side}" data-tip="${k.side==='ours'?'Our move|The last word was theirs, so the next move is ours.|It counts from their last message. A reply, an email or a call from us makes it their move, unless we mark that we still owe them something.':k.side==='theirs'?'Their move|The last word was ours, so we are waiting on them.|It counts from our last message, or runs until the day they promised. Their next message makes it our move again.':'No move|Nothing is waiting either way.|'}"><i></i>${esc(k.word)}</span><button class="quiet small" data-tip="We owe them…|Mark something we still have to do for them, with a day.|Opens the strip above the reply box, with the blanks to fill. It stays our move after we write, and Follow up lists it under We owe them." onclick="owedAt('${c.id}')">We owe them…</button><span class="stamps" data-tip="Them and Us||" data-tip-legend="stamps"><b>Them</b><span>${i?`${chWord(i).toLowerCase()} · ${stampShort(i.at)}${agoDays(i.at)}`:'nothing yet'}</span><b>Us</b><span>${o?`${chWord(o).toLowerCase()} · ${stampShort(o.at)}${agoDays(o.at)}`:'nothing yet'}</span></span>${stampSentence(c,i,o)}`; };
// The folded header's form (stamps-narrow-mockups.html C, the owner's pick 2026-10-11): two pills, the newer one filled in its
// side's color (green them, blue us, the calendar's pair), the older one plain with its +N. Who wrote last reads before the words.
// The folded header's stamps as one sentence (stamps-words-mockups.html B, the owner's pick 2026-10-11): the newer side
// first, the channel as the verb, the when in words, no color. The person is named, never a guessed pronoun; a number
// nobody has named reads "they". Hover the sentence for the card with the exact stamps and the calendar.
function whenWords(ts){ const n=dayDiff(NOW,ts); if(n<=0) return `today at ${fmt(ts)}`; if(n===1) return 'yesterday';
  if(n<=6){ const d=new Date(ts); const wd=d.toLocaleDateString('en-US',{weekday:'long'}); const today=new Date(NOW); const thisSun=new Date(today); thisSun.setHours(0,0,0,0); thisSun.setDate(thisSun.getDate()-thisSun.getDay()); return d>=thisSun?`on ${wd}`:`last ${wd}`; }
  const thisSun=new Date(NOW); thisSun.setHours(0,0,0,0); thisSun.setDate(thisSun.getDate()-thisSun.getDay()); const weeksBack=Math.floor((thisSun-new Date(ts).setHours(0,0,0,0))/(7*86400000))+1;
  if(weeksBack===1) return 'last week'; if(weeksBack===2) return 'two weeks ago'; if(weeksBack===3) return 'three weeks ago';
  return 'on '+new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
const verbOf = m => ({text:'texted',email:'emailed',call:'called',voicemail:'left a voicemail',missed:'called'})[m.ch]||'wrote';
const verbTail = m => m.ch==='missed' ? ', no voicemail' : '';
function stampSentence(c,i,o){ const who = c.kind==='unknown' ? 'They' : esc(firstName(c));
  const them = i ? `${who} ${verbOf(i)} <b>${whenWords(i.at)}</b>${verbTail(i)}` : `${who} ${c.kind==='unknown'?'have':'has'} not written yet`;
  const us = o ? `we ${verbOf(o)} <b>${whenWords(o.at)}</b>${verbTail(o)}` : 'we have not written yet';
  const themFirst = !o || (i && i.at>o.at); const [a,b] = themFirst ? [them, us] : [us.replace(/^we/,'We'), them.replace(/^They /,'they ')];
  return `<span class="stampsn" data-tip="Them and Us||" data-tip-legend="stamps">${a}; ${b}.</span>`; }
const courtShort = c => { const k=courtOf(c); if(k.owe) return {side:k.side, word:'Our move · we owe', title:k.word}; return {side:k.side, word:k.word, title:k.word}; };
const snippetOf = m => m.ch==='email' ? (m.subject||m.text.split('\n')[0]) : m.ch==='missed' ? 'no voicemail' : m.text;
const waitingSince = c => { const last=[...messages].filter(m=>m.c===c.id&&m.dir==='in').sort((a,b)=>b.at-a.at)[0]; if(!last) return ''; const mins=Math.max(1,Math.round((NOW-last.at)/60000)); if(mins<60) return `waiting ${mins} min`; if(mins<60*24) return `waiting ${Math.round(mins/60)} h`; return `waiting ${Math.round(mins/1440)} d`; };
const kindWord = c => ({customer:'customer',trade:'trade partner',arch:'architect',unknown:'who is this?'})[c.kind];

const lastMsg = c => [...messages].filter(m=>m.c===c.id&&m.ch!=='event').sort((a,b)=>b.at-a.at)[0];
const lastIn = c => [...messages].filter(m=>m.c===c.id&&m.dir==='in').sort((a,b)=>b.at-a.at)[0] || lastMsg(c);
const chWord = m => ({call:'Call',voicemail:'Voicemail',text:'Text',email:'Email',note:'Note for the team',missed:'Missed call',event:'Event'})[m.ch];
const jobLabel = (c,jid) => { const j=jobById(jid); if(!j) return ''; return j.name + (c&&c.trade&&j.kind==='bid'?` · ${c.trade}`:''); };

    <div class="row2"><span class="kindco">${c.kind==='unknown'?'Who is this?':`<b style="font-weight:600;color:var(--text)">${esc(kindWord(c).replace(/^\w/,ch=>ch.toUpperCase()))}:</b> ${esc(c.company||'')}`}</span>${c.phones.length?`<span class="sepdot">·</span><a class="fact" href="tel:${esc(c.phones[0].replace(/\D/g,''))}">${esc(c.phones.join(', '))}</a>`:''}${c.emails.length?`<span class="sepdot">·</span><a class="fact" href="mailto:${esc(c.emails[0])}">${esc(c.emails.join(', '))}</a>`:''}${c.state==='snoozed'?`<span class="pill">snoozed until Monday</span>`:''}${c.promise?`<span class="pill promise">${esc(c.promise)}</span>`:''}</div>

      <span class="whowrap"><button class="quiet" data-tip="More|The rarer things for this thread.|Mark STOP, Show all text, and Edit the flow." onclick="morePicker('${c.id}',this)">More ▾</button></span>
      ${c.state!=='waiting'?`<button class="quiet" title="Demo: a new message from them reopens the row by itself" onclick="theyReply('${c.id}')">They text back (demo)</button>`:''}

    ${replyKind!=='note'&&draftFiles.length?`<div class="att draft">${draftFiles.map((f,i)=>`<span class="chip" data-tip="${esc(f.name)}|${f.from==='job'?'From the job.':f.from==='photo'?'A photo from this device.':'From this computer.'} ${f.big?'Over the email limit, so it stays in the job\'s Drive folder and goes as our link to it.':f.from==='computer'?'Goes into the job\'s Team only folder on the way out.':''}|On an email it goes as ${f.from==='photo'?'the picture':f.big?'our link to it in Drive':'the file'}; on a text as ${f.from==='photo'?'the picture':'our link, to their portal when it has a page there'}.">${f.from==='photo'?'<span class="thumb"></span>':`<span class="ic ${f.kind}">${f.kind==='pdf'?'PDF':'F'}</span>`}<span>${esc(f.name)} <span class="note">· ${esc(f.size)}</span></span><span class="x" onclick="draftFiles.splice(${i},1);render()">×</span></span>`).join('')}</div>`:''}
    ${replyKind!=='note'?`<div class="previews"><span>Send shows it to you the way they will see it, before it goes.</span><span class="note" id="pvcount"></span></div>`:''}
    <div class="send">${settling===c.id&&c.owe?`<button class="primary" data-tip="Done, with this note|Marks what we owed done and keeps your words in the thread.|The row closes as any note does; the move goes by whose word was last. Follow up drops it from We owe them." onclick="finishSettle('${c.id}')">Done, with this note</button><button class="quiet" onclick="cancelSettle()">Not done yet</button>`:`<button class="primary" onclick="${replyKind==='note'?`sendReply('${c.id}')`:`previewDraft('${c.id}','${replyKind}')`}" ${c.optout&&replyKind==='text'?'disabled':''}>${replyKind==='note'?'Add the note':replyKind==='email'?'Send email…':'Send text…'}</button>`}${c.optout&&replyKind==='text'?'<span class="note">They sent STOP. The app will not text this number.</span>':''}
      ${replyKind!=='note'?`<span class="whowrap attach"><button type="button" class="small" data-tip="Attach|Adds a file to this message: one the job already has, one from this computer, or a photo.|On an email it goes as the file, or as our link to it in the job's Drive folder when it is big; on a text a photo goes as the picture and anything else as our link, to their portal when it has a page there, else to the file in Drive." onclick="attachPicker('${c.id}',this)">Attach ▾</button></span>`:''}

  const L=th.querySelector('#lines');

function renderJob(m){
  const j=jobById(openJob);
  const rows = messages.filter(x=>x.job===j.id).sort((a,b)=>b.at-a.at);
  const el=document.createElement('div');
  el.innerHTML=`<p class="lead">${jobTag(j.id)} <span class="note">· ${esc(jobDayText(j))} · ${j.kind==='bid'?'a bid':j.kind==='project'?'a GC project':'a Pipeline job'}</span></p>
  <div class="filters">${jobs.map(x=>`<button class="${x.id===openJob?'on':''}" onclick="openJob='${x.id}';render()">${jobTag(x.id)}</button>`).join('')}</div>
  <p class="note">Conversations on this job: the messages tied to it, by person, newest first. The job reads only what is tied to it; the person's thread reads everything.</p>
  <h3 style="margin:14px 0 6px">Papers on this job, by company</h3><p class="note">The company's Documents rows read the flow back: the step each paper turns on and where the person is, with the step card's own buttons.</p>
  <div class="card" style="padding:0 12px">${contacts.filter(c=>c.jobs.includes(j.id)&&c.kind!=='unknown').map(c=>{ const order=flat(c.kind); const nowIx=order.findIndex(x=>x.id===S(c).now); const steps=order.filter((x,i)=>(x.papers||[]).length && (['done','lapsed','now'].includes(stepState(c,x.id)) || (nowIx>=0 && i===nowIx+1))); const lines=steps.flatMap(s=>s.papers.map(p=>{ const f=FACTS.find(x=>x.paper===p); if(!f) return ''; const r=factRead(c,f.id,s.loop?(S(c).rounds[s.id]||[]).find(x=>x.s==='now'):null); const st=stepState(c,s.id); const where = st==='done'?'done':st==='lapsed'?'lapsed':st==='now'?`<b>${esc(firstName(c))} is on it</b>`:st==='skipped'?'skipped':'next'; const act = r.m==='ok'?`<button class="small" onclick="toast('Opens it.')">Open</button>`:f.ours&&r.m==='no'?`<button class="small" onclick="sendPaper('${c.id}','${s.id}','${p}')">Send</button>`:!f.ours&&(r.m==='no'||r.m==='bad')?`<button class="small" onclick="askFor('${c.id}','${s.id}','${p}')">Ask for it</button>`:''; return `<div class="doc"><span>${esc(PAPER_NAMES[p].replace(/^\w/,ch=>ch.toUpperCase()))}</span><span class="${r.m==='ok'?'':'note'}" style="${r.m==='ok'?'color:var(--ok)':r.m==='bad'?'color:var(--danger)':''}">${esc(r.m==='ok'?r.words||'on file':r.m==='wait'?'went, waiting on them':r.m==='bad'?r.words:'nothing on file')}</span><span>${esc(s.name)} · ${where}</span><span>${act}</span></div>`; })).join(''); return `<div class="doc h" style="margin-top:6px"><span>${esc(c.company||c.name)} · ${esc(kindWord(c))}</span><span>State</span><span>Finishes</span><span></span></div>${lines}`; }).join('')||'<div class="empty">Nobody on this job has papers.</div>'}</div>
  <h3 style="margin:14px 0 6px">Conversations</h3>
  <div class="card list jobconv">${rows.length?rows.map(x=>{ const c=cById(x.c); return `<div class="row" onclick="openThread('${c.id}')" style="cursor:pointer"><div class="avatar ${kindClass(c)}">${initials(c)}</div><div style="flex:1"><div class="who">${esc(c.name)} <span class="note">· ${esc(c.company||kindWord(c))}</span></div><div class="last">${chWord(x)}: ${esc(x.text)}</div></div><div class="right">${fmtDay(x.at)}<br>${c.state==='waiting'?'<span class="pill waiting">waiting</span>':'<span class="pill done">answered</span>'}</div></div>`;}).join(''):'<div class="empty">No calls or texts tied to this job yet.</div>'}</div>`;
  m.appendChild(el);
}

function renderSettings(m){
  const el=document.createElement('div');
  el.innerHTML=`<p class="lead">Settings → Phone and texts</p><div class="card settings"><dl>
  <dt>Quo connection</dt><dd>Connected · last event 2 min ago · API key qo_live_••••••••7f3a</dd>
  <dt>The company number</dt><dd>(210) 555-0100, one for everyone. Rings everyone; anyone answers or texts from it.</dd>
  <dt>Text registration</dt><dd>Approved. Needed before texting customers. STOP and HELP are answered by the app.</dd>
  <dt>Recordings</dt><dd>On, every call, no notice (Texas needs one side's consent).</dd>
  <dt>Transcripts and summaries</dt><dd>On, every call (Quo Business).</dd>
  <dt>Quo seats</dt><dd>Two: Rosa, the assistant (customers), and Robert, the estimator (trade partners). Everyone else works in the app.</dd>
  <dt>Who sees threads</dt><dd>Everyone on the team. The Money tab stays the owner's.</dd>
  <dt>Who gets a new message</dt><dd>In this order: whoever answered this person last, if they are here today; else by who they are: a customer → Rosa (the assistant's seat), a trade partner or an architect → Robert (the estimator's seat); a number nobody knows → nobody, so whoever answers first takes it. The pill says it was by the rule, and anyone can take it. <span class="note">(proposed 2026-10-11, the owner's call)</span></dd>
  <dt>Email</dt><dd>bids@ read through a Google grant; replies go out as Click Construction. <span class="note">(open question)</span></dd>

  </dl></div>${flowsEditorHtml()}`;
  m.appendChild(el);
}

// ---------- actions ----------
function openThread(id, mid){ openContact=id; jobFilter=null; replyTie=null; if(view!=='customers') view='messages'; render(); if(mid){ requestAnimationFrame(()=>{ const el=[...document.querySelectorAll('#lines .msg')].find(e=>e.dataset.id===String(mid)); if(el){ el.scrollIntoView({block:'center'}); el.classList.add('flash'); } }); } }
function hasPill(c){ if(!c.has) return `<button type="button" class="haspill none" data-tip="Nobody has it|No one has claimed this conversation.|Whoever answers first takes it. Press to take it or hand it to someone." onclick="whoPicker('${c.id}',this)"><span class="av">?</span><span><span class="lbl">Nobody has it · </span>Take it</span></button>`; const me=c.has===ME; const sinceWords=c.hasSinceAt?` Since ${whenWords(c.hasSinceAt).replace(/^on /,'')}, ${esc(c.hasSince)}.`:(c.hasSince?' Since '+esc(c.hasSince)+'.':''); return `<button type="button" class="haspill ${me?'me':''}" data-tip="${me?'You have this|You claimed it, so the team leaves it to you.'+sinceWords+'|Press to hand it to someone or put it back; the thread records the change.':esc(c.has)+' has this|'+esc(c.has)+' claimed it, so nobody else answers it.'+sinceWords+'|Press to take it or hand it on; the thread records the change.'}" onclick="whoPicker('${c.id}',this)"><span class="av">${initialsOf(c.has)}</span><span>${me?'You':esc(c.has)}<span class="lbl">${me?' have this':' has this'}</span></span></button>`; }
function attachPicker(cid, btn){ document.removeEventListener('click', outsideWho); if(document.getElementById('whopick')){ closeWho(); return; } const c=cById(cid); const jid=replyTie==='none'?null:(replyTie||c.def); const files=jid?(JOB_FILES[jid]||[]):[];
  const stepRows = (()=>{ if(!qrStepInBox) return ''; const step=stepById(c.kind,qrStepInBox); if(!step) return ''; const need=(step.papers||[]).filter(p=>{ const f=FACTS.find(x=>x.paper===p); return f && !f.ours && factRead(c,f.id).m!=='ok'; }); if(!need.length) return ''; return `<div class="ph">For ${esc(step.name)} · starred</div>${need.map(p=>`<div class="wrow star" onclick="closeWho();addStepFile('${c.id}','${p}')"><span class="chk">☆</span><span class="av" style="border-radius:5px;font-size:10px;background:#c0392b;color:#fff">PDF</span><span class="wn"><b>The ${esc(PAPER_SHORT[p])} form</b><small>2 pages · what they fill in and send back, or upload in their portal.</small></span></div>`).join('')}<div class="wrow star" onclick="closeWho();addStepFile('${c.id}','portal')"><span class="chk">☆</span><span class="av">↗</span><span class="wn"><b>Their portal link</b><small>click.co/t/7Hq2#papers · uploads there land on their Documents and finish the step.</small></span></div>`; })();

  if(narrow()){ const bg=document.createElement('div'); bg.id='stepcard-bg'; bg.className='stepcard-bg'; bg.onclick=closeCard; document.body.appendChild(bg); document.body.appendChild(el); }
  else { const col=document.querySelector('.fpanel')||document.querySelector('.frail'); const r=col?col.getBoundingClientRect():{left:window.innerWidth-80, top:70}; el.style.right=Math.max(12, window.innerWidth-r.left+12)+'px'; el.style.top=Math.max(64, r.top)+'px'; document.body.appendChild(el); const h=el.getBoundingClientRect(); if(h.bottom>window.innerHeight-12) el.style.top=Math.max(64, window.innerHeight-12-h.height)+'px'; if(h.left<12){ el.style.right='auto'; el.style.left='12px'; } setTimeout(()=>document.addEventListener('click', outsideCard, {once:true}),0); } }
function outsideCard(e){ const el=document.getElementById('stepcard'); if(!el){ return; } if(el.contains(e.target) || e.target.closest('.flow .box') || e.target.closest('.frail .st') || e.target.closest('.modal-bg') || e.target.closest('#whopick')) { document.addEventListener('click', outsideCard, {once:true}); return; } closeCard(); }
function refreshCard(){ if(!cardOpen) return; const el=document.getElementById('stepcard'); const c=cById(cardOpen.cid); const step=stepById(c.kind,cardOpen.stepId); if(el && step) el.innerHTML=stepCardHtml(c,step); }
const factLine = (m, text, small, act) => `<div class="fact"><span class="m ${m}">${m==='ok'?'✓':m==='wait'?'↗':m==='bad'?'!':m==='off'?'–':m==='next'?'→':'○'}</span><span class="t">${text}${small?`<small>${small}</small>`:''}</span>${act?`<span class="act">${act}</span>`:''}</div>`;
function paperAct(c, step, f, r){ const p=f.paper; const name=PAPER_NAMES[p]; const sid=step.id;
  if(r.m==='ok') return `<button class="small" data-tip="Open|Opens ${esc(name)} as it is on file.|Nothing changes." onclick="toast('Opens ${esc(name)}.')">Open</button>`;
  if(r.m==='wait') return f.ours ? `<button class="small" data-tip="Nudge|Asks them again to sign ${esc(name)}: fills the reply box with the step's line and their portal link.|Nothing sends until you press Send." onclick="askFor('${c.id}','${sid}','${p}')">Nudge</button>` : '';
  if(f.ours) return `<button class="small primary" data-tip="Send it|Sends ${esc(name)} the way the company window does: an email with the paper, filed as a sent copy, shown in the thread.|The step waits on their signature after that." onclick="sendPaper('${c.id}','${sid}','${p}')">Send it</button>`;
  return `<button class="small primary" data-tip="Ask for it|Fills the reply box with the step's line and their portal link, where they upload it.|Nothing sends until you press Send." onclick="askFor('${c.id}','${sid}','${p}')">Ask for it</button>`; }
function stepCardHtml(c, step){ const st=S(c); const sub=subState(c,step); const s=stepState(c,step.id); const lane=laneOf(c.kind,step.id); const first=esc(firstName(c)); const w=whoNow(c,step); const waiting=st.waiting[step.id]; const day=stepDay(c,step);
  if(st.off && !st.done.includes(step.id)) return offCardHtml(c);
  const move = s==='done' ? `done · ${esc(st.when[step.id]||'')}` : s==='skipped' ? `skipped · ${esc(st.skipped[step.id])}` : waiting ? `waiting on ${esc(cById(waiting.who).name)}, ${dayDiff(NOW,waiting.sinceAt)} days` : (s==='now'||s==='lapsed') ? (w==='us'?'our move':w==='them'?'their move':'both sides') : 'next';
  const head = `<div class="hd"><button class="x" onclick="closeCard()" aria-label="Close">×</button><b>${esc(step.name)}${s==='lapsed'?' · lapsed':''}</b><div class="note">${esc(lane)}${step.loop?' · '+esc(step.loop)+' · '+(sub.rounds[step.id]||[]).length+' so far':''} · ${move}${(s==='now'||s==='lapsed')&&sinceWords(c,step)?' · '+sinceWords(c,step):''}${day?' · <span class="'+(day.late?'late':'')+'">'+day.words+'</span>':''}${s==='now'?usualWords(c,step):''}</div></div>`;
  let body='';
  if(step.loop){ const rounds=sub.rounds[step.id]||[]; body+=`<div class="sec"><div class="h">${esc(step.loop)}</div>${rounds.length?rounds.map((r,i)=>{ const m=r.s==='done'?'ok':r.s==='now'?'wait':'no'; const d=r.due?dayDiff(NOW,r.due):null; const act = r.s==='done'?`<button class="small" onclick="toast('Opens it.')">Open</button>`:r.s==='now'?`<button class="small primary" onclick="askFor('${c.id}','${step.id}','${(step.papers||[])[0]||''}',${i})">${step.who==='them'?'Ask again':'Nudge'}</button>`:`<button class="small" onclick="toast('The ask-companies send the Board has; not a new one.')">Ask</button>`; return factLine(m, `${esc(r.n)}${r.due&&r.s!=='done'?' · '+(d>0?'<span class="late">promised '+wdayOf(r.due)+', late '+d+' day'+(d===1?'':'s')+'</span>':'due '+wdayOf(r.due)):''}`, esc(r.when||r.words||(r.s==='now'?'their move · finished when '+factsWords(step):'')), act); }).join(''):'<div class="note">none yet</div>'}</div>`; }
  else { const fs=stepFacts(c,step); body+=`<div class="sec"><div class="h">Finished when</div>${fs.map(({f,r})=>{ const act = f.paper ? paperAct(c,step,f,r) : ''; const extra = r.m==='bad' ? ` A new one, uploaded from their portal or filed by us, makes the step done again.` : (r.m==='no' && f.paper && !f.ours ? ` ${aPaper(f.paper)} uploaded from their portal, or one we file, finishes it.` : ''); return factLine(r.m, `${esc(f.text.replace(/^\w/,ch=>ch.toUpperCase()))}.`, esc(r.words?r.words.replace(/\.?$/,'.'):'')+esc(extra), act); }).join('')}${step.join==='or'?'<div class="note">A fork: either way out finishes it.</div>':''}${fs.some(({f,r})=>f.paper&&!f.ours&&r.m!=='ok'&&r.m!=='wait')?`<div class="note" style="margin-top:6px">Both facts are the app's own: the step turns green by itself the moment they are true. <button class="quiet small" style="padding:0" data-tip="File a paper we were handed|A paper handed to us in the office is filed as a paper: a file or a photo, a date, who filed it. That is a fact the app keeps, so the step finishes the same way.|There is no mark-it-done that writes nothing." onclick="fileByHand('${c.id}','${step.id}')">File ${esc(aPaper(fs.find(({f,r})=>f.paper&&!f.ours&&r.m!=='ok').f.paper).toLowerCase().replace(/^a /,'a ').replace(/^an /,'an '))} we were handed</button> · <button class="quiet small" style="padding:0" title="Demo: the upload arrives from their portal" onclick="demoArrives('${c.id}','${step.id}')">their upload arrives (demo)</button></div>`:''}</div>`; }
  if(s==='lapsed'){ const bad=stepFacts(c,step).find(x=>x.r.m==='bad'); body+=`<div class="sec"><div class="h">What it holds up</div><div class="note">${bad&&bad.f.paper==='coi'?`Nothing on the quote: ${first} can quote and we can compare. A statement of work cannot go to ${first} until the papers are in again, since Once comes before Per job.`:`The steps after it in this lane wait until it is true again.`}</div></div>`; }
  if(waiting){ body+=`<div class="sec"><div class="h">Whose move</div><div class="note">Not ${first}'s and not ours: ${esc(cById(waiting.who).name)}'s. ${first}'s thread says <i>waiting on the architect</i>, and nothing nudges ${first}. The nudge for this is on ${esc(firstName(cById(waiting.who)))}'s flow, <i>${esc(stepById('arch',waiting.step)?.name||waiting.step)}</i>. <button class="quiet small" style="padding:0" onclick="openThread('${waiting.who}');closeCard()">Open ${esc(firstName(cById(waiting.who)))}'s thread</button> · <button class="quiet small" style="padding:0" onclick="toast('A Follow up row for ${esc(firstName(cById(waiting.who)))} today: ${esc(stepById('arch',waiting.step)?.name||'')}.')">Nudge ${esc(firstName(cById(waiting.who)))} now</button></div></div>`; }
  // after this
  const order=flat(c.kind); const i=order.findIndex(x=>x.id===step.id); const next=order.slice(i+1).find(x=>laneOf(c.kind,x.id)===lane && !st.skipped[x.id]);
  if(next && (s==='now'||s==='lapsed')){ const np=(next.papers||[]).map(p=>FACTS.find(f=>f.paper===p)).find(f=>f&&f.ours); const nr=np?factRead(c,np.id):null; body+=`<div class="sec"><div class="h">After this</div>${factLine('next', `${esc(next.name)} · ${next.who==='us'?'our move':next.who==='them'?'their move':'both sides'}.`, np?`${nr.m==='ok'?esc(PAPER_NAMES[np.paper])+' is on file already.':nr.m==='wait'?esc(PAPER_NAMES[np.paper])+' went; waiting on them.':`We send ${esc(PAPER_NAMES[np.paper])} from here once this step is done; they sign it in their portal.`}`:`Finished when ${esc(factsWords(next))}.`, np&&nr.m==='no'?`<button class="small" data-tip="Send ${esc(PAPER_NAMES[np.paper])} now|Gets one step ahead: sends it while this step is still open.|Never two steps ahead." onclick="sendPaper('${c.id}','${next.id}','${np.paper}')">Send ${esc(PAPER_SHORT[np.paper])} now</button>`:'')}</div>`; }
  // nudge
  if((s==='now'||s==='lapsed') && !waiting){ const q=quietDays(c); const n=step.nudge; const seat=step.who==='us'?(step.seat||'Robert'):null; body+=`<div class="sec"><div class="h">Nudge</div><div class="note">${n?`${day&&day.late?`${first} passed the day: the Follow up row is there now.`:n.days?`After ${n.days} days quiet, ${esc(n.how)}${n.send==='app'?', sent by the app':''}, as the ${esc(kindWord(c))} flow says. ${first} has been quiet ${q} day${q===1?'':'s'}: ${q>=n.days?'the Follow up row is there now.':`the Follow up row comes in ${n.days-q} day${n.days-q===1?'':'s'}.`}`:`At ${esc(n.day)}.`}`:`No nudge on this step${seat?`; it is ${seat}'s move`:''}.`} ${st.hold&&st.hold[step.id]?`Held until ${esc(st.hold[step.id])}.`:''}<br><button class="quiet small" style="padding:0" data-tip="Nudge now|Makes the Follow up row today instead of on day ${n?n.days:''}, with the step's line ready in the reply box.|Nothing sends until you press Send." onclick="nudgeNow('${c.id}','${step.id}')">Nudge now</button> · <button class="quiet small" style="padding:0" data-tip="Hold until Mon|Keeps the nudge quiet until Monday.|The Follow up row waits; the step does not move." onclick="holdNudge('${c.id}','${step.id}')">Hold until Mon</button>${n?` · <button class="quiet small" style="padding:0" data-tip="See the nudge|What it looks like when it goes.|Nothing sends." onclick="nudgePreview('${c.kind}','${step.id}')">⌕ see it</button>`:''}</div></div>`; }
  // history and notes
  const hist=[]; for(const x of order){ if(x.id===step.id) break; if(st.done.includes(x.id)) hist.push(`<div class="hist"><b>${esc(x.name)}</b> · ${esc(st.when[x.id]||'done')}.</div>`); }
  if(s==='done'||s==='lapsed') hist.push(`<div class="hist"><b>${esc(step.name)}</b> · ${esc(st.when[step.id]||'done')}.</div>`); if(s==='lapsed'){ const bad=stepFacts(c,step).find(x=>x.r.m==='bad'); hist.push(`<div class="hist"><b>Lapsed</b> · ${esc(bad?bad.r.words:'')}. Nobody did this; the fact changed.</div>`); }
  if(s==='now') hist.push(`<div class="hist"><b>${esc(step.name)}</b> · ${esc(sinceWords(c,step)||'on now')}.${stepFacts(c,step).filter(x=>x.r.m==='ok').map(x=>' '+esc(x.f.text.replace(/^\w/,ch=>ch.toUpperCase()))+', '+esc(x.r.words)+'.').join('')}</div>`);
  const notes=(st.notes[step.id]||[]).map(nt=>`<div class="teamnote"><b>${esc(nt.by)}, note</b> · ${esc(nt.text)} ${esc(nt.when)}.</div>`).join('');
  body+=`<div class="sec"><div class="h">How ${c.kind==='unknown'?'they':esc(firstName(c))} got here</div>${hist.join('')||'<div class="note">Nothing yet.</div>'}${notes}<div class="note" style="margin-top:6px"><button class="quiet small" style="padding:0" data-tip="A note on this step|A team note tied to the step, the way a message ties to a job: it reads here and in the thread.|Only the team sees it." onclick="addStepNote('${c.id}','${step.id}')">+ a note on this step</button>${s!=='done'&&s!=='skipped'?` · <button class="quiet small" style="padding:0" data-tip="Does not apply to ${first}|Skips this step for ${first} alone, with a reason; the flow moves on.|The person's, not the flow's: the step stays for everyone else." onclick="skipStep('${c.id}','${step.id}')">Does not apply to ${first}</button>`:''}${s==='skipped'?` · <button class="quiet small" style="padding:0" onclick="unskipStep('${c.id}','${step.id}')">Put it back</button>`:''} · <button class="quiet small" style="padding:0" data-tip="See their page|Opens their portal's first page, where this flow reads from their side.|What they see; nothing of ours." onclick="portalPage('${c.id}')">See their page</button></div></div>`;
  return head+body; }
function offCardHtml(c){ const st=S(c); const o=st.off; const first=esc(firstName(c)); return `<div class="hd"><button class="x" onclick="closeCard()" aria-label="Close">×</button><b>Off the flow</b><div class="note">Since ${esc(o.since)} · ${esc(o.fact)}: ${esc(st.outcome||'')}.</div></div>
  <div class="sec"><div class="h">Why</div>${factLine('off', esc(o.why), `From ${esc(o.fact)}, which ${esc(o.by)} marked with that reason. The reason lives on the bid; this card reads it.`, `<button class="small" onclick="toast('Opens the bid.')">Open the bid</button>`)}</div>
  <div class="sec"><div class="h">What stops, what stays</div><div class="note">Nudges stop. The thread, the papers and the jobs stay. ${first} stays in Messages and Customers under a filter, <i>off the flow</i>, folded by default.</div></div>
  <div class="sec"><div class="h">Back on</div><div class="note">A new ask, a new bid, or <button class="quiet small" style="padding:0" onclick="putBackOn('${c.id}')">Put ${first} back on</button> with a reason. ${first} re-enters at the step the facts say, not at the start.</div></div>`; }

let qrStepInBox = null; // the step whose line the reply box holds (v1.96): the Attach picker stars that step's papers
function askFor(cid, stepId, paper, roundIx){ const c=cById(cid); closeCard(); if(view!=='messages'||openContact!==cid) openThread(cid); replyKind= c.phones.length?'text':'email'; render(); const box=document.getElementById('box'); const q=quickReplies.find(x=>!x.removed&&x.for===c.kind&&x.step===stepId); const first=firstName(c); const name=paper?PAPER_NAMES[paper]:''; const line = q ? q.text : paper ? `${first}, could you send ${name.replace(/^their /,'your ').replace(/^the /,'the ')}? You can upload it here: click.co/t/7Hq2#papers` : `${first}, checking on ${stepById(c.kind,stepId).name.toLowerCase()}.`; box.value = line + (q && paper && !/click\.co/.test(q.text) ? `\nYou can upload it here: click.co/t/7Hq2#papers` : ''); countBox(box); qrStepInBox=stepId; box.focus(); toast(`The ${stepById(c.kind,stepId).name} line is in the box; nothing sent yet.`); }
function sendPaper(cid, stepId, paper){ const c=cById(cid); const name=PAPER_NAMES[paper]; const file=`${name.replace(/^(the|our|their) /,'').replace(/^\w/,ch=>ch.toUpperCase())}.pdf`; messages.push({id:++seq,c:cid,job:c.def,ch:'email',dir:'out',who:`${ME} · bids@`,subject:`${jobById(c.def)?jobById(c.def).name+': ':''}${name.replace(/^\w/,ch=>ch.toUpperCase())}`,at:NOW+messages.length,text:`Hello ${firstName(c)},\n\n${name.replace(/^\w/,ch=>ch.toUpperCase())} is attached and in your portal, ready for your signature.\n\n${ME}`,attachments:[{name:file,size:'210 KB',kind:'pdf',sentAs:'attachment'}]}); papersOf(c)[paper]={state:'sent', on:NOW_WORDS, words:`went today, ${fmt(NOW)}`}; messages.push({id:++seq,c:cid,job:null,ch:'event',dir:'team',who:'the app',at:NOW+messages.length,text:`${ME} sent ${name} · ${stepById(c.kind,stepId).name} waits on their signature`}); c.state='done'; closeCard(); toast(`${name.replace(/^\w/,ch=>ch.toUpperCase())} went as an email, with its copy filed.`); render(); }
function fileByHand(cid, stepId){ const c=cById(cid); const step=stepById(c.kind,stepId); const f=stepFacts(c,step).find(x=>x.f.paper&&!x.f.ours&&x.r.m!=='ok'); if(!f) return; const p=f.f.paper; const name=PAPER_NAMES[p];
  modal(`File ${esc(name)} we were handed`, `<p class="note">A paper handed to us is filed as a paper: a file or a photo, the day, and who filed it. That is a fact the app keeps, so the step finishes by itself.</p><div class="f"><label>The file</label><input id="fh-file" value="${esc(PAPER_SHORT[p].replace(/^\w/,ch=>ch.toUpperCase()))}, ${esc(c.company)}.pdf"></div><div class="f"><label>Dated</label><input id="fh-day" value="today"></div>${p==='coi'?`<div class="f"><label>Current to</label><input id="fh-exp" value="Mar 1, 2027"></div>`:''}<p class="note">Filed by ${ME}. It lands on ${esc(c.company)}'s Documents, with this step on it.</p>`, ()=>{ const exp=document.getElementById('fh-exp')?.value; papersOf(c)[p]= p==='coi' ? {state:'current', on:NOW_WORDS, expires:exp, words:`filed by ${ME} today, current to ${exp}`} : {state:'signed', on:NOW_WORDS, words:`filed by ${ME} today`}; const moved=recheck(c); messages.push({id:++seq,c:cid,job:null,ch:'event',dir:'team',who:'the app',at:NOW+messages.length,text:`${ME} filed ${name} by hand${stepState(c,stepId)==='done'?' · '+step.name+' done':''}`}); closeCard(); render(); toast(moved?`${step.name} is done; the next step is on.`:`${name.replace(/^\w/,ch=>ch.toUpperCase())} is on file.`); }); }
function demoArrives(cid, stepId){ const c=cById(cid); const step=stepById(c.kind,stepId); const f=stepFacts(c,step).find(x=>x.f.paper&&!x.f.ours&&x.r.m!=='ok'); if(!f) return; const p=f.f.paper; papersOf(c)[p]= p==='coi' ? {state:'current', on:NOW_WORDS, expires:'Mar 1, 2027', words:`came in from their portal today, current to Mar 1, 2027`} : {state:'signed', on:NOW_WORDS, words:`signed in their portal today`}; const moved=recheck(c); messages.push({id:++seq,c:cid,job:null,ch:'event',dir:'team',who:'the app',at:NOW+messages.length,text:`${firstName(c)}'s ${PAPER_SHORT[p]} came in from the portal${stepState(c,stepId)==='done'?' · '+step.name+' done':''}`}); closeCard(); render(); toast(moved?`${step.name} is done by itself; nobody pressed anything.`:`${PAPER_NAMES[p].replace(/^\w/,ch=>ch.toUpperCase())} came in.`); }
function nudgeNow(cid, stepId){ const c=cById(cid); const st=S(c); st.nudged=st.nudged||{}; st.nudged[stepId]=NOW; delete (st.hold||{})[stepId]; askFor(cid, stepId, (stepById(c.kind,stepId).papers||[]).find(p=>{ const f=FACTS.find(x=>x.paper===p); return f && !f.ours && factRead(c,f.id).m!=='ok'; })); toast('The Follow up row is there today, and the line is in the box.'); }
function holdNudge(cid, stepId){ const st=S(cById(cid)); st.hold=st.hold||{}; st.hold[stepId]='Mon Oct 5'; refreshCard(); toast('Held until Monday; the Follow up row waits.'); }
function addStepNote(cid, stepId){ const c=cById(cid); const step=stepById(c.kind,stepId); modal(`A note on ${esc(step.name)}`, `<div class="f"><label>For the team</label><textarea id="sn-text" rows="3" placeholder="Why it is where it is…"></textarea></div><p class="note">It reads on the step's card and in the thread as a team note, with the step on it.</p>`, ()=>{ const t=(document.getElementById('sn-text').value||'').trim(); if(!t){ toast('Write the note, or Not now.'); return false; } const st=S(c); st.notes[stepId]=st.notes[stepId]||[]; st.notes[stepId].push({by:ME, when:NOW_WORDS, text:t}); messages.push({id:++seq,c:cid,job:c.def,ch:'note',dir:'team',who:`${ME} · note for the team · on ${step.name}`,at:NOW+messages.length,text:t,step:stepId}); render(); refreshCard(); toast('Noted on the step and in the thread.'); }); }
function skipStep(cid, stepId){ const c=cById(cid); const step=stepById(c.kind,stepId); modal(`${esc(step.name)} does not apply to ${esc(firstName(c))}`, `<div class="f"><label>Why</label><input id="sk-why" placeholder="e.g. a supplier, no MSA"></div><p class="note">Skips the step for ${esc(firstName(c))} alone; the flow moves on to the next. The step stays for everyone else.</p>`, ()=>{ const t=(document.getElementById('sk-why').value||'').trim(); if(!t){ toast('Say why, or Not now.'); return false; } const st=S(c); st.skipped[stepId]=t; if(st.now===stepId){ const order=flat(c.kind); const i=order.findIndex(s=>s.id===stepId); const next=order.slice(i+1).find(s=>!st.skipped[s.id]&&!st.done.includes(s.id)); st.now=next?next.id:null; if(next) st.since[next.id]=NOW; } messages.push({id:++seq,c:cid,job:null,ch:'event',dir:'team',who:ME,at:NOW+messages.length,text:`${ME} marked ${step.name} as not applying to ${firstName(c)}: ${t}`}); closeCard(); render(); toast(`${step.name} skipped for ${firstName(c)}.`); }); }
function unskipStep(cid, stepId){ const c=cById(cid); const st=S(c); delete st.skipped[stepId]; if(!st.now || flat(c.kind).findIndex(s=>s.id===stepId) < flat(c.kind).findIndex(s=>s.id===st.now)){ st.now=stepId; st.since[stepId]=NOW; } closeCard(); render(); toast('Back on the flow.'); }
function putBackOn(cid){ const c=cById(cid); modal(`Put ${esc(firstName(c))} back on the flow`, `<div class="f"><label>Why</label><input id="pb-why" placeholder="e.g. a new bid, or they called back"></div><p class="note">${esc(firstName(c))} re-enters at the step the facts say, not at the start.</p>`, ()=>{ const t=(document.getElementById('pb-why').value||'').trim(); if(!t){ toast('Say why, or Not now.'); return false; } const st=S(c); st.off=null; st.outcome=null; st.done=st.done.filter(x=>x!=='yes'); st.now='yes'; st.since.yes=NOW; messages.push({id:++seq,c:cid,job:null,ch:'event',dir:'team',who:ME,at:NOW+messages.length,text:`${ME} put ${firstName(c)} back on the flow: ${t}`}); closeCard(); render(); toast('Back on the flow at Said yes.'); }); }
// The per-job lane draws one job; its caption lists the person's jobs with the step each is on (v1.96).

const FLOW_REMOVED = {trade:[], customer:[], arch:[]};
const deep = x => JSON.parse(JSON.stringify(x));
function editBegin(kind, what){ if(!flowSnap || flowSnap.kind!==kind){ flowSnap={kind, flows:deep(FLOWS[kind]), people:{}, what:[]}; for(const c of contacts.filter(x=>x.kind===kind)) flowSnap.people[c.id]=S(c).now; } flowSnap.what.push(what); }

// Where a person would be if the flow were read now: the first step in order that is not done, not skipped, not true.
function wouldBeNow(c){ const st=S(c); for(const s of flat(c.kind)){ if(st.skipped[s.id]) continue; if(st.done.includes(s.id) && !stepFacts(c,s).some(x=>x.r.m==='bad')) continue; if(s.loop){ if(st.now===s.id) return s.id; continue; } if(!stepTrue(c,s)) return s.id; } return null; }
function flowSave(){ if(!flowSnap) return; const kind=flowSnap.kind; let moved=0; for(const c of contacts.filter(x=>x.kind===kind)){ const w=wouldBeNow(c); const st=S(c); if(w!==st.now){ moved++; if(st.now && !st.done.includes(st.now) && stepTrue(c,stepById(kind,st.now)||{facts:[]})) st.done.push(st.now); st.now=w; if(w) st.since[w]=st.since[w]||NOW; } } FLOW_HISTORY[kind]=FLOW_HISTORY[kind]||[]; FLOW_HISTORY[kind].unshift({by:ME, when:NOW_WORDS, what:flowSnap.what.join('; ')}); flowSnap=null; render(); toast(moved?`Saved. ${moved} ${moved===1?'person moved':'people moved'} with it.`:'Saved. Nobody moved.'); }
function flowPutBack(){ if(!flowSnap) return; FLOWS[flowSnap.kind]=flowSnap.flows; flowSnap=null; editDone(); toast('Put back as it was.'); }
function renameStep(kind,id,v){ const s=stepById(kind,id); if(s&&v.trim()&&v.trim()!==s.name){ editBegin(kind, `${s.name} renamed ${v.trim()}`); s.name=v.trim(); refreshFlowWords(); toast('Renamed in every panel.'); } }
function setStepEs(kind,id,v){ const s=stepById(kind,id); if(s){ editBegin(kind, `${s.name}: Spanish name`); s.es=v.trim(); } }
function setStepWho(kind,id,v){ const s=stepById(kind,id); editBegin(kind, `${s.name}: whose move → ${v}`); s.who=v; if(v!=='us') delete s.seat; else s.seat=s.seat||'Robert'; editDone(); }
function setStepSeat(kind,id,v){ const s=stepById(kind,id); editBegin(kind, `${s.name}: seat → ${v}`); s.seat=v; editDone(); }
function setNudge(kind,id,field,v){ const s=stepById(kind,id); editBegin(kind, `${s.name}: nudge ${field} → ${v}`); if(field==='off'){ s.nudge=null; } else { s.nudge=s.nudge||{days:3, how:'a text', send:'ask'}; if(field==='days') s.nudge.days=+v; else s.nudge[field]=v; } editDone(); }
function setRepeat(kind,id,v){ const s=stepById(kind,id); editBegin(kind, `${s.name}: repeats → ${v||'no'}`); if(v) s.loop=v; else delete s.loop; editDone(); }
function setJoin(kind,id){ const s=stepById(kind,id); const j=s.join==='or'?'and':'or'; editBegin(kind, `${s.name}: facts joined with ${j}`); s.join=j; s.dec = j==='or'; editDone(); }
function addFact(kind,id,fid){ const s=stepById(kind,id); if(s.facts.includes(fid)) return; editBegin(kind, `${s.name}: + ${factById(fid).text}`); s.facts.push(fid); if(s.facts.length>1 && !s.join) s.join='and'; closeWho(); editDone(); }
function dropFact(kind,id,fid){ const s=stepById(kind,id); editBegin(kind, `${s.name}: − ${factById(fid).text}`); s.facts=s.facts.filter(x=>x!==fid); editDone(); }
function addPaper(kind,id,p){ const s=stepById(kind,id); if(s.papers.includes(p)) return; editBegin(kind, `${s.name}: + paper ${PAPER_SHORT[p]}`); s.papers.push(p); closeWho(); editDone(); }

    if(v!==q.text){ q.versions.push(V(ME,qrNowWords(),'words',v,q.text)); q.text=v; changed=true; }

// Why the opt-out line is on this text, if it is (v1.86): 'first' for the first text we ever send the number, 'silence' when our
// last text to them is 30 days or more old (OPTOUT_SILENCE_DAYS), '' when the conversation is live. The carriers' rule for a
// registered business number; a person may hold it back once when the reason is only the silence, never on a first text.
const OPTOUT_SILENCE_DAYS = 30;
function optoutReason(c){ const ours=messages.filter(m=>m.c===c.id&&m.ch==='text'&&m.dir==='out').sort((a,b)=>b.at-a.at); if(!ours.length) return 'first'; const days=(NOW-ours[0].at)/86400000; return days>=OPTOUT_SILENCE_DAYS ? 'silence' : ''; }

      ${!c.emails.length?'<div class="pv-warn">They have no email on file. Add one on the To line and the email can go.</div>':''}
      `; footNote='The subject comes from the job and your first line, or your own words on it; the greeting from their contact name; the letterhead from who the job is for (Click Construction on a GC job); the signature from your account, your title and your cell if you have one there. Nothing here is typed twice.';
    } else { const prior=[...messages].filter(m=>m.c===c.id&&m.ch==='text').sort((a,b)=>a.at-b.at).slice(-2); const segs=Math.max(1,Math.ceil(body.length/160)); const reason=optoutReason(c); const withLine = reason && !(reason==='silence'&&optoutHeld); const footer=withLine?`\n\n${OPTOUT_LINE}`:''; const linkText=linkLines(draftFiles).map(l=>`\n${l.text}${l.link}`).join(''); const full=body+linkText+footer; const fsegs=Math.max(1,Math.ceil(full.length/160)); const lastOurs=messages.filter(m=>m.c===c.id&&m.ch==='text'&&m.dir==='out').sort((a,b)=>b.at-a.at)[0]; const quietDays=lastOurs?Math.round((NOW-lastOurs.at)/86400000):0;
      html=`${tabs}<p class="note">What ${esc(c.name)} sees on their phone, under the texts already there.</p>
      <div class="to-line"><b>To:</b> ${toLine(c,'phone')}</div>
      <div class="phone"><div class="bar"><b>${COMPANY.name}</b>${COMPANY.phone}</div><div class="screen">
        ${prior.map(m=>`<div class="bub ${m.dir==='in'?'them':'us'}">${esc(m.text)}</div>`).join('')}
        <div class="stamp">Today 10:32 AM</div>
        <div class="bub us new">${esc(body)}${linkLines(draftFiles).map(l=>`\n${esc(l.text)}<u>${l.link}</u>`).join('')}</div>${draftFiles.filter(f=>f.from==='photo').map(f=>`<div class="bub us pic" title="${esc(f.name)}"><span class="thumb"></span></div>`).join('')}${withLine?`<div class="bub us legal" data-tip="Added by the app|${reason==='first'?'Their first text from us carries the company name and the opt-out line the carriers require.':'Our last text to them was '+quietDays+' days ago, so the line goes on again, as the carriers ask after a quiet spell.'}|It goes as its own bubble, so it never reads as your words.">${esc(OPTOUT_LINE)}<span class="lg">added by the app · ${reason==='first'?'required on a first text':'after '+quietDays+' quiet days'}</span></div>`:''}<div class="dl">Delivered</div></div></div>
      ${reason==='silence'?`<div class="legal-note">${optoutHeld?`The opt-out line is held back this time; you said the ${quietDays} quiet days do not make a stranger of ${esc(firstName(c))}. <button type="button" class="quiet small hold" onclick="optoutHeld=false;window.__pvPaint()">Put it back</button>`:`The line is on because our last text was ${quietDays} days ago. <button type="button" class="quiet small hold" data-tip="Leave it off this time|Holds the opt-out line back on this one text.|Only when the reason is the quiet spell, never on a first text. The message keeps a note that you held it back." onclick="optoutHeld=true;window.__pvPaint()">Leave it off this time</button>`}</div>`:''}
      ${c.optout?'<div class="pv-warn">They sent STOP. The app will not send this text.</div>':''}
      ${!c.phones.length?'<div class="pv-warn">They have no mobile number on file. Add one on the To line and the text can go.</div>':''}
      ${fsegs>2?`<div class="pv-warn">${full.length} characters is ${fsegs} texts${withLine?', with the opt-out line':''}. Long texts arrive in pieces on some phones; an email may read better.</div>`:''}
      <div class="pv-note">${full.length} characters · ${fsegs} text${fsegs>1?'s':''}${draftFiles.some(f=>f.from==='photo')?' · the photo goes as a picture message':''}${draftFiles.some(f=>f.from!=='photo')?' · a text cannot carry a file, so each goes as our link, to their portal when it has a page there, else to the file in the job\'s Drive folder':''}. Sent from the company number, so their reply lands back in this thread whoever answers.</div>`; }
    return html; };
  const bg=document.createElement('div'); bg.className='modal-bg'; const m=document.createElement('div'); m.className='modal wide'; bg.appendChild(m);
  const paint=()=>{ m.innerHTML=`<h2>Before it goes, this is what they see</h2>${draw()}<div class="after ${afterMove}"><span class="al">After this sends:</span> <span class="seg"><button type="button" class="${afterMove==='theirs'?'on':''}" data-tip="Their move|${c.owe?'This message gets '+esc(c.owe.what)+' done. We are waiting on them.':'We are waiting on them.'}|${c.owe?'What we owe clears when this goes; the row leaves We owe them.':'Nothing is on us after this goes.'}" onclick="window.__after('theirs')">Their move</button><button type="button" class="${afterMove==='ours'?'on':''}" data-tip="Our move|${c.owe?'We still owe '+esc(c.owe.what)+' after this goes.':'Something is still on us after this goes.'}|Follow up keeps it under We owe them until it is done." onclick="window.__after('ours')">Our move</button></span> <span class="aw">${afterMove==='theirs'?(c.owe?`This message gets <span class="fill">${esc(c.owe.what)}</span> done.`:`Nothing is on us.`):(c.owe?`We still owe <span class="fill">${esc(c.owe.what)}</span>${c.owe.by?' by <span class="fill">'+esc(c.owe.by)+'</span>':''}.`:`<span style="white-space:nowrap">We still owe <span class="to-box"><input id="owew" placeholder="what?" autocomplete="off"></span> by <span class="to-box"><input id="oweb" placeholder="when?" autocomplete="off"></span></span>`)}</span></div><div class="btns"><button onclick="this.closest('.modal-bg').remove()">Change it</button><button onclick="toast('A test copy went to your own address.')">Send a test to me</button><button class="primary" ${cur==='text'&&(c.optout||!c.phones.length)?'disabled':''} ${cur==='email'&&!c.emails.length?'disabled':''} onclick="window.__oweFromSend('${c.id}');replyKind='${cur}';this.closest('.modal-bg').remove();render();document.getElementById('box').value=window.__pvBody;sendReply('${c.id}')">Send as ${cur}</button></div>${footNote?`<div class="pv-note foot">${footNote}</div>`:''}`; };
  window.__pvBody=body; window.__pvSet=k=>{cur=k;toEditing=null;paint();}; window.__pvPaint=paint; window.__after=v=>{ afterMove=v; paint(); if(v==='ours') setTimeout(()=>document.getElementById('owew')?.focus(),0); }; window.__oweFromSend=cid=>{ const cc0=cById(cid); if(cc0.owe && afterMove==='theirs'){ pendingSettle={what:cc0.owe.what, by:cc0.owe.by}; } if(!cc0.owe && afterMove==='ours'){ const w=(document.getElementById('owew')?.value||'').trim(); if(w){ const cc=cById(cid); cc.owe={what:w, by:(document.getElementById('oweb')?.value||'').trim()||null, since:NOW_WORDS, at:NOW, who:ME}; messages.push({id:++seq,c:cid,job:null,ch:'event',dir:'team',who:ME,at:NOW+messages.length,text:`${ME} marked that we owe ${cc.name} ${w}${cc.owe.by?' by '+cc.owe.by:''}.`}); } } }; paint(); document.body.appendChild(bg); bg.onclick=e=>{ if(e.target===bg) bg.remove(); }; }

// ---------- modal / sheet ----------
function modal(title, body, onOk){ const bg=document.createElement('div'); bg.className='modal-bg'; bg.innerHTML=`<div class="modal"><h2>${title}</h2>${body}<div class="btns"><button id="mcancel">Not now</button><button class="primary" id="mok">Save</button></div></div>`; document.body.appendChild(bg); bg.querySelector('#mcancel').onclick=()=>bg.remove(); bg.querySelector('#mok').onclick=()=>{ if(onOk()!==false) bg.remove(); }; bg.onclick=e=>{ if(e.target===bg) bg.remove(); }; const f=bg.querySelector('input'); if(f) f.focus(); }
function sheet(title, optsHtml){ closeSheet(); const s=document.createElement('div'); s.className='sheet'; s.id='sheet'; s.innerHTML=`<h2>${title}</h2><div class="opts">${optsHtml}<button class="quiet" onclick="closeSheet()">Cancel</button></div>`; document.body.appendChild(s); }
function closeSheet(){ document.getElementById('sheet')?.remove(); }

// ---------- hover cards: what a control does, and what it changes ----------
// The card's calendar (the owner, 2026-10-11): the last weeks as rows, S M T W T F S, each day colored by who wrote that
// day (blue us, green them, both split), a yellow dot for a team note, today outlined, days to come dashed. Six weeks, or back
// to the first message when that is sooner.
function stampCalendar(c){ const DAY=86400000; const mine=messages.filter(m=>m.c===c.id&&m.ch!=='event'); if(!mine.length) return '';
  const key=ts=>new Date(ts).toDateString(); const byDay={}; for(const m of mine){ const k=key(m.at); const d=byDay[k]=byDay[k]||{inN:0,outN:0,note:0}; if(m.dir==='in') d.inN++; else if(m.dir==='out') d.outN++; else d.note++; }
  const today=new Date(NOW); today.setHours(0,0,0,0); const first=new Date(Math.min(...mine.map(m=>m.at))); first.setHours(0,0,0,0);
  const sixWeeksBack=new Date(today.getTime()-DAY*41); const start=new Date(Math.max(first.getTime(), sixWeeksBack.getTime())); start.setDate(start.getDate()-start.getDay());
  const end=new Date(today); end.setDate(end.getDate()+(6-end.getDay()));
  let html='<div class="cal">'+['S','M','T','W','T','F','S'].map(h=>`<span class="h">${h}</span>`).join('')+'<span></span>';
  const md=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  for(let w=new Date(start); w<=end; w.setDate(w.getDate()+7)){ const m1=new Date(w), m2=new Date(w); m2.setDate(m2.getDate()+6); const thisWeek=today>=m1&&today<=m2; const lbl=`${md(m1)} – ${m2.getMonth()===m1.getMonth()?m2.getDate():md(m2)}${thisWeek?' · this week':''}`;
    for(let d=0; d<7; d++){ const day=new Date(w); day.setDate(day.getDate()+d); const k=key(day); const v=byDay[k]; const fut=day>today; const cls=['c', fut?'future':'', v?(v.inN&&v.outN?'both':v.inN?'them':v.outN?'us':''):'', v&&v.note?'note':'', day.getTime()===today.getTime()?'today':''].filter(Boolean).join(' '); const n=v?v.inN+v.outN:0; html+=`<span class="${cls}">${n>1?n:''}</span>`; } html+=`<span class="m">${lbl}</span>`; }
  html+='</div><div class="callg"><span><i class="us"></i>us</span><span><i class="them"></i>them</span><span><i class="both"></i>both</span><span><i class="note"></i>a team note</span><span><i class="today"></i>today</span><span>· a number is how many that day</span></div>';
  return html; }
// A card may carry a legend (data-tip-legend), drawn when it opens from the page's own state, so the sample chips are the real ones.
const TIP_LEGENDS = {
  stamps(){ const c=cById(openContact); if(!c) return ''; const i=lastInOnly(c), o=lastOut(c);
    return `<div class="leg"><div><b style="width:36px;text-align:right;flex:none">Them</b><span class="w">${i?esc(stampFull(i)):'nothing yet'}</span></div><div><b style="width:36px;text-align:right;flex:none">Us</b><span class="w">${o?esc(stampFull(o)):'nothing yet'}</span></div></div>${stampCalendar(c)}`; },
  jobs(){ const c=cById(openContact); if(!c) return ''; const nm=id=>jobById(id)?jobById(id).name:''; const def=c.def?nm(c.def):null; const blueId=jobFilter||c.jobs.find(j=>j!==c.def)||c.def; const blue=blueId?nm(blueId):'a job'; const blueJ=blueId?jobById(blueId):null; const defJ=c.def?jobById(c.def):null; const first=firstName(c);
    return `<div class="leg">
      <div><span class="jobtile mini on"><span class="ln"><span class="num ${blueJ?blueJ.kind:'bid'}">${esc(blueJ?jobNum(blueJ):'B?')}</span><span class="nm">${esc(blue)}</span></span></span><span class="w"><b>Blue</b> is what you are looking at: the thread shows only the lines tied to that job. Click it again, or <i>show all</i>, to see everything.</span></div>
      <div><span class="jobtile mini"><span class="ln"><span class="star">★</span>${defJ?`<span class="num ${defJ.kind}">${esc(jobNum(defJ))}</span>`:''}<span class="nm">${esc(def||'none yet')}</span></span></span><span class="w"><b>The gold star</b> is where new messages from ${esc(first)} land until someone changes it. Click ☆ on another job to move it. It never changes what you are looking at.</span></div>
      <div><span class="jobchip" style="color:var(--text-muted)">⧉ ×</span><span class="w">⧉ opens the job's card; × takes the job off ${esc(first)} (the lines tied to it keep their tie). The second line is the job's day in words: a bid's day, a project's stage, a Pipeline job's step.</span></div>
      <div><span class="jobchip ghost">drag</span><span class="w">Drag a tile onto a line to tie that one message there; press and hold on a phone. A line with no job sits on the person alone.</span></div>
    </div>`; }
};
(function(){ const tip=document.createElement('div'); tip.className='tip'; document.body.appendChild(tip); let timer=null, cur=null;
  const show=el=>{ const [head,what,changes]=el.dataset.tip.split('|'); const [lk,la]=(el.dataset.tipLegend||'').split(':'); const leg=lk&&TIP_LEGENDS[lk]?TIP_LEGENDS[lk](la):''; tip.innerHTML=`<b>${esc(head)}</b>${what?`<p class="what">${esc(what)}</p>`:''}${changes?`<p class="changes">${esc(changes)}</p>`:''}${leg}`; const r=el.getBoundingClientRect(); tip.style.left='0px'; tip.style.top='0px'; tip.classList.add('show'); const w=tip.offsetWidth, h=tip.offsetHeight; let x=r.left+r.width/2-w/2, y=r.bottom+8; if(x<8) x=8; if(x+w>window.innerWidth-8) x=window.innerWidth-8-w; if(y+h>window.innerHeight-8) y=Math.max(8, window.innerHeight-8-h); tip.style.left=x+'px'; tip.style.top=y+'px'; };
  const hide=()=>{ clearTimeout(timer); tip.classList.remove('show'); cur=null; };
  document.addEventListener('mouseover',e=>{ const el=e.target.closest('[data-tip]'); if(!el||el===cur) return; hide(); cur=el; timer=setTimeout(()=>show(el),300); });
  document.addEventListener('mouseout',e=>{ const el=e.target.closest('[data-tip]'); if(el&&el===cur&&!el.contains(e.relatedTarget)) hide(); });
  document.addEventListener('focusin',e=>{ const el=e.target.closest('[data-tip]'); if(el){ cur=el; show(el); } });
  document.addEventListener('focusout',hide); document.addEventListener('click',()=>setTimeout(hide,0),true); window.addEventListener('scroll',hide,true); })();

window.addEventListener('resize',()=>render());
render();
</script>
