<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Messages prototype</title>
<meta name="description" content="Prototype: every call, text and email with a contact in one place; jobs hang off the contact; a message can be tied to one job. GC mode, Click Construction. Made-up people. Nothing is saved.">
<style>
:root{--bg:#f6f7f9;--surface:#fff;--text:#1b1f24;--text-muted:#5c6470;--border:#dde1e6;--accent:#1f5fbf;--accent-soft:#e8f0fc;--team:#fff6c2;--team-border:#e9d77a;--warn:#b35c00;--warn-soft:#fff1e0;--ok:#1a7f3c;--ok-soft:#e6f6ec;--danger:#b3261e;--chip:#eef1f5;--radius:10px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:6px 10px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.quiet{border-color:transparent;background:transparent;color:var(--accent);padding:4px 6px}
button.small{padding:3px 8px;font-size:13px}
button:disabled{opacity:.45;cursor:not-allowed}
button.danger{color:var(--danger);border-color:#f0c2be;background:var(--surface)}
.modal .facts2{display:flex;flex-direction:column;gap:8px;margin:10px 0 4px;font-size:14px;line-height:1.4}
.modal .facts2 div{display:flex;gap:10px;align-items:flex-start}
.modal .facts2 .k{flex:none;width:22px;text-align:center;font-size:15px}
.modal .facts2 b{font-weight:600}
input,select,textarea{font:inherit;border:1px solid var(--border);border-radius:8px;padding:7px 9px;background:var(--surface);color:var(--text)}
header.top{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 16px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header.top .brand{font-weight:700;margin-right:8px}
header.top nav{display:flex;gap:4px;flex-wrap:wrap}
header.top nav button{border-color:transparent;background:transparent;padding:6px 10px;border-radius:999px}
header.top nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--danger);color:#fff;font-size:12px;line-height:20px;text-align:center;margin-left:4px}
header.top .me{margin-left:auto;color:var(--text-muted);font-size:13px}
main{max-width:1180px;margin:0 auto;padding:16px}
.note{color:var(--text-muted);font-size:13px}
.lead{margin:0 0 12px;font-size:17px}
.two{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px}
.two.collapsed{grid-template-columns:64px minmax(0,1fr)}
.two.with-flow{grid-template-columns:340px minmax(0,1fr) 300px}
.two.with-flow.collapsed{grid-template-columns:64px minmax(0,1fr) 300px}
.two.with-frail{grid-template-columns:340px minmax(0,1fr) 64px}
.two.with-frail.collapsed{grid-template-columns:64px minmax(0,1fr) 64px}
@media(max-width:1040px){.two.with-flow,.two.with-flow.collapsed{grid-template-columns:64px minmax(0,1fr) 280px}}
/* 761–860 px: the people list is hidden (narrow), so the grid must not keep its column; the thread and the flow share the row (v1.47) */
@media(min-width:761px) and (max-width:860px){.two.with-flow,.two.with-flow.collapsed{grid-template-columns:minmax(0,1fr) 280px}}
@media(max-width:760px){.two.with-flow,.two.with-flow.collapsed{grid-template-columns:minmax(0,1fr)}.two.with-flow .list,.two.with-flow .rail{display:none}.fpanel{position:static;max-height:none}}
.fpanel{background:#fbfbfc;align-self:start;position:sticky;top:58px;max-height:calc(100vh - 74px);overflow:auto}
.rail{align-self:start;position:sticky;top:58px}
.frail{align-self:start;position:sticky;top:58px;display:flex;flex-direction:column;align-items:center;padding:8px 4px 10px;gap:0}
.frail .open{font-size:14px;color:var(--accent);border:1px solid var(--border);border-radius:50%;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;background:var(--surface);margin-bottom:6px;padding:0;cursor:pointer}
.frail .lane{font-size:9px;letter-spacing:.6px;color:var(--text-muted);text-transform:uppercase;margin:6px 0 2px}
.frail .stepw{display:flex;flex-direction:column;align-items:center}
.frail .st{width:16px;height:16px;border-radius:50%;border:2px solid #cfd5dd;background:var(--surface);box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer;color:var(--text-muted)}
.frail .st.done{background:var(--ok);border-color:var(--ok);color:#fff}
.frail .st.now{border-color:var(--warn);background:var(--warn-soft);width:20px;height:20px}
.frail .st.now::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--warn)}
.frail .st.now.them{border-color:var(--ok);background:var(--ok-soft)}.frail .st.now.them::after{background:var(--ok)}
.frail .st.dec{border-radius:4px}
.frail .ln{width:2px;height:10px;background:var(--border)}.frail .ln.done{background:var(--ok)}
.frail .tag{font-size:9px;font-weight:700;padding:0 5px;border-radius:999px;margin-top:3px}
.frail .tag.us{background:var(--warn-soft);color:var(--warn)}.frail .tag.them{background:var(--ok-soft);color:var(--ok)}.frail .tag.both{background:var(--bg);color:var(--text-muted)}
.frail .cnt{font-size:11px;font-weight:700;color:var(--text);margin-top:8px}
.fpanel .ph2{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.fpanel .ph2 b{font-size:13px}
.flow{display:flex;flex-direction:column;gap:6px;font-size:12px}
.flow .lane{border:1px solid var(--border);border-radius:10px;padding:8px;background:var(--surface)}
.flow .lane .t{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.flow .boxes{display:flex;flex-direction:column;align-items:stretch;gap:2px}
.flow .box{border:1px solid var(--border);border-radius:7px;padding:6px 9px;background:var(--surface);position:relative;display:flex;align-items:center;gap:8px;font-size:12.5px}
.flow .box>span:first-child{flex:1;min-width:0}
.flow .box.done{background:var(--ok-soft);border-color:#bfe3c9;color:var(--ok)}
.flow .box.now{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);font-weight:600}
.flow .box.dec{border-left:4px solid #c9b7ea}
.flow .box.dec.done{border-left-color:#8fcf9f}
.flow .box.dec.now{border-left-color:var(--warn)}
.flow .arr{color:#9aa4b1;text-align:center;font-size:11px;line-height:1;margin:1px 0}
.flow .loop{border:1px dashed #c9d0d8;border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:4px}
.flow .loop .lt{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;padding:0 3px}
.flow .loop .rounds{display:flex;gap:4px;flex-wrap:wrap;padding:0 3px}
.flow .loop .rounds span{font-size:10.5px;border:1px solid var(--border);border-radius:999px;padding:0 6px;background:var(--surface)}
.flow .loop .rounds span.done{background:var(--ok-soft);border-color:#bfe3c9;color:var(--ok)}
.flow .loop .rounds span.now{background:var(--warn-soft);border-color:#f0d3b0;color:var(--warn)}
.flow .who{font-size:10px;border-radius:999px;padding:0 7px;border:1px solid;background:var(--surface);font-weight:700;flex:none;line-height:16px}
.flow .who.us{color:var(--warn);border-color:#f0d3b0;background:var(--warn-soft)}
.flow .who.them{color:var(--ok);border-color:#bfe3c9;background:var(--ok-soft)}
.flow .who.both{color:var(--text-muted);border-color:var(--border)}
.fnext{font-size:12px;color:var(--text-muted);margin-top:8px;border-top:1px solid var(--border);padding-top:8px}
.fnext b{color:var(--text)}
.feditor .tabs{display:flex;gap:6px;margin:6px 0 10px}
.feditor .tabs button{border-radius:999px}
.feditor .tabs button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.feditor table{width:100%;border-collapse:collapse;font-size:13px}
.feditor th{text-align:left;font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;border-bottom:1px solid var(--border)}
.feditor td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top}
.feditor td.g{color:var(--text-muted)}
.feditor td input{width:100%;padding:3px 6px}
.feditor .lanehead td{background:var(--bg);font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em}
.rail{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 6px}
.rail .avatar{cursor:pointer;position:relative;width:38px;height:38px}
.rail .avatar.on{outline:2px solid var(--accent);outline-offset:2px}
.rail .avatar .cd{position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border-radius:50%;border:2px solid var(--surface);background:#cfd5dd}
.rail .avatar .cd.ours{background:var(--warn)}.rail .avatar .cd.theirs{background:#1a7f3c}
.list .lhead{display:flex;align-items:center;gap:6px;padding:8px 10px 0}
.list .lhead input{flex:1;min-width:0}
.collapse{width:30px;height:30px;padding:0;border-radius:50%;font-size:15px;flex:none}
.two>*{min-width:0}
@media(max-width:860px){.two{grid-template-columns:1fr}.list.hidden-narrow{display:none}.two.with-frail{grid-template-columns:minmax(0,1fr) 64px}}
@media(max-width:760px){.two.with-frail,.two.with-frail.collapsed{grid-template-columns:minmax(0,1fr)}.frail{order:-1;position:static;flex-direction:row;flex-wrap:wrap;justify-content:center;padding:8px 10px;gap:0}.frail .lane{writing-mode:horizontal-tb;margin:0 8px 0 4px}.frail .ln{width:10px;height:2px}.frail .cnt{margin:0 0 0 8px}.frail .open{margin:0 8px 0 0}.frail .stepw{flex-direction:row}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px}
.list .row{display:flex;gap:10px;padding:10px;border-top:1px solid var(--border);cursor:pointer;align-items:flex-start}
.list .row:first-child{border-top:0}
.list .row.on{background:var(--accent-soft)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none;color:var(--text-muted)}
.avatar.cust{background:#e6f1ff;color:#1f5fbf}.avatar.trade{background:#eef7ea;color:#1a7f3c}.avatar.arch{background:#f3eaff;color:#6d3fb8}.avatar.unknown{background:#fff1e0;color:#b35c00}
.row .who{font-weight:600}
.row .sub{color:var(--text-muted);font-size:13px}
.row .last{font-size:14px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .right{margin-left:auto;text-align:right;font-size:12px;color:var(--text-muted);flex:none;max-width:132px}
.court.tiny{font-size:11px;padding:1px 7px 1px 5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-flex}
.list .row > div:nth-child(2){flex:1;min-width:0}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--chip);color:var(--text-muted);margin-right:4px}
.pill.waiting{background:var(--warn-soft);color:var(--warn)}
.pill.has{background:var(--accent-soft);color:var(--accent)}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.promise{background:#eef7ea;color:var(--ok)}
.pill.stop{background:#fde7e5;color:var(--danger)}
h2{font-size:18px;margin:0 0 8px}
h3{font-size:14px;margin:14px 0 6px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em}
.thread-head{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.hdr .row1{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hdr .row1 .name{flex:1 1 180px;min-width:0}
.hdr .row1 .corner{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.hdr .row1 h2{margin:0;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .row1 .email{font-size:13px;color:var(--text-muted);margin-top:1px}
.hdr .row2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 0;color:var(--text-muted);font-size:14px}
.court{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:2px 9px 2px 7px;border-radius:999px;border:1px solid var(--border);background:var(--surface)}
.court i{width:9px;height:9px;border-radius:50%;background:#cfd5dd;display:inline-block}
.court.ours{color:var(--warn);border-color:#f0d3b0;background:var(--warn-soft)}.court.ours i{background:var(--warn)}
.court.theirs{color:#1a7f3c;border-color:#bfe3c9;background:#eef7ea}.court.theirs i{background:#1a7f3c}
.court.none{color:var(--text-muted)}
button.court{cursor:pointer;line-height:inherit}button.court:hover{filter:brightness(.97)}
.whopick .ph b{color:var(--text)}
.stamps{margin-left:auto;display:grid;grid-template-columns:auto auto;column-gap:8px;row-gap:1px;font-size:12px;color:var(--text-muted);text-align:right;flex-shrink:0;align-self:flex-start}
.stamps b{font-weight:600;color:var(--text)}.stamps span{white-space:nowrap}
.hdr .row3{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;margin:6px 0 0}.hdr .row3 .court,.hdr .row3>button{margin-top:1px}
.thread{container-type:inline-size}
/* The conversation sits in a tinted well between the header and the reply box (v1.68, thread-regions-mockups A): a shade
   of its own, so the card still reads as a card and the well as the band inside it that moves. */
.thread #lines{background:#eef1f5;margin:10px -12px 0;padding:6px 12px 10px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);flex:1}
.thread .msg.in{background:var(--surface)}
/* The thread as a window (v1.69, thread-regions-mockups B, the second step of D): the card takes the window's height, the name
   row pins at the top and the reply box at the bottom, and the rest of the header scrolls away with the conversation. */
.thread.card{padding:0;position:sticky;top:var(--hdrh,58px);height:calc(100vh - var(--hdrh,58px) - 32px);display:flex;flex-direction:column}
.thread .hdr-top{padding:12px 12px 8px;box-shadow:0 6px 14px -10px rgba(0,0,0,.3);position:relative;z-index:2;background:var(--surface);border-radius:var(--radius) var(--radius) 0 0}
.thread .scrollarea{flex:1;min-height:0;overflow:auto;padding:0 12px;display:flex;flex-direction:column}
.thread .hdr-rest{flex:none}
.thread .reply{flex:none;border-top:0;margin-top:0;padding:10px 12px 12px;box-shadow:0 -6px 14px -10px rgba(0,0,0,.3);position:relative;z-index:2;background:var(--surface);border-radius:0 0 var(--radius) var(--radius)}
.list.card{position:sticky;top:var(--hdrh,58px);max-height:calc(100vh - var(--hdrh,58px) - 32px);overflow:auto;align-self:start}
/* The composer band stays short: the quick replies' groups scroll inside a bounded box, the step's group at the top. */
.thread .quickwrap .qgroups{max-height:118px;overflow:auto;scrollbar-width:thin;mask-image:linear-gradient(#000 calc(100% - 18px),transparent);-webkit-mask-image:linear-gradient(#000 calc(100% - 18px),transparent);padding-bottom:14px}
@container (max-width: 640px){ .quickwrap .ql > span:not(.gpills){display:none} .quickwrap .ql .qfilter{flex:1;min-width:90px} }
.hdr .row1 .sub2,.hdr .corner .statepill,.stamps .diff,.stamps .short,.hdr .jobs-rail .sep{display:none}
.hdr .row2 a.fact{color:inherit;text-decoration:none}
.statepill{display:none;align-items:center;gap:4px;border:1px solid var(--accent);border-radius:999px;padding:3px 10px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:600;white-space:nowrap}
.statepill.snoozed{border-color:var(--border);background:var(--chip);color:var(--text-muted)}.statepill.done{border-color:#bfe3c9;background:var(--ok-soft);color:var(--ok)}
.ago{font-size:11.5px;font-weight:700;color:var(--text-muted);cursor:help;display:inline-block}
.stampsn{display:none;width:100%;margin-top:2px;font-size:13px;color:var(--text-muted);cursor:help;line-height:1.35}
.stampsn b{color:var(--text);font-weight:600}
.stamps .diff{font-size:11px;font-weight:700;border:1px solid var(--border);border-radius:999px;padding:0 6px;color:var(--text-muted);background:var(--surface);cursor:help;line-height:16px}
.stamps .diff.behind{color:var(--warn);border-color:#f0d3b0;background:var(--warn-soft)}.stamps .diff.ahead{color:var(--ok);border-color:#bfe3c9;background:var(--ok-soft)}
@container (max-width: 640px){
  .hdr .row1{flex-wrap:nowrap;gap:10px}.hdr .row1 .name{flex:1 1 0}.hdr .row1 h2{font-size:18px}.hdr .row1 .sub2{display:block;font-size:13px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hdr .row1 .sub2 b{font-weight:600;color:var(--text)}
  .hdr .corner{flex-wrap:nowrap;gap:6px}.hdr .corner .seg{display:none}.hdr .corner .statepill{display:inline-flex}
  .haspill .lbl,.haspill .since{display:none}.haspill{padding-right:8px}
  .hdr .row2 .kindco,.hdr .row2 .sepdot{display:none}.hdr .row2{gap:4px 10px}.hdr .row2 a.fact{color:var(--accent)}
  .stamps{display:none}.stampsn{display:block}
  .hdr .tools{display:flex;gap:6px;overflow-x:auto;align-items:center;margin:10px 0 2px;padding:8px 2px 6px;border-top:1px solid var(--border);scrollbar-width:thin;mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent);-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent)}
  .hdr .tools>.toolbar,.hdr .tools>.jobs-rail{display:contents}.hdr .tools>*>*{flex:none;white-space:nowrap}.hdr .tools .jobs-rail .lbl{display:none}.hdr .jobs-rail .sep{display:inline-block;width:1px;height:22px;background:var(--border);margin:0 4px}.jobtile{width:220px}.hdr .tools .jobs-rail .tiles{display:contents}
}

.hdr .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 0;padding-top:8px;border-top:1px solid var(--border)}
.hdr .toolbar .grow{flex:1}
.hdr .jobs-rail{margin:10px 0 2px}
.hdr .jobs-rail{flex-wrap:nowrap;align-items:flex-start}
.hdr .jobs-rail .lbl{width:54px;white-space:normal;line-height:1.15;flex:none;text-align:right;padding-right:8px;border-right:1px solid var(--border);align-self:stretch;display:flex;align-items:center;justify-content:flex-end}

.thread-head .avatar{width:44px;height:44px;font-size:15px}

.backav .avatar{width:44px;height:44px;font-size:15px}
.backav:hover{background:var(--accent-soft)}.backav:hover .avatar{outline:2px solid var(--accent);outline-offset:1px}

// nobody has named reads "they". Hover the sentence for the card with the exact stamps and the calendar.
function whenWords(ts){ const n=dayDiff(NOW,ts); if(n<=0) return `today at ${fmt(ts)}`; if(n===1) return 'yesterday';
  if(n<=6){ const d=new Date(ts); const wd=d.toLocaleDateString('en-US',{weekday:'long'}); const today=new Date(NOW); const thisSun=new Date(today); thisSun.setHours(0,0,0,0); thisSun.setDate(thisSun.getDate()-thisSun.getDay()); return d>=thisSun?`on ${wd}`:`last ${wd}`; }
  const thisSun=new Date(NOW); thisSun.setHours(0,0,0,0); thisSun.setDate(thisSun.getDate()-thisSun.getDay()); const weeksBack=Math.floor((thisSun-new Date(ts).setHours(0,0,0,0))/(7*86400000))+1;
  if(weeksBack===1) return 'last week'; if(weeksBack===2) return 'two weeks ago'; if(weeksBack===3) return 'three weeks ago';
  return 'on '+new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
const verbOf = m => ({text:'texted',email:'emailed',call:'called',voicemail:'left a voicemail',missed:'called'})[m.ch]||'wrote';
const verbTail = m => m.ch==='missed' ? ', no voicemail' : '';
function stampSentence(c,i,o){ const who = c.kind==='unknown' ? 'They' : esc(c.name.split(' ').filter(w=>!/^dr\.?$/i.test(w))[0]);
  const them = i ? `${who} ${verbOf(i)} <b>${whenWords(i.at)}</b>${verbTail(i)}` : `${who} ${c.kind==='unknown'?'have':'has'} not written yet`;
  const us = o ? `we ${verbOf(o)} <b>${whenWords(o.at)}</b>${verbTail(o)}` : 'we have not written yet';
  const themFirst = !o || (i && i.at>o.at); const [a,b] = themFirst ? [them, us] : [us.replace(/^we/,'We'), them.replace(/^They /,'they ')];
  return `<span class="stampsn" data-tip="Them and Us||" data-tip-legend="stamps">${a}; ${b}.</span>`; }
const courtShort = c => { const k=courtOf(c); if(k.owe) return {side:k.side, word:'Our move · we owe', title:k.word}; return {side:k.side, word:k.word, title:k.word}; };
const snippetOf = m => m.ch==='email' ? (m.subject||m.text.split('\n')[0]) : m.ch==='missed' ? 'no voicemail' : m.text;
const waitingSince = c => { const last=[...messages].filter(m=>m.c===c.id&&m.dir==='in').sort((a,b)=>b.at-a.at)[0]; if(!last) return ''; const mins=Math.max(1,Math.round((NOW-last.at)/60000)); if(mins<60) return `waiting ${mins} min`; if(mins<60*24) return `waiting ${Math.round(mins/60)} h`; return `waiting ${Math.round(mins/1440)} d`; };
const kindWord = c => ({customer:'customer',trade:'trade partner',arch:'architect',unknown:'who is this?'})[c.kind];
const kindClass = c => ({customer:'cust',trade:'trade',arch:'arch',unknown:'unknown'})[c.kind];
const initials = c => c.kind==='unknown'?'?':c.name.split(' ').filter(w=>!/^dr\.?$/i.test(w)).map(w=>w[0]).slice(0,2).join('');
const lastMsg = c => [...messages].filter(m=>m.c===c.id&&m.ch!=='event').sort((a,b)=>b.at-a.at)[0];
const lastIn = c => [...messages].filter(m=>m.c===c.id&&m.dir==='in').sort((a,b)=>b.at-a.at)[0] || lastMsg(c);
const chWord = m => ({call:'Call',voicemail:'Voicemail',text:'Text',email:'Email',note:'Note for the team',missed:'Missed call',event:'Event'})[m.ch];
const jobLabel = (c,jid) => { const j=jobById(jid); if(!j) return ''; return j.name + (c&&c.trade&&j.kind==='bid'?` · ${c.trade}`:''); };
const esc = s => String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
let toastT; function toast(s){ const t=document.getElementById('toast'); t.textContent=s; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }
const waitingCount = () => contacts.filter(c=>c.state==='waiting').length;

// ---------- render ----------
function render(){ try{ const h=document.querySelector('header.top'); if(h) document.documentElement.style.setProperty('--hdrh', h.offsetHeight+'px'); }catch(e){} renderNav(); const m=document.getElementById('main'); m.innerHTML=''; ({followup:renderFollowup, messages:renderMessages, customers:renderMessages, job:renderJob, settings:renderSettings})[view](m); }
function renderNav(){
  const n=document.getElementById('nav'); n.innerHTML='';
  const items=[['board','Project Board'],['followup','Follow up'],['messages','Messages'],['customers','Customers'],['trades','Trade partners'],['job','A job'],['settings','Settings']];
  for(const [k,label] of items){ const b=document.createElement('button'); b.innerHTML=esc(label)+(k==='followup'&&waitingCount()?`<span class="badge">${waitingCount()}</span>`:''); if(k===view) b.classList.add('on'); b.onclick=()=>{ if(k==='board'||k==='trades'){toast('Not in this prototype.');return;} view=k; if(k==='customers'){listFilter='customers'; const first=contacts.find(c=>c.kind==='customer'); if(first&&cById(openContact).kind!=='customer') openContact=first.id;} if(k==='messages'&&listFilter==='customers') listFilter='all'; render(); }; n.appendChild(b); }
}

function renderFollowup(m){
  const waiting = contacts.filter(c=>c.state==='waiting').sort((a,b)=> (lastMsg(a)?.at||0)-(lastMsg(b)?.at||0));
  const el=document.createElement('div');
  el.innerHTML = `<p class="lead">Follow up</p><p class="note">Everyone waiting on us, one count. Texts, voicemails and missed calls nobody has answered come first, the longest waiting at the top; the quote asks Follow up lists today continue below, unchanged.</p>
  <h3>Needs a reply (${waiting.length})</h3><div class="card list queue" id="queue"></div>
  <h3>We owe them (${contacts.filter(x=>x.owe).length})</h3><div class="card list queue">${contacts.filter(x=>x.owe).map(x=>`<div class="row clickable" onclick="openThread('${x.id}')"><div class="top"><div class="avatar ${kindClass(x)}">${initials(x)}</div><div style="flex:1"><div class="who">${esc(x.name)} <span class="whowrap"><button type="button" class="court ours owed" data-tip="What we owe|We owe ${esc(x.name.split(' ').filter(w=>!/^dr\.?$/i.test(w))[0])} ${esc(x.owe.what)}${x.owe.by?' by '+esc(x.owe.by):''}.|Press to open the thread at the reply box, where the ways to deal with it are." onclick="event.stopPropagation();owedAt('${x.id}')"><i></i>we owe ${esc(x.owe.what)}${x.owe.by?' · by '+esc(x.owe.by):''} ▾</button></span></div><div class="sub">${esc(x.company||kindWord(x))} · ${markedBy(x.owe)}</div></div></div></div>`).join('')||'<div class="empty">Nothing we owe anyone.</div>'}</div>
  <h3>Late on their word (1)</h3><div class="card list"><div class="row"><div class="avatar trade">GP</div><div><div class="who">Greg Paulk <span class="pill promise">promised Wed Sep 30, 2 days past</span></div><div class="sub">Hillside Excavation · ${jobTag('boerne')}</div><div class="last">They gave a day and no quote came. Call them.</div></div><div class="right"><button class="small" onclick="toast('Opens the call in Quo\\'s app; it comes back as a line.')">Call in Quo</button></div></div></div>
  <h3>Quote asks (unchanged)</h3><div class="card"><div class="empty">The asks Follow up lists today, by person, continue here as they are.</div></div>`;
  m.appendChild(el);
  const q=el.querySelector('#queue');
  if(!waiting.length){ q.innerHTML='<div class="empty">Nobody is waiting on us.</div>'; return; }
  for(const c of waiting){
    const last=lastIn(c); const offered = messages.filter(x=>x.c===c.id && ((x.promise&&x.promise.state==='offered')||(x.question&&x.question.state==='offered')));
    const row=document.createElement('div'); row.className='row clickable'; row.title='Open the conversation at this message';
    row.addEventListener('click',ev=>{ if(ev.target.closest('button, select, input, a')) return; openThread(c.id, last?last.id:null); });
    row.innerHTML=`<div class="top"><div class="avatar ${kindClass(c)}">${initials(c)}</div><div style="flex:1"><div class="who">${esc(c.name)} <span class="court ${courtOf(c).side}" title="${esc(courtOf(c).word)}"><i></i>${esc(courtOf(c).word)}</span></div><div class="sub">${esc(c.company||kindWord(c))}${c.def&&jobById(c.def).name!==c.company?` · ${jobTag(c.def)}`:''}</div></div>
      <div class="right"><span class="whowrap">${hasPill(c)}</span></div></div>
      <div class="snippet">${last?`<b>${chWord(last)}, ${fmtDay(last.at)}:</b> ${esc((s=>s.length>220?s.slice(0,220).replace(/\s+\S*$/,'')+'…':s)(snippetOf(last)))}`:''}</div>
      <div class="acts">${offered.map(x=> x.promise?`<button class="small" onclick="openThread('${c.id}')">A day was heard: ${esc(x.promise.day)} · say what it is</button>`:`<button class="small" onclick="askArchitect(${x.id})">Ask the architect</button>`).join('')}
        ${c.kind==='unknown'?`<button class="small primary" onclick="whoIsThis('${c.id}')">Who is this?</button>`:`<button class="small primary" onclick="openThread('${c.id}')">Reply</button>`}
        ${last&&(last.ch==='missed'||last.ch==='voicemail')?`<button class="small" onclick="toast('Opens the call in Quo\\'s app; it comes back as a line.')">Call back in Quo</button>`:''}
        <button class="small" onclick="setState('${c.id}','done')">No reply needed</button>
        <button class="small" onclick="remind('${c.id}')">Remind me Monday</button></div>`;
    q.appendChild(row);
  }
}

function renderMessages(m){
  const autoRail = flowOpen && openContact && window.innerWidth<=1040 && window.innerWidth>760;
  const wrap=document.createElement('div'); wrap.className='two'+((listCollapsed||autoRail)&&!narrow()?' collapsed':'')+(flowOpen&&openContact?' with-flow':openContact?' with-frail':'');
  // list
  const list=document.createElement('div'); list.className='card list'+(narrow()&&openContact?' hidden-narrow':'');
  if((listCollapsed||autoRail)&&!narrow()){ const filt0 = c => (listFilter==='all')|| (listFilter==='customers'&&c.kind==='customer')|| (listFilter==='trades'&&(c.kind==='trade'||c.kind==='arch'))|| (listFilter==='unknown'&&c.kind==='unknown');
    const rows0 = contacts.filter(filt0).sort((a,b)=>{ const w=(b.state==='waiting')-(a.state==='waiting'); return w|| (lastMsg(b)?.at||0)-(lastMsg(a)?.at||0); });
    list.className='card rail'; list.innerHTML=`<button class="collapse" data-tip="${autoRail&&!listCollapsed?'The list is folded while the flow is open|At this window width the flow panel needs the room.|Fold the flow to get the list back, or widen the window.':'Show the list|Opens the people list again.|Your choice is kept on this computer.'}" onclick="${autoRail&&!listCollapsed?'setFlow(false)':'setCollapsed(false)'}">›</button>${rows0.map(c=>`<div class="avatar ${kindClass(c)} ${c.id===openContact?'on':''}" data-tip="${esc(c.name)}|${esc(c.company||kindWord(c))}|${esc(courtOf(c).word)}" onclick="openThread('${c.id}')">${initials(c)}<span class="cd ${courtOf(c).side}"></span></div>`).join('')}`;
    wrap.appendChild(list); }
  else {
  const filt = c => (listFilter==='all')|| (listFilter==='customers'&&c.kind==='customer')|| (listFilter==='trades'&&(c.kind==='trade'||c.kind==='arch'))|| (listFilter==='unknown'&&c.kind==='unknown');
  const hit = c => !search || [c.name,c.company,...messages.filter(x=>x.c===c.id).map(x=>x.text)].join(' ').toLowerCase().includes(search.toLowerCase());
  const rows = contacts.filter(c=>filt(c)&&hit(c)).sort((a,b)=>{ const w=(b.state==='waiting')-(a.state==='waiting'); return w|| (lastMsg(b)?.at||0)-(lastMsg(a)?.at||0); });
  list.innerHTML=`<div class="lhead"><input placeholder="Search people, companies, words in texts and transcripts" value="${esc(search)}" oninput="search=this.value;render();document.querySelector('.list input').focus()">${narrow()?'':`<button class="collapse" data-tip="Hide the list|Folds the people list to a rail of faces so the thread gets the room.|Each face keeps its dot for whose move it is; your choice is kept on this computer." onclick="setCollapsed(true)">‹</button>`}</div>
    <div class="filters" style="padding:0 10px">${[['all','All'],['customers','Customers'],['trades','Trades'],['unknown','Who is this?']].map(([k,l])=>`<button class="${listFilter===k?'on':''}" onclick="listFilter='${k}';render()">${l}</button>`).join('')}</div>`;
  if(!rows.length) list.innerHTML+='<div class="empty">Nothing matches.</div>';
  for(const c of rows){ const last=lastMsg(c); const r=document.createElement('div'); r.className='row'+(c.id===openContact?' on':''); r.onclick=()=>openThread(c.id);
    r.innerHTML=`<div class="avatar ${kindClass(c)}">${initials(c)}</div><div style="min-width:0;flex:1"><div class="who">${esc(c.name)}</div><div class="sub">${esc(c.company||kindWord(c))}${c.trade?` · ${esc(c.trade)}`:''}</div><div class="last">${last?`${chWord(last)}: ${esc(snippetOf(last))}`:''}</div></div><div class="right">${last?fmt(last.at).split(' · ')[0]:''}<br><span class="court ${courtShort(c).side} tiny" title="${esc(courtShort(c).title)}"><i></i>${esc(courtShort(c).word)}</span>${c.has?`<br><span class="pill has">${esc(c.has)}</span>`:''}</div>`;
    list.appendChild(r); }
  wrap.appendChild(list); }
  // thread
  const th=document.createElement('div'); th.className='card thread';
  const c=cById(openContact);
  if(!c){ th.innerHTML='<div class="empty">Pick a person.</div>'; wrap.appendChild(th); m.appendChild(wrap); return; }
  const cJobs = c.jobs.map(jobById);
  const lines = messages.filter(x=>x.c===c.id && (!jobFilter || x.job===jobFilter)).sort((a,b)=>a.at-b.at);
  th.innerHTML=`
  <div class="hdr hdr-top">
    <div class="row1">${narrow()?`<button type="button" class="backav" aria-label="Back to everyone" data-tip="Back to everyone|Returns to the people list.|The thread stays as it is; open it again from the list." onclick="openContact=null;render()"><span class="chev">‹</span><span class="avatar ${kindClass(c)}">${initials(c)}</span></button>`:`<div class="avatar ${kindClass(c)}">${initials(c)}</div>`}<div class="name"><h2>${esc(c.name)} ${c.optout?'<span class="pill stop">opted out</span>':''}</h2><div class="sub2">${c.kind==='unknown'?'Who is this?':`<b>${esc(kindWord(c).replace(/^\w/,ch=>ch.toUpperCase()))}:</b> ${esc(c.company||'')}`}</div></div><span class="corner"><span class="whowrap">${hasPill(c)}</span> <span class="whowrap"><button type="button" class="statepill ${c.state==='waiting'?'open':c.state}" data-tip="${c.state==='waiting'?'Open|They are waiting on us.|Press for Snoozed or Done.':c.state==='snoozed'?'Snoozed|Out of Follow up until Monday morning.|Press for Open or Done.':'Done|Nothing is owed to them right now.|Press for Open or Snoozed.'}" onclick="statePicker('${c.id}',this)">${c.state==='waiting'?'Open':c.state==='snoozed'?'Snoozed':'Done'} ▾</button></span><span class="seg"><button class="${c.state==='waiting'?'on':''}" data-tip="Open|They are waiting on us.|The row sits in Follow up and counts in its badge until someone answers, adds a note, or marks it Done." onclick="setState('${c.id}','waiting')">Open</button><button class="${c.state==='snoozed'?'on':''}" data-tip="Snoozed|Out of Follow up until Monday morning, then back on its own.|The thread stays as it is. A new message from them brings it back sooner." onclick="remind('${c.id}')">Snoozed</button><button class="${c.state==='done'?'on':''}" data-tip="Done|Nothing is owed to them right now.|The row leaves Follow up and the badge drops by one; the thread keeps everything. Their next message reopens it by itself." onclick="setState('${c.id}','done')">Done</button></span></span></div></div>
  <div class="scrollarea"><div class="hdr hdr-rest">
    <div class="row2"><span class="kindco">${c.kind==='unknown'?'Who is this?':`<b style="font-weight:600;color:var(--text)">${esc(kindWord(c).replace(/^\w/,ch=>ch.toUpperCase()))}:</b> ${esc(c.company||'')}`}</span>${c.phones.length?`<span class="sepdot">·</span><a class="fact" href="tel:${esc(c.phones[0].replace(/\D/g,''))}">${esc(c.phones.join(', '))}</a>`:''}${c.emails.length?`<span class="sepdot">·</span><a class="fact" href="mailto:${esc(c.emails[0])}">${esc(c.emails.join(', '))}</a>`:''}${c.state==='snoozed'?`<span class="pill">snoozed until Monday</span>`:''}${c.promise?`<span class="pill promise">${esc(c.promise)}</span>`:''}</div>
    <div class="row3">${courtStrip(c)}</div>
    <div class="tools"><div class="toolbar">${c.kind==='unknown'?`<button class="primary" onclick="whoIsThis('${c.id}')">Who is this?</button>`:''}<button data-tip="Call in Quo|Opens a call to them in Quo's app, from the company number.|When it ends, the call comes back here as a line with its recording, transcript and summary." onclick="toast('Opens the call in Quo\\'s app; it comes back as a line.')">Call in Quo</button>
      <span class="whowrap"><button class="quiet" data-tip="More|The rarer things for this thread.|Mark STOP, Show all text, and Edit the flow." onclick="morePicker('${c.id}',this)">More ▾</button></span>
      ${c.state!=='waiting'?`<button class="quiet" title="Demo: a new message from them reopens the row by itself" onclick="theyReply('${c.id}')">They text back (demo)</button>`:''}
</div>
    <div class="jobs-rail" id="rail"><span class="sep"></span><span class="note lbl" data-tip="Their jobs|The bids, projects and Pipeline jobs they are part of. A chip can be marked two ways, and they mean different things:|" data-tip-legend="jobs">Their jobs</span><span class="tiles">${cJobs.map(j=>jobTile(c,j)).join('')}<span class="jobchip ghost" onclick="addJob('${c.id}')">+ add a job</span>${jobFilter?`<button class="quiet small" onclick="jobFilter=null;render()">show all</button>`:''}</span></div></div>
  </div>
  <div id="lines"></div></div>
  <div class="reply">
    <div class="kinds">${[['text','Text'],['email','Email'],['note','Note for the team']].map(([k,l])=>`<button class="${k==='note'?'team ':''}${replyKind===k?'on':''}" onclick="replyKind='${k}';if('${k}'!=='note')settling=null;render()">${l}</button>`).join('')}<span class="note" style="margin-left:auto">${replyKind==='text'?'from the company number (210) 555-0100 · Click Construction':replyKind==='email'?'from bids@clickconstruction · Click Construction':'only the team sees a note; adding one closes the row'}</span></div>
    ${replyKind!=='note'?qrStripHtml(c):''}
    ${owedOpen===c.id&&settling!==c.id?owedStripHtml(c):''}
    ${settling===c.id&&c.owe?`<div class="settling"><b>Marking it done:</b> we owed ${esc(c.owe.what)}${c.owe.by?' · by '+esc(c.owe.by):''} · marked by ${esc(c.owe.who)} ${esc(c.owe.since)}<span class="note">Say how it got done, for the team. The note marks it done.</span></div>`:''}
    <textarea id="box" oninput="countBox(this)" class="${replyKind==='note'?'team':''}" placeholder="${settling===c.id&&c.owe?'How it got done: what we did, or why nothing is owed…':replyKind==='note'?'A note only the team sees…':'Write to '+esc(c.name)+'…'}" ${c.optout&&replyKind==='text'?'disabled':''}></textarea>
    ${replyKind!=='note'?`<div class="previews"><span>Send shows it to you the way they will see it, before it goes.</span><span class="note" id="pvcount"></span></div>`:''}
    <div class="send">${settling===c.id&&c.owe?`<button class="primary" data-tip="Done, with this note|Marks what we owed done and keeps your words in the thread.|The row closes as any note does; the move goes by whose word was last. Follow up drops it from We owe them." onclick="finishSettle('${c.id}')">Done, with this note</button><button class="quiet" onclick="cancelSettle()">Not done yet</button>`:`<button class="primary" onclick="${replyKind==='note'?`sendReply('${c.id}')`:`previewDraft('${c.id}','${replyKind}')`}" ${c.optout&&replyKind==='text'?'disabled':''}>${replyKind==='note'?'Add the note':replyKind==='email'?'Send email…':'Send text…'}</button>`}${c.optout&&replyKind==='text'?'<span class="note">They sent STOP. The app will not text this number.</span>':''}
      <span class="tie">Tie to: <button type="button" class="tiebtn" data-tip="Tie to|Which job this message lands on.|The job's page shows only what is tied to it; the person's thread shows everything. New messages from them go to the ★ default." onclick="tiePicker('${c.id}',this)">${tieLabel(c)} <span>▾</span></button></span></div>
  </div>`;
  const L=th.querySelector('#lines');
  if(!lines.length) L.innerHTML='<div class="empty">Nothing yet.</div>';
  let lastDay='';
  for(const x of lines){ const d=dayOf(x.at); if(d!==lastDay){ const dd=document.createElement('div'); dd.className='day'; dd.textContent=d; L.appendChild(dd); lastDay=d; }
    if(x.ch==='event'){ const ev=document.createElement('div'); ev.className='evt'; ev.innerHTML=`${esc(x.text)} · ${fmt(x.at)}`; L.appendChild(ev); continue; }
    const e=document.createElement('div'); e.className=`msg clickable ${x.dir==='team'?'team':x.dir}`; e.dataset.id=x.id; e.title='Open this message';
    e.addEventListener('click',ev=>{ if(ev.target.closest('button, a, select, input, .job, .offer, .chip, .player')) return; openMessage(x.id); });
    e.innerHTML=`<div class="meta"><span class="ch">${chWord(x)}${x.dur?` · ${x.dur}`:''}</span><span>${esc(x.who)}</span><span>${fmt(x.at)}</span>
        ${x.settled?`<span class="settled-chip" data-tip="Done|This ${x.ch==='note'?'note':'message'} marked what we owed them done.|We owed ${esc(x.settled.what)}${x.settled.by?' by '+esc(x.settled.by):''}; the move went back to whoever wrote last.">✓ done: ${esc(x.settled.what)}</span>`:''}<span class="job ${x.job?'':'none'}" title="${x.job?'Untie from this job':'Tie to a job'}" onclick="${x.job?`untie(${x.id})`:`tieMenu(${x.id})`}">${x.job?jobTag(x.job)+' ×':'no job'}</span></div>
      ${x.subject?`<div class="subject">${esc(x.subject)}</div>`:''}
      ${bodyHtml(c,x)}
      ${x.attachments?`<div class="att">${x.attachments.map((a,i)=>`<span class="chip" onclick="event.stopPropagation();openAttachment(${x.id},${i})">${a.kind==='image'?'<span class="thumb"></span>':`<span class="ic ${a.kind}">${a.kind==='pdf'?'PDF':a.kind==='link'?'↗':'F'}</span>`}<span>${esc(a.name)} <span class="note">· ${esc(a.size)}</span></span></span>`).join('')}</div>`:''}
      ${x.transcript?`<span class="player">▶ ${x.dur||''} · Transcript</span>`:''}
      ${x.promise&&x.promise.state==='offered'?promiseOffer(c,x):''}
      ${x.promise&&x.promise.state==='written'?`<div class="written">✓ Written down by ${esc(x.promise.by)}: ${esc(x.promise.what)} by ${esc(x.promise.day)} · ${esc(x.promise.where)}.</div>`:''}
      ${x.promise&&x.promise.state==='no'?`<div class="written" style="color:var(--text-muted)">Not a promise, said ${esc(x.promise.by)}.</div>`:''}
      ${x.question&&x.question.state==='offered'?`<div class="offer q">This reads like a question about the plans. <button class="small primary" onclick="askArchitect(${x.id})">Ask the architect</button><button class="small" onclick="answerMyself(${x.id})">Answer it myself</button></div>`:''}
      ${x.question&&x.question.state==='asked'?`<div class="written">✓ Sent to the architect as a plan question by ${esc(x.question.by)}.</div>`:''}`;
    // drag targets

function openThread(id, mid){ openContact=id; jobFilter=null; replyTie=null; if(view!=='customers') view='messages'; render(); if(mid){ requestAnimationFrame(()=>{ const el=[...document.querySelectorAll('#lines .msg')].find(e=>e.dataset.id===String(mid)); if(el){ el.scrollIntoView({block:'center'}); el.classList.add('flash'); } }); } }

function removeJob(cid,jid){ const c=cById(cid); const j=jobById(jid); const wasDef=c.def===jid; c.jobs=c.jobs.filter(x=>x!==jid); if(wasDef) c.def=c.jobs[0]||null; if(jobFilter===jid) jobFilter=null; messages.push({id:++seq,c:cid,job:null,ch:'event',dir:'team',who:ME,at:NOW+messages.length,text:`${ME} took ${jobText(jid)} off ${c.name}.${wasDef?(c.def?` New messages land on ${jobText(c.def)} now.`:' New messages land on them alone now.'):''}`}); toast(`${jobText(jid)} is off ${c.name}. The lines tied to it keep their tie.`); render(); }

const OWED_FLOW_WORDS = {bid:'our bid', start:'the start date', onsite:'the day we are on site', close:'the closeout papers', warranty:'the warranty papers', invited:'the invitation', compare:'our decision on their quote'};

// A day in words → the date it means, from the prototype's today (Fri Oct 2). Unknown words are kept as typed.
// The day box's chips: the next six days by name, then a week and two weeks out (v1.64). One press sets the day.
function dayChips(){ const base=new Date(NOW); base.setHours(0,0,0,0); const lbl=d=>d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}).replace(',',''); const out=[];
  for(let i=1;i<=6;i++){ const d=new Date(base); d.setDate(d.getDate()+i); out.push({top:i===1?'Tomorrow':d.toLocaleDateString('en-US',{weekday:'long'}), sub:d.toLocaleDateString('en-US',{month:'short',day:'numeric'}), label:lbl(d)}); }
  const w=new Date(base); w.setDate(w.getDate()+7); out.push({top:'A week', sub:w.toLocaleDateString('en-US',{month:'short',day:'numeric'}), label:lbl(w)});
  const w2=new Date(base); w2.setDate(w2.getDate()+14); out.push({top:'Two weeks', sub:w2.toLocaleDateString('en-US',{month:'short',day:'numeric'}), label:lbl(w2)});
  return out; }
function readDay(text){ const t=(text||'').trim(); if(!t) return null; const base=new Date(NOW); base.setHours(0,0,0,0); const lbl=d=>d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}).replace(',','');
  const low=t.toLowerCase(); const inw=low.match(/^in (a|one|two|three|\d+) weeks?$/); if(inw){ const n=({a:1,one:1,two:2,three:3})[inw[1]]||Number(inw[1]); const d=new Date(base); d.setDate(d.getDate()+7*n); return {label:lbl(d), known:true}; }
  if(low==='today') return {label:lbl(base), known:true}; if(low==='tomorrow'){ const d=new Date(base); d.setDate(d.getDate()+1); return {label:lbl(d), known:true}; }
  const days=['sunday','monday','tuesday','wednesday','thursday','friday','saturday']; const m=low.match(/^(next\s+)?(sun|mon|tue|wed|thu|fri|sat)[a-z]*$/); if(m){ const want=days.findIndex(d=>d.startsWith(m[2])); const d=new Date(base); let add=(want-d.getDay()+7)%7; if(add===0) add=7; if(m[1]&&add<7) add+=7; d.setDate(d.getDate()+add); return {label:lbl(d), known:true}; }
  const md=t.match(/^([A-Za-z]{3,9})\.?\s+(\d{1,2})$/); if(md){ const mi=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'].indexOf(md[1].slice(0,3).toLowerCase()); if(mi>=0){ const d=new Date(2026,mi,Number(md[2])); if(d<base) d.setFullYear(2027); return {label:lbl(d), known:true}; } }
  const nd=t.match(/^(\d{1,2})\/(\d{1,2})$/); if(nd){ const d=new Date(2026,Number(nd[1])-1,Number(nd[2])); if(d<base) d.setFullYear(2027); return {label:lbl(d), known:true}; }
  return {label:t, known:false}; }
function owedStripHtml(c){ const first=esc(c.name.split(' ').filter(w=>!/^dr\.?$/i.test(w))[0]); const has=!!c.owe; const what=has?c.owe.what:owedDraft.what; const by=has?c.owe.by:owedDraft.by; const opts=owedWhatOptions(c);
  const blank=(k,v,empty)=>`<button type="button" class="blank ${v?'':'empty'} ${owedEdit===k?'on':''}" data-tip="${k==='what'?'What we owe|Press to change it. Pick from the list, or type your own words.|The buttons under it follow the words.':'By when|Press to set the day. Type it in words: Monday, Oct 12, next Friday.|Follow up and the move line read it. The day is optional.'}" onclick="owedEdit=owedEdit==='${k}'?null:'${k}';render();setTimeout(()=>document.getElementById('owedin')?.focus(),0)">${v?esc(v):empty} <span class="car">▾</span></button>`;
  let editor='';
  if(owedEdit==='what') editor=`<div class="owedit"><div class="ph">From ${c.kind==='customer'?'the customer':c.kind==='trade'?'the trade partner':c.kind==='arch'?'the architect':'their'} flow</div>${opts.flow.map(w=>`<div class="r ${w===what?'on':''}" onclick="setOwedWhat('${c.id}',${JSON.stringify(w).replace(/"/g,'&quot;')})">${esc(w)}</div>`).join('')||'<div class="r" style="color:var(--text-muted);cursor:default">nothing of ours in their flow</div>'}<div class="ph">The usual</div>${opts.usual.map(w=>`<div class="r ${w===what?'on':''}" onclick="setOwedWhat('${c.id}',${JSON.stringify(w).replace(/"/g,'&quot;')})">${esc(w)}</div>`).join('')}<div class="ph">Or</div><div class="r free">something else<input id="owedin" placeholder="say what, in a few words" value="${!has||opts.flow.includes(what)||opts.usual.includes(what)?'':esc(what)}" onkeydown="if(event.key==='Enter'){setOwedWhat('${c.id}',this.value.trim())}"><button class="small" onclick="setOwedWhat('${c.id}',document.getElementById('owedin').value.trim())">Use these words</button></div></div>`;
  if(owedEdit==='when') editor=`<div class="owedit"><div class="daychips">${dayChips().map(d=>`<button type="button" class="${by===d.label?'on':''}" data-tip="${esc(d.label)}|Sets the day to ${esc(d.label)}.|Follow up and the move line read it." onclick="setOwedBy('${c.id}',${JSON.stringify(d.label).replace(/"/g,'&quot;')})"><b>${esc(d.top)}</b><span>${esc(d.sub)}</span></button>`).join('')}<span class="typed"><input id="owedin" placeholder="or type a day: Oct 20, next Friday, in two weeks…" value="" oninput="const r=readDay(this.value); const rb=document.getElementById('dayread'); rb.textContent=this.value.trim()?(r?.known?'Reads as '+r.label+'. Press Enter.':'Cannot read that as a day; Enter keeps it as typed.'):''" onkeydown="if(event.key==='Enter'){setOwedBy('${c.id}',this.value.trim())}"><span class="readback" id="dayread"></span><button class="quiet small" onclick="setOwedBy('${c.id}','')">${by?'Clear the day':'No day'}</button></span></div></div>`;
  const mark = has ? '' : `<button class="small primary mark" ${what?'':'disabled'} data-tip="Mark it|Writes what we owe ${first}${by?' and by when':''}.|${what?'':'Say what first; the day is optional. '}It stays our move until it is done. Follow up lists it under We owe them." onclick="markOwed('${c.id}')">Mark it</button>`;
  const head=`<div class="oh"><span>We owe ${first} ${blank('what',what,'what?')} by ${blank('when',by,'when?')}</span>${has?markedBy(c.owe):''}${mark}<button class="quiet small x" data-tip="Close|Puts the strip away.|${has?'Nothing changes; what we owe stays marked.':'Nothing is marked.'}" onclick="owedOpen=null;owedEdit=null;owedDraft={what:'',by:''};render()">×</button></div>`;
  const acts = has ? `<div class="acts"><button class="small" data-tip="Mark it done, with a team note|A note for the team opens here. Say how it got done, or why nothing is owed.|The note marks it done. The row leaves Follow up." onclick="owedOpen=null;settle('${c.id}')">Mark it done, with a team note</button><button class="small primary" data-tip="Send ${first} ${esc(what)}|Write it in the box and press Send text….|Before it goes, the window asks if this message gets it done." onclick="owedOpen=null;replyKind='text';render();document.getElementById('box')?.focus()">Send ${first} ${esc(what)}</button><button class="small" data-tip="Put it off|The row leaves Follow up until Monday.|It comes back on its own. What we owe stays marked." onclick="owedOpen=null;remind('${c.id}')">Put it off</button></div>`
    : '';
  return `<div class="owedstrip" id="owedstrip">${head}${editor}${acts}</div>`; }
function setOwedWhat(cid,w){ if(!w) return; const c=cById(cid); if(c.owe){ if(w!==c.owe.what){ const was=c.owe.what; c.owe.what=w; messages.push({id:++seq,c:cid,job:null,ch:'event',dir:'team',who:ME,at:NOW+messages.length,text:`${ME} changed what we owe ${c.name}: ${w}, not ${was}${c.owe.by?', by '+c.owe.by:''}.`}); toast(`We owe ${c.name} ${w} now.`); } } else owedDraft.what=w; owedEdit=null; render(); }
function setOwedBy(cid,b){ const c=cById(cid); const r=b?readDay(b):null; const label=r?r.label:''; if(c.owe){ if(label!==(c.owe.by||'')){ c.owe.by=label||null; messages.push({id:++seq,c:cid,job:null,ch:'event',dir:'team',who:ME,at:NOW+messages.length,text:`${ME} set the day we owe ${c.name} ${c.owe.what}${label?' to '+label:' to no day'}.`}); toast(label?`By ${label}.`:'No day set.'); } } else owedDraft.by=label; owedEdit=null; render(); }
function markOwed(cid){ const c=cById(cid); if(!owedDraft.what) return; c.owe={what:owedDraft.what, by:owedDraft.by||null, since:NOW_WORDS, at:NOW, who:ME}; messages.push({id:++seq,c:cid,job:null,ch:'event',dir:'team',who:ME,at:NOW+messages.length,text:`${ME} marked that we owe ${c.name} ${c.owe.what}${c.owe.by?' by '+c.owe.by:''}.`}); owedDraft={what:'',by:''}; owedEdit=null; toast(`Marked: we owe ${c.name} ${c.owe.what}.`); render(); }
function owedAt(cid){ owedOpen=cid; owedEdit = cById(cid).owe ? null : 'what'; if(view!=='messages'||openContact!==cid) openThread(cid); else render(); setTimeout(()=>{ const el=document.getElementById('owedstrip'); if(el){ el.scrollIntoView({block:'center'}); el.classList.add('flash'); } },0); }
function cancelSettle(){ settling=null; render(); }
function finishSettle(cid){ const c=cById(cid); const box=document.getElementById('box'); const t=box.value.trim(); if(!t){toast('Say how it got done, or press Not done yet.');return;} const w=c.owe.what, by=c.owe.by; c.owe=null; settling=null; messages.push({id:++seq,c:cid,job:replyTie==='none'?null:(replyTie||c.def),ch:'note',dir:'team',who:`${ME} · note for the team`,at:NOW+messages.length,text:t,settled:{what:w,by}}); c.state='done'; c.has=null; box.value=''; toast('Done, with the note for the team. The move goes by whose word was last.'); render(); }
function theyReply(cid){ const c=cById(cid); messages.push({id:++seq,c:cid,job:c.def,ch:'text',dir:'in',who:c.name.split(' ')[0],at:NOW+messages.length,text:'Got it, thanks. One more thing when you have a minute.'}); c.state='waiting'; toast(`${c.name} wrote back; the row is open again by itself.`); render(); }
function whoIsThis(cid){ const c=cById(cid); modal(`Who is this? ${esc(c.phones[0])}`, `<div class="f">Their name<input id="wn" placeholder="Dee …"></div><div class="f">What they are to us<select id="wk"><option value="trade">trade partner</option><option value="customer">customer</option><option value="arch">architect</option></select></div><div class="f">Their company<input id="wc" placeholder="Alamo Concrete"></div><div class="f">Tie this message to<select id="wj"><option value="">no job yet</option>${jobs.map(j=>`<option value="${j.id}">${esc(jobText(j.id))} · ${esc(jobDayText(j))}</option>`).join('')}</select></div><p class="note">The answer becomes the rule for this number: the next text from it lands on this person.</p>`, ()=>{ const n=document.getElementById('wn').value.trim(); if(!n){toast('A name, please.');return false;} c.name=n; c.kind=document.getElementById('wk').value; c.company=document.getElementById('wc').value.trim(); const j=document.getElementById('wj').value; if(j){ c.jobs=[j]; c.def=j; messages.filter(x=>x.c===c.id).forEach(x=>x.job=j); } toast(`${n} is known now.`); render(); }); }

// ---------- a message's body in the thread: four lines, or its highlights ----------
const isLong = x => (x.text.split('\n').length>4) || x.text.length>280;
function bodyHtml(c,x){ const hls=highlights[x.id]||[]; const full=showAll[c.id];
  if(hls.length && !full) return hls.map(h=>`<div class="hl">${esc(h.text)}<small>highlighted by ${esc(h.by)} · ${esc(h.at)}</small></div>`).join('')+`<div class="more">the whole ${x.ch==='email'?'email':'message'} ›</div>`;
  if(isLong(x) && !full) return `<div class="body clamp">${esc(x.text)}</div><div class="more">the whole ${x.ch==='email'?'email':'message'} ›</div>`;
  return `<div class="body">${markHtml(x)}</div>`; }
function markHtml(x){ let h=esc(x.text); for(const hl of (highlights[x.id]||[])){ const e=esc(hl.text); h=h.split(e).join(`<mark title="highlighted by ${esc(hl.by)} · ${esc(hl.at)}">${e}</mark>`); } return h; }

// ---------- the message window ----------
const longWhen = ts => new Date(ts).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})+' at '+fmt(ts).split(' · ').pop();
const viaOf = x => x.ch==='email'?(x.dir==='in'?'to bids@clickconstruction':'from bids@clickconstruction, as Click Construction'):x.ch==='note'?'a note only the team sees':(x.who.includes("Quo's phone app")?"Quo's phone app":'the company number (210) 555-0100');
function openMessage(mid){ const x=messages.find(m=>m.id===mid); const c=cById(x.c); const bg=document.createElement('div'); bg.className='modal-bg'; const m=document.createElement('div'); m.className='modal wide mw'; bg.appendChild(m);
  const paint=()=>{ const hls=highlights[mid]||[]; m.innerHTML=`<h2>${chWord(x)}${x.subject?': '+esc(x.subject):''}</h2>
    <dl class="facts"><dt>${x.dir==='in'?'From':x.dir==='team'?'By':'To'}</dt><dd>${esc(x.dir==='in'?x.who:x.dir==='team'?x.who:c.name+(c.emails[0]&&x.ch==='email'?' <'+esc(c.emails[0])+'>':c.phones[0]?' · '+esc(c.phones[0]):''))}</dd>
      <dt>${x.dir==='in'?'Received':x.dir==='team'?'Added':'Sent'}</dt><dd>${longWhen(x.at)}${x.dur?' · '+x.dur+' long':''}</dd>
      <dt>Through</dt><dd>${viaOf(x)}</dd>
      <dt>Tied to</dt><dd>${x.job?esc(jobLabel(c,x.job)):'<i>no job, sits on the person</i>'} <button class="small quiet" onclick="this.closest('.modal-bg').remove();tieMenu(${mid})">change</button></dd>
      ${x.dir==='out'&&x.ch!=='note'?'<dt>Kept</dt><dd>A copy as it went is in Documents.</dd>':''}
      ${x.transcript?'<dt>Recording</dt><dd>▶ '+esc(x.dur||'')+' · the transcript is below; Quo wrote the summary.</dd>':''}</dl>
    <div class="tools"><button class="small primary" id="hlbtn" onclick="window.__hl(${mid})" disabled>Highlight the selected words</button><button class="small" onclick="navigator.clipboard&&navigator.clipboard.writeText(${JSON.stringify(x.text).replace(/"/g,'&quot;')});toast('Copied.')">Copy</button><button class="small" onclick="document.body.classList.add('printing');window.print();setTimeout(()=>document.body.classList.remove('printing'),500)">Print or save as PDF</button><button class="small" onclick="window.__share(${mid})">Share…</button>${x.dir==='in'?`<button class="small" onclick="this.closest('.modal-bg').remove();document.getElementById('box')?.focus()">Reply</button>`:''}</div>
    <div class="full" id="fulltext">${markHtml(x)}</div>
    ${hls.length?`<h3>Highlights (${hls.length})</h3><div class="hls">${hls.map((h,i)=>`<div><span>${esc(h.text)}</span><small>${esc(h.by)} · ${esc(h.at)}</small><button class="small quiet" onclick="window.__unhl(${mid},${i})">×</button></div>`).join('')}</div>`:''}
    ${x.attachments?`<h3>Attachments (${x.attachments.length})</h3><div class="attl">${x.attachments.map((a,i)=>`<div><span class="ic ${a.kind}" style="width:22px;height:22px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;background:${a.kind==='pdf'?'#c0392b':a.kind==='image'?'#2a8f5a':'#1f5fbf'}">${a.kind==='pdf'?'PDF':a.kind==='link'?'↗':'IMG'}</span><span class="nm">${esc(a.name)} <span class="note">· ${esc(a.size)}${a.kind==='link'?' · a link, not a file':' · our copy kept on arrival'}</span></span><button class="small" onclick="toast('Opens the file.')">Open</button><button class="small" onclick="toast('The file agent copies it to ${esc(x.job?jobById(x.job).name:'the job')} › ${a.quote||a.kind==='image'?'Team only':'Plans'} in Drive.')">Save to Drive</button>${a.quote?`<button class="small primary" onclick="toast('Opens Enter their quote with this PDF beside it.')">Enter it as their quote</button>`:''}</div>`).join('')}</div>`:''}
    <div class="btns"><button onclick="this.closest('.modal-bg').remove();render()">Close</button></div>`;
    const full=m.querySelector('#fulltext'); const upd=()=>{ const s=document.getSelection(); const txt=s&&s.toString().trim(); const inside=s&&s.rangeCount&&full.contains(s.getRangeAt(0).commonAncestorContainer); selectedInWindow=(inside&&txt)?txt:''; m.querySelector('#hlbtn').disabled=!selectedInWindow; }; document.addEventListener('selectionchange',upd); bg.addEventListener('remove',()=>document.removeEventListener('selectionchange',upd)); };

  paint(); document.body.appendChild(bg); bg.onclick=e=>{ if(e.target===bg){ bg.remove(); render(); } }; }

// ---------- their flow: the right panel, drawn from FLOWS and FLOW_STATE ----------
function stepState(c, id){ const st=FLOW_STATE[c.id]||{done:[],now:null,rounds:{}}; if(st.done.includes(id)) return 'done'; if(st.now===id) return 'now'; return ''; }
function whoNow(c, step){ if(c.owe) return 'us'; const k=courtOf(c); if(k.side==='ours') return 'us'; if(k.side==='theirs') return 'them'; return step.who; }
function flowRailHtml(c){ const flow=FLOWS[c.kind]||[]; const st=FLOW_STATE[c.id]||{done:[],now:null,rounds:{}}; const all=flow.flatMap(l=>l.steps); const nDone=all.filter(s=>stepState(c,s.id)==='done').length;
  const mark=(step,i,steps)=>{ const s=stepState(c,step.id); const w=s==='now'?whoNow(c,step):''; const rounds=(st.rounds[step.id]||[]);
    const tip=`${esc(step.name)}${step.loop?' · '+esc(step.loop):''}${step.dec?' · a fork':''}|${s==='done'?'Done: '+esc(step.done):s==='now'?(w==='us'?'On now, our move.':w==='them'?'On now, their move.':'On now, both sides.')+(rounds.length?' '+rounds.length+' so far.':''):'Not yet. Finishes when '+esc(step.done)+'.'}|${s==='now'?'The nudge if it stalls: '+esc(step.nudge)+'. ':''}Click to open the flow at this step.`;
    return `<span class="stepw"><span class="st ${s} ${w} ${step.dec?'dec':''}" data-tip="${tip}" onclick="setFlow(true,'${step.id}')">${s==='done'?'✓':step.loop?'↻':''}</span>${s==='now'?`<span class="tag ${w}">${w}</span>`:''}</span>${i<steps.length-1?`<span class="ln ${s==='done'?'done':''}"></span>`:''}`; };
  return `<button class="open" data-tip="Their flow|Opens the panel with their journey with us: what is done, what is on now, whose move it is, what comes next.|Your choice is kept on this computer. The journey is drawn from Settings → Flows." onclick="setFlow(true)">‹</button>${flow.map(l=>`<span class="lane">${esc(l.lane)}</span>${l.steps.map((s,i)=>mark(s,i,l.steps)).join('')}`).join('')}<span class="cnt" data-tip="How far along|${nDone} of ${all.length} steps done.|Loops count once, however many rounds they have had.">${nDone} / ${all.length}</span>`; }
function flowPanelHtml(c){ const flow=FLOWS[c.kind]||[]; const st=FLOW_STATE[c.id]||{done:[],now:null,rounds:{}};
  const box=(step)=>{ const s=stepState(c,step.id); const tag = s==='now' ? `<span class="who ${whoNow(c,step)}">${whoNow(c,step)}</span>` : '';
    if(step.loop){ const rounds=(st.rounds[step.id]||[]); return `<div class="loop"><span class="lt">${esc(step.loop)}${rounds.length?` · ${rounds.length} so far`:''}</span><span class="box ${s}" id="fstep-${step.id}"><span>${esc(step.name)}</span>${tag}</span>${rounds.length?`<span class="rounds">${rounds.map(r=>`<span class="${r.s==='done'?'done':r.s==='now'?'now':''}">${esc(r.n)}</span>`).join('')}</span>`:`<span class="rounds"><span>none yet</span></span>`}</div>`; }
    return `<span class="box ${s} ${step.dec?'dec':''}" id="fstep-${step.id}"><span>${esc(step.name)}${step.dec?' <span class="note">· a fork</span>':''}</span>${tag}</span>`; };
  const lanes=flow.map(l=>`<div class="lane"><div class="t">${esc(l.lane)}${l.lane==='Per job'&&c.def?' · '+esc(jobById(c.def).name):''}</div><div class="boxes">${l.steps.map((s,i)=>(i?'<div class="arr">↓</div>':'')+box(s)).join('')}</div></div>`).join('');
  const nowStep=flow.flatMap(l=>l.steps).find(s=>s.id===st.now); const k=courtOf(c);

  return `<div class="ph2"><b>${c.kind==='customer'?'Her flow · customer':c.kind==='trade'?'Their flow · trade partner':c.kind==='arch'?'Their flow · architect':'Their flow'}</b><button class="quiet small" data-tip="Fold|Shrinks the flow to its rail of marks at the right.|Your choice is kept on this computer." onclick="setFlow(false)">fold ›</button></div><div class="flow">${lanes}</div><div class="fnext">${next}</div><div class="note" style="margin-top:8px">Drawn from Settings → Flows. <button class="quiet small" style="padding:0" onclick="view='settings';flowTab='${c.kind==='unknown'?'trade':c.kind}';render();setTimeout(()=>document.getElementById('flows')?.scrollIntoView({block:'start'}),0)">Edit the flow</button></div>`; }
function flowsEditorHtml(){ const kinds=[['customer','Customer'],['trade','Trade partner'],['arch','Architect']]; const flow=FLOWS[flowTab];

function renameStep(kind,id,v){ const s=FLOWS[kind].flatMap(l=>l.steps).find(x=>x.id===id); if(s&&v.trim()){ s.name=v.trim(); toast('Renamed in every panel.'); } }

// A quick reply's press fills the box, so the strip folds like any typing; the fold's row brings it back.
const qrNowWords = () => NOW_WORDS;
// A first guess at who a new line is for and its step, from its words; shown as a guess until the person confirms.
function qrGuess(text){ const t=text.toLowerCase(); const has=(...w)=>w.some(x=>t.includes(x));
  if(has('w-9','insurance')) return {for:'trade', step:'papers'};
  if(has('submittal')) return {for:'arch', step:'submittals'}; if(has('certify','certificate for','your certificate')) return {for:'arch', step:'certify'};
  if(has('pay application','pay app')) return {for:'customer', step:'payapp'}; if(has('start date')) return {for:'customer', step:'start'}; if(has('change order')) return {for:'customer', step:'co'}; if(has('contract')) return {for:'customer', step:'contract'};
  if(has('statement of work')) return {for:'trade', step:'sow'}; if(has('draw')) return {for:'trade', step:'draws'};
  if(has('invite','plans','addendum')) return {for:'trade', step:'invited'}; if(has('quote','number','portal','scope')) return {for:'trade', step:'ask'};
  return {for:'any', step:null}; }
const qrTagWords = q => `for ${QR_KINDS[q.for]} · on ${q.step?qrStepName(q.for,q.step):'no step'}`;
function editQuick(){ const bg=document.createElement('div'); bg.className='modal-bg'; const m=document.createElement('div'); m.className='modal xwide qrw'; bg.appendChild(m);
  let tab='all', search='', open=null, adding=false, addGuess=null;
  const kindOf=q=>q.scope==='mine'?'mine':q.for;
  const counts=()=>{ const all=quickReplies.filter(q=>!q.removed); return {all:all.length, trade:all.filter(q=>q.for==='trade').length, customer:all.filter(q=>q.for==='customer').length, arch:all.filter(q=>q.for==='arch').length, any:all.filter(q=>q.for==='any').length, mine:all.filter(q=>q.scope==='mine').length, removed:quickReplies.filter(q=>q.removed).length}; };
  const rowsFor=()=>{ const f=search.trim().toLowerCase(); return quickReplies.filter(q=> (tab==='removed'?q.removed:!q.removed) && (tab==='all'||tab==='removed'||(tab==='mine'?q.scope==='mine':q.for===tab)) && (!f||q.text.toLowerCase().includes(f))).sort((a,b)=>qrTotal(b)-qrTotal(a)||a.id-b.id); };
  // The rows in groups (the owner, 2026-10-11: sorted better): by who the line is for, trade partners, customers, architects, then anyone;
  // inside a kind by the flow's steps in their order, the lines on no step last; inside a step by use. A search or Mine keeps the groups.
  const KIND_ORDER=['trade','customer','arch','any'];
  const grouped=rows=>{ const out=[]; for(const k of KIND_ORDER){ const ofKind=rows.filter(q=>q.for===k); if(!ofKind.length) continue; const steps=qrStepsFor(k).map(st=>st.id); const byStep=new Map(); for(const q of ofKind){ const key=q.step&&steps.includes(q.step)?q.step:''; if(!byStep.has(key)) byStep.set(key,[]); byStep.get(key).push(q); } const keys=[...byStep.keys()].sort((a,b)=>(a===''?1e9:steps.indexOf(a))-(b===''?1e9:steps.indexOf(b))); for(const key of keys){ out.push({kind:k, step:key, title:`${QR_KINDS[k].replace(/^\w/,c=>c.toUpperCase())}${key?' · '+qrStepName(k,key):(k==='any'?'':' · no step')}`, rows:byStep.get(key)}); } } return out; };
  const lastChange=q=>{ const v=q.versions[q.versions.length-1]; return v.kind==='added'?'—':`${esc(v.by)} · ${esc(v.at.split(',')[0])}`; };
  const stepOptions=(kind,cur)=>`<option value="">on no step</option>`+qrStepsFor(kind).map(st=>`<option value="${st.id}" ${st.id===cur?'selected':''}>on ${esc(st.name)}</option>`).join('');
  const forOptions=cur=>Object.entries(QR_KINDS).map(([k,w])=>`<option value="${k}" ${k===cur?'selected':''}>for ${w}</option>`).join('');
  const hist=q=>`<div class="hist"><div class="h">History · ${q.versions.length} version${q.versions.length===1?'':'s'} · used ${qrTotal(q)} time${qrTotal(q)===1?'':'s'}</div>${[...q.versions].reverse().map(v=>`<div class="e"><span class="w">${esc(v.by)} · ${esc(v.at)}</span><span>${v.kind==='added'?`added it, ${esc(q.versions[0].forWords||'')}<ins>${esc(v.to)}</ins>`:v.kind==='words'?`changed the words: <del>${esc(v.from)}</del> → <ins>${esc(v.to)}</ins>`:v.kind==='tags'?`tagged it <ins>${esc(v.to)}</ins> (was ${esc(v.from)})`:v.kind==='removed'?'removed it (it stays here and can be brought back)':'brought it back'}</span></div>`).join('')}<div class="e"><span class="w">Used by</span><span class="usedby">${Object.entries(q.uses||{}).sort((a,b)=>b[1]-a[1]).map(([w,n])=>`<span><b>${esc(w)}</b> ${n}</span>`).join('')||'<span style="color:var(--text-muted)">nobody yet</span>'}${q.lastUsed?`<span style="color:var(--text-muted)">· last used ${esc(fmtDay(q.lastUsed.at))}${q.lastUsed.contact&&cById(q.lastUsed.contact)?', on '+esc(cById(q.lastUsed.contact).name):''}</span>`:''}</span></div></div>`;
  const editRow=q=>`<tr class="editrow"><td colspan="4"><div class="f"><textarea id="qe-text" rows="1" oninput="qrGrow(this)">${esc(q.text)}</textarea><div class="tags"><select id="qe-for" onchange="window.__qForChanged()">${forOptions(q.for)}</select><select id="qe-step">${stepOptions(q.for,q.step)}</select></div></div><div class="f"><button class="small primary" onclick="window.__qSave(${q.id})">Save</button><button class="small" onclick="window.__qOpen(null)">Cancel</button><span class="note">Saving keeps the old words in the history below, with your name and today.</span>${q.removed?`<button class="quiet small" style="margin-left:auto" onclick="window.__qRestore(${q.id})">Bring it back</button>`:`<button class="quiet small danger-t" style="margin-left:auto" onclick="window.__qRemove(${q.id})">Remove this line…</button>`}</div>${hist(q)}</td></tr>`;
  const paint=()=>{ const n=counts(); const rows=rowsFor();
    m.innerHTML=`<div class="head"><h2 style="margin:0">Quick replies</h2><input class="search" placeholder="⌕ find a line, or words in it" value="${esc(search)}" oninput="window.__qSearch(this.value)"><button class="primary small" onclick="window.__qAddOpen()">+ Add a line</button></div>
    <div class="tabs">${[['all','All',n.all],['trade','Trade partners',n.trade],['customer','Customers',n.customer],['arch','Architects',n.arch],['any','Anyone',n.any],['mine','Mine',n.mine]].concat(n.removed?[['removed','Removed',n.removed]]:[]).map(([k,l,c])=>`<button class="${tab===k?'on':''}" onclick="window.__qTab('${k}')">${l} · ${c}</button>`).join('')}</div>
    ${adding?`<div class="add"><div class="arow"><textarea id="qnew" rows="1" placeholder="The line you type every day…" oninput="qrGrow(this);window.__qGuess(this.value)">${esc(addGuess?.text||'')}</textarea><div class="tags"><select id="qnew-for" onchange="window.__qAddFor()">${forOptions(addGuess?.for||'any')}</select><select id="qnew-step">${stepOptions(addGuess?.for||'any',addGuess?.step||'')}</select></div></div><div class="arow foot"><span class="note" id="qguess">${addGuess&&addGuess.text?'guessed from the words':'the tags are guessed from the words'}</span><label class="note"><input type="checkbox" id="qnew-mine" style="width:auto"> just for me</label><button class="small primary" onclick="window.__qAdd()">Add</button><button class="small" onclick="window.__qAddOpen(false)">Cancel</button></div></div>`:''}
    <table class="qrt"><tr><th>Line</th><th class="r">Used</th><th>Added</th><th>Last change</th></tr>${rows.length?grouped(rows).map(g=>`<tr class="ghead"><td colspan="4"><span class="tag ${g.kind}">${QR_KINDS[g.kind]}</span>${g.step?` <span class="step">${esc(qrStepName(g.kind,g.step))}</span>`:(g.kind==='any'?'':' <span class="note">no step</span>')}<span class="note" style="margin-left:8px">${g.rows.length} line${g.rows.length===1?'':'s'}</span></td></tr>`+g.rows.map(q=>`<tr class="qr ${q.scope==='mine'?'mine':''} ${open===q.id?'open':''} ${q.removed?'removed':''}" onclick="window.__qOpen(${q.id})"><td class="line">${search?qrMarkWith(q.text,search):esc(q.text)}</td><td class="r"><span class="used">${qrTotal(q)}<small>${qrMine(q)} by you</small></span></td><td class="dim">${esc(q.versions[0].by)} · ${esc(q.versions[0].at.split(',')[0])}</td><td class="dim">${lastChange(q)}</td></tr>${open===q.id?editRow(q):''}`).join('')).join(''):`<tr><td colspan="4" class="empty">${search?'No line has those words.':'Nothing here yet.'}</td></tr>`}</table>
    <div class="btns"><span class="l">${rows.length} line${rows.length===1?'':'s'}${search?` match "${esc(search)}"`:''} · by who they are for, then the step, the most used first.</span><button onclick="this.closest('.modal-bg').remove();render()">Done</button></div>`;
    m.querySelectorAll('textarea#qe-text, textarea#qnew').forEach(qrGrow); if(adding){ const f=m.querySelector('#qnew'); if(f){ f.focus(); f.setSelectionRange(f.value.length,f.value.length); } } };
  window.__qSearch=v=>{ search=v; paint(); const f=m.querySelector('.search'); f.focus(); f.setSelectionRange(f.value.length,f.value.length); };
  window.__qTab=k=>{ tab=k; open=null; paint(); };
  window.__qOpen=id=>{ open=(open===id)?null:id; paint(); };
  window.__qForChanged=()=>{ const kind=m.querySelector('#qe-for').value; m.querySelector('#qe-step').innerHTML=stepOptions(kind,''); };
  window.__qSave=id=>{ const q=quickReplies.find(x=>x.id===id); const v=m.querySelector('#qe-text').value.trim(); const kind=m.querySelector('#qe-for').value; const step=m.querySelector('#qe-step').value||null; if(!v){toast('Write something, or Cancel.');return;} let changed=false;
    if(v!==q.text){ q.versions.push(V(ME,qrNowWords(),'words',v,q.text)); q.text=v; changed=true; }
    if(kind!==q.for||step!==q.step){ const from=qrTagWords(q); q.for=kind; q.step=step; q.versions.push(V(ME,qrNowWords(),'tags',qrTagWords(q),from)); changed=true; }
    toast(changed?'Saved, with your name and today in its history.':'Nothing changed.'); open=null; paint(); };
  window.__qRemove=id=>{ const q=quickReplies.find(x=>x.id===id); const bg2=document.createElement('div'); bg2.className='modal-bg'; bg2.style.zIndex='30'; bg2.innerHTML=`<div class="modal"><h2>Remove this line?</h2><p>“${esc(q.text)}”</p><p class="note">It leaves the strip and the list. It stays in the history as removed, with your name and today, and can be brought back from the Removed tab.</p><div class="btns"><button class="danger" id="rm">Remove it</button><button class="primary" id="keep">Keep it</button></div></div>`; document.body.appendChild(bg2); bg2.querySelector('#keep').onclick=()=>bg2.remove(); bg2.querySelector('#rm').onclick=()=>{ q.removed=true; q.versions.push(V(ME,qrNowWords(),'removed','')); bg2.remove(); open=null; toast('Removed. It can be brought back from the Removed tab.'); paint(); }; bg2.onclick=e=>{ if(e.target===bg2) bg2.remove(); }; bg2.querySelector('#keep').focus(); };

  window.__qAddFor=()=>{ const kind=m.querySelector('#qnew-for').value; m.querySelector('#qnew-step').innerHTML=stepOptions(kind,''); addGuess.for=kind; addGuess.step=null; m.querySelector('#qguess').textContent='set by you'; };

  paint(); document.body.appendChild(bg); bg.onclick=e=>{ if(e.target===bg){ bg.remove(); render(); } }; }
