<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Messages prototype</title>
<meta name="description" content="Prototype: every call, text and email with a contact in one place; jobs hang off the contact; a message can be tied to one job. GC mode, Click Construction. Made-up people. Nothing is saved.">
<style>
:root{--bg:#f6f7f9;--surface:#fff;--text:#1b1f24;--text-muted:#5c6470;--border:#dde1e6;--accent:#1f5fbf;--accent-soft:#e8f0fc;--team:#fff6c2;--team-border:#e9d77a;--warn:#b35c00;--warn-soft:#fff1e0;--ok:#1a7f3c;--ok-soft:#e6f6ec;--danger:#b3261e;--chip:#eef1f5;--radius:10px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:6px 10px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.quiet{border-color:transparent;background:transparent;color:var(--accent);padding:4px 6px}
button.small{padding:3px 8px;font-size:13px}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;border:1px solid var(--border);border-radius:8px;padding:7px 9px;background:var(--surface);color:var(--text)}
header.top{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 16px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header.top .brand{font-weight:700;margin-right:8px}
header.top nav{display:flex;gap:4px;flex-wrap:wrap}
header.top nav button{border-color:transparent;background:transparent;padding:6px 10px;border-radius:999px}
header.top nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--danger);color:#fff;font-size:12px;line-height:20px;text-align:center;margin-left:4px}
header.top .me{margin-left:auto;color:var(--text-muted);font-size:13px}
main{max-width:1180px;margin:0 auto;padding:16px}
.note{color:var(--text-muted);font-size:13px}
.lead{margin:0 0 12px;font-size:17px}
.two{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px}
.two.collapsed{grid-template-columns:64px minmax(0,1fr)}
.two.with-flow{grid-template-columns:340px minmax(0,1fr) 300px}
.two.with-flow.collapsed{grid-template-columns:64px minmax(0,1fr) 300px}
.two.with-frail{grid-template-columns:340px minmax(0,1fr) 64px}
.two.with-frail.collapsed{grid-template-columns:64px minmax(0,1fr) 64px}
@media(max-width:1040px){.two.with-flow,.two.with-flow.collapsed{grid-template-columns:64px minmax(0,1fr) 280px}}
@media(max-width:760px){.two.with-flow,.two.with-flow.collapsed{grid-template-columns:minmax(0,1fr)}.two.with-flow .list,.two.with-flow .rail{display:none}.fpanel{position:static;max-height:none}}
.fpanel{background:#fbfbfc;align-self:start;position:sticky;top:58px;max-height:calc(100vh - 74px);overflow:auto}
.rail{align-self:start;position:sticky;top:58px}
.frail{align-self:start;position:sticky;top:58px;display:flex;flex-direction:column;align-items:center;padding:8px 4px 10px;gap:0}
.frail .open{font-size:14px;color:var(--accent);border:1px solid var(--border);border-radius:50%;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;background:var(--surface);margin-bottom:6px;padding:0;cursor:pointer}
.frail .lane{font-size:9px;letter-spacing:.6px;color:var(--text-muted);text-transform:uppercase;margin:6px 0 2px}
.frail .stepw{display:flex;flex-direction:column;align-items:center}
.frail .st{width:16px;height:16px;border-radius:50%;border:2px solid #cfd5dd;background:var(--surface);box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer;color:var(--text-muted)}
.frail .st.done{background:var(--ok);border-color:var(--ok);color:#fff}
.frail .st.now{border-color:var(--warn);background:var(--warn-soft);width:20px;height:20px}
.frail .st.now::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--warn)}
.frail .st.now.them{border-color:var(--ok);background:var(--ok-soft)}.frail .st.now.them::after{background:var(--ok)}
.frail .st.dec{border-radius:4px}
.frail .ln{width:2px;height:10px;background:var(--border)}.frail .ln.done{background:var(--ok)}
.frail .tag{font-size:9px;font-weight:700;padding:0 5px;border-radius:999px;margin-top:3px}
.frail .tag.us{background:var(--warn-soft);color:var(--warn)}.frail .tag.them{background:var(--ok-soft);color:var(--ok)}.frail .tag.both{background:var(--bg);color:var(--text-muted)}
.frail .cnt{font-size:11px;font-weight:700;color:var(--text);margin-top:8px}
.fpanel .ph2{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.fpanel .ph2 b{font-size:13px}
.flow{display:flex;flex-direction:column;gap:6px;font-size:12px}
.flow .lane{border:1px solid var(--border);border-radius:10px;padding:8px;background:var(--surface)}
.flow .lane .t{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.flow .boxes{display:flex;flex-direction:column;align-items:stretch;gap:2px}
.flow .box{border:1px solid var(--border);border-radius:7px;padding:6px 9px;background:var(--surface);position:relative;display:flex;align-items:center;gap:8px;font-size:12.5px}
.flow .box>span:first-child{flex:1;min-width:0}
.flow .box.done{background:var(--ok-soft);border-color:#bfe3c9;color:var(--ok)}
.flow .box.now{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);font-weight:600}
.flow .box.dec{border-left:4px solid #c9b7ea}
.flow .box.dec.done{border-left-color:#8fcf9f}
.flow .box.dec.now{border-left-color:var(--warn)}
.flow .arr{color:#9aa4b1;text-align:center;font-size:11px;line-height:1;margin:1px 0}
.flow .loop{border:1px dashed #c9d0d8;border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:4px}
.flow .loop .lt{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;padding:0 3px}
.flow .loop .rounds{display:flex;gap:4px;flex-wrap:wrap;padding:0 3px}
.flow .loop .rounds span{font-size:10.5px;border:1px solid var(--border);border-radius:999px;padding:0 6px;background:var(--surface)}
.flow .loop .rounds span.done{background:var(--ok-soft);border-color:#bfe3c9;color:var(--ok)}
.flow .loop .rounds span.now{background:var(--warn-soft);border-color:#f0d3b0;color:var(--warn)}
.flow .who{font-size:10px;border-radius:999px;padding:0 7px;border:1px solid;background:var(--surface);font-weight:700;flex:none;line-height:16px}
.flow .who.us{color:var(--warn);border-color:#f0d3b0;background:var(--warn-soft)}
.flow .who.them{color:var(--ok);border-color:#bfe3c9;background:var(--ok-soft)}
.flow .who.both{color:var(--text-muted);border-color:var(--border)}
.fnext{font-size:12px;color:var(--text-muted);margin-top:8px;border-top:1px solid var(--border);padding-top:8px}
.fnext b{color:var(--text)}
.feditor .tabs{display:flex;gap:6px;margin:6px 0 10px}
.feditor .tabs button{border-radius:999px}
.feditor .tabs button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.feditor table{width:100%;border-collapse:collapse;font-size:13px}
.feditor th{text-align:left;font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;border-bottom:1px solid var(--border)}
.feditor td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top}
.feditor td.g{color:var(--text-muted)}
.feditor td input{width:100%;padding:3px 6px}
.feditor .lanehead td{background:var(--bg);font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em}
.rail{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 6px}
.rail .avatar{cursor:pointer;position:relative;width:38px;height:38px}
.rail .avatar.on{outline:2px solid var(--accent);outline-offset:2px}
.rail .avatar .cd{position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border-radius:50%;border:2px solid var(--surface);background:#cfd5dd}
.rail .avatar .cd.ours{background:var(--warn)}.rail .avatar .cd.theirs{background:#1a7f3c}
.list .lhead{display:flex;align-items:center;gap:6px;padding:8px 10px 0}
.list .lhead input{flex:1;min-width:0}
.collapse{width:30px;height:30px;padding:0;border-radius:50%;font-size:15px;flex:none}
.two>*{min-width:0}
@media(max-width:860px){.two{grid-template-columns:1fr}.list.hidden-narrow{display:none}.two.with-frail{grid-template-columns:minmax(0,1fr) 64px}}
@media(max-width:760px){.two.with-frail,.two.with-frail.collapsed{grid-template-columns:minmax(0,1fr)}.frail{order:-1;position:static;flex-direction:row;flex-wrap:wrap;justify-content:center;padding:8px 10px;gap:0}.frail .lane{writing-mode:horizontal-tb;margin:0 8px 0 4px}.frail .ln{width:10px;height:2px}.frail .cnt{margin:0 0 0 8px}.frail .open{margin:0 8px 0 0}.frail .stepw{flex-direction:row}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px}
.list .row{display:flex;gap:10px;padding:10px;border-top:1px solid var(--border);cursor:pointer;align-items:flex-start}
.list .row:first-child{border-top:0}
.list .row.on{background:var(--accent-soft)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none;color:var(--text-muted)}
.avatar.cust{background:#e6f1ff;color:#1f5fbf}.avatar.trade{background:#eef7ea;color:#1a7f3c}.avatar.arch{background:#f3eaff;color:#6d3fb8}.avatar.unknown{background:#fff1e0;color:#b35c00}
.row .who{font-weight:600}
.row .sub{color:var(--text-muted);font-size:13px}
.row .last{font-size:14px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .right{margin-left:auto;text-align:right;font-size:12px;color:var(--text-muted);flex:none;max-width:132px}
.court.tiny{font-size:11px;padding:1px 7px 1px 5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-flex}
.list .row > div:nth-child(2){flex:1;min-width:0}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--chip);color:var(--text-muted);margin-right:4px}
.pill.waiting{background:var(--warn-soft);color:var(--warn)}
.pill.has{background:var(--accent-soft);color:var(--accent)}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.promise{background:#eef7ea;color:var(--ok)}
.pill.stop{background:#fde7e5;color:var(--danger)}
h2{font-size:18px;margin:0 0 8px}
h3{font-size:14px;margin:14px 0 6px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em}
.thread-head{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.hdr .row1{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hdr .row1 .name{flex:1 1 180px;min-width:0}
.hdr .row1 .corner{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.hdr .row1 h2{margin:0;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .row1 .email{font-size:13px;color:var(--text-muted);margin-top:1px}
.hdr .row2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 0;color:var(--text-muted);font-size:14px}
.court{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:2px 9px 2px 7px;border-radius:999px;border:1px solid var(--border);background:var(--surface)}
.court i{width:9px;height:9px;border-radius:50%;background:#cfd5dd;display:inline-block}
.court.ours{color:var(--warn);border-color:#f0d3b0;background:var(--warn-soft)}.court.ours i{background:var(--warn)}
.court.theirs{color:#1a7f3c;border-color:#bfe3c9;background:#eef7ea}.court.theirs i{background:#1a7f3c}
.court.none{color:var(--text-muted)}
.stamps{margin-left:auto;display:grid;grid-template-columns:auto auto;column-gap:8px;row-gap:1px;font-size:12px;color:var(--text-muted);text-align:right;flex-shrink:0;align-self:flex-start}
.stamps b{font-weight:600;color:var(--text)}.stamps span{white-space:nowrap}
.hdr .row3{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;margin:6px 0 0}.hdr .row3 .court,.hdr .row3>button{margin-top:1px}

.hdr .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 0;padding-top:8px;border-top:1px solid var(--border)}
.hdr .toolbar .grow{flex:1}
.hdr .jobs-rail{margin:10px 0 2px}
.hdr .hint-r{margin-left:auto;font-size:12px}

.thread-head .avatar{width:44px;height:44px;font-size:15px}
.thread-head .actions{display:flex;gap:6px;flex-wrap:wrap;width:100%;margin-top:4px}
.thread-head .corner{margin-left:auto;align-self:flex-start}
.jobs-rail{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:10px 0}
.jobchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:999px;padding:4px 10px;background:var(--surface);cursor:grab;user-select:none;font-size:13px}
.jobchip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.jobchip .star{cursor:pointer;color:#c9a200}
.jobchip .x{color:var(--text-muted);cursor:pointer}
.jobchip.ghost{border-style:dashed;color:var(--text-muted);cursor:pointer}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.filters button{border-radius:999px;padding:3px 10px;font-size:13px}
.filters button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.day{color:var(--text-muted);font-size:12px;margin:14px 0 6px;text-align:center}
.msg{border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;margin:8px 0;background:var(--surface);position:relative}
.msg.out{margin-left:40px;background:#f4f8ff}
.msg.in{margin-right:40px}
.msg.team{background:var(--team);border-color:var(--team-border)}
.msg.drop{outline:2px dashed var(--accent);outline-offset:2px}
.evt{text-align:center;font-size:12px;color:var(--text-muted);margin:10px 0}
.evt b{font-weight:600;color:var(--text)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2ecc71;margin-left:6px;vertical-align:middle}
.dot.away{background:#c9d0d8}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;font-size:13px}
.seg button{border:0;border-radius:0;padding:5px 11px;background:var(--surface)}
.seg button+button{border-left:1px solid var(--border)}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.msg .meta{font-size:12px;color:var(--text-muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg .meta .ch{font-weight:600;color:var(--text)}
.msg .meta .job{margin-left:auto;background:var(--chip);padding:1px 8px;border-radius:999px;cursor:pointer}
.msg .meta .job.none{color:var(--text-muted);font-style:italic}
.msg .body{margin:6px 0 0;white-space:pre-wrap}
.msg .body.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.msg .subject{font-weight:600;margin-top:6px}
.msg .more{font-size:12px;color:var(--accent);margin-top:4px;cursor:pointer}
.msg .hl{margin:6px 0 0;padding:6px 10px;border-left:3px solid #e9c400;background:#fff9d6;border-radius:0 8px 8px 0;font-size:14px}
.msg .hl small{display:block;color:var(--text-muted);font-size:11px;margin-top:2px}
.msg.clickable{cursor:pointer}
.msg.clickable:hover{border-color:#b9c4d4}
.att{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.att .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:8px;padding:4px 8px;font-size:12px;background:var(--surface);cursor:pointer}
.att .chip .ic{width:22px;height:22px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;background:#8a93a0}
.att .chip .ic.pdf{background:#c0392b}.att .chip .ic.image{background:#2a8f5a}.att .chip .ic.link{background:#1f5fbf}
.att .chip .thumb{width:40px;height:30px;border-radius:4px;background:linear-gradient(135deg,#9bc 0%,#7a9 60%,#cc9 100%)}
.switch{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-muted);cursor:pointer;user-select:none}
.switch i{width:30px;height:18px;border-radius:999px;background:#cfd5dd;position:relative;display:inline-block;transition:.15s}
.switch i::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.15s}
.switch.on i{background:var(--accent)}.switch.on i::after{left:14px}
.mw .facts{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;font-size:13px;margin:8px 0 10px}
.mw .facts dt{color:var(--text-muted)}.mw .facts dd{margin:0}
.mw .tools{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.mw .full{border:1px solid var(--border);border-radius:8px;padding:12px;white-space:pre-wrap;font-size:14px;line-height:1.45;max-height:48vh;overflow:auto;user-select:text}
.mw .full mark{background:#fff3a3;border-radius:3px;padding:0 2px}
.mw .hls{margin-top:8px}
.mw .hls div{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:6px 8px;background:#fff9d6;border-left:3px solid #e9c400;border-radius:0 6px 6px 0;margin-top:4px}
.mw .hls div span{flex:1}.mw .hls small{color:var(--text-muted)}
.mw .attl div{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--border);font-size:13px}
.mw .attl div:first-child{border-top:0}
.mw .attl .nm{flex:1}
@media print{ body.printing>*:not(.modal-bg){display:none!important} body.printing .modal-bg{position:static;background:none;padding:0} body.printing .modal{box-shadow:none;max-width:none;max-height:none;overflow:visible} body.printing .mw .tools,body.printing .mw .btns{display:none!important} body.printing .mw .full{max-height:none;border:0;padding:0} }
.msg .offer{margin-top:8px;padding:8px;border-radius:8px;background:var(--warn-soft);font-size:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg .offer.q{background:#f3eaff}
.msg .offer .tag{font-size:11px;opacity:.7;margin-left:4px;font-weight:400}
.msg .offer button.primary .tag{opacity:.85}
.msg .player{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--chip);margin-top:6px}
.msg .written{margin-top:6px;font-size:13px;color:var(--ok)}
.reply{margin-top:12px;border-top:1px solid var(--border);padding-top:10px}
.reply .kinds{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap;align-items:center}
.reply .kinds button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.reply .kinds button.team{background:var(--team);border-color:var(--team-border);color:var(--text)}
.reply .kinds button.team.on{background:var(--team);border-color:#b89a1c;color:var(--text);font-weight:600}
.reply textarea{width:100%;min-height:64px;resize:vertical}
.reply textarea.team{background:var(--team);border-color:var(--team-border)}
.reply .settling{background:var(--team);border:1px solid var(--team-border);border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.reply .settling .note{margin-left:auto}
.settled-chip{font-size:11px;color:#1f6b2f;background:#e6f4ea;border:1px solid #bfe0c8;border-radius:999px;padding:1px 7px;cursor:help}
.reply .send{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.reply .send .tie{margin-left:auto;font-size:13px;color:var(--text-muted)}
.quickwrap{margin:8px 0 10px;position:relative;min-width:0;max-width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:8px 10px 4px}

// ---------- helpers ----------
const fmt = ts => { const d=new Date(ts); const today=new Date(2026,9,2); const same=d.toDateString()===today.toDateString(); const h=d.getHours(), m=String(d.getMinutes()).padStart(2,'0'); const hh=((h+11)%12)+1, ap=h<12?'AM':'PM'; return same? `${hh}:${m} ${ap}` : d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})+` · ${hh}:${m} ${ap}`; };
const dayOf = ts => { const d=new Date(ts); const today=new Date(2026,9,2); return d.toDateString()===today.toDateString()?'Today, Fri Oct 2':d.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'}); };
const lastOut = c => [...messages].filter(m=>m.c===c.id&&m.dir==='out').sort((a,b)=>b.at-a.at)[0];
const agoWords = ts => { const mins=Math.max(1,Math.round((NOW-ts)/60000)); if(mins<60) return `${mins} min`; if(mins<60*24) return `${Math.round(mins/60)} h`; return `${Math.round(mins/1440)} d`; };
const lastInOnly = c => [...messages].filter(m=>m.c===c.id&&m.dir==='in').sort((a,b)=>b.at-a.at)[0];
const courtOf = c => { const i=lastInOnly(c), o=lastOut(c); if(c.optout) return {side:'none', word:'opted out'}; if(c.owe) return {side:'ours', word:`Our court · we owe ${c.owe.what}${c.owe.by?' · by '+c.owe.by:''}`, owe:true}; if(!i&&!o) return {side:'none', word:'no messages yet'}; if(!o || (i && i.at>o.at)) return {side:'ours', word:`Our court · ${agoWords(i.at)}`, since:i.at}; return {side:'theirs', word:c.promise?`Their court · ${c.promise.replace('promised ','until ')}`:`Their court · ${agoWords(o.at)}`, since:o.at}; };
const courtStrip = c => { const k=courtOf(c), i=lastInOnly(c), o=lastOut(c); return `<span class="court ${k.side}" data-tip="${k.owe?'Our court, we owe them|Someone marked that we still owe them something, so the ball stays with us even after we write.|It clears when someone presses Settled, or sends a message marked as settling it. It shows under We owe them in Follow up.':k.side==='ours'?'Our court|The last word was theirs, so the next move is ours.|It counts from their last message. A reply, an email or a call from us puts it in their court, unless we mark that we still owe them something.':k.side==='theirs'?'Their court|The last word was ours, so we are waiting on them.|It counts from our last message, or runs until the day they promised. Their next message puts it back in our court.':'No court|Nothing is owed either way.|'}"><i></i>${esc(k.word)}</span>${k.owe?`<button class="small" data-tip="Settled|Opens a note for the team at the bottom: how or why it was settled.|Adding the note clears what we owed; the ball goes by whose word was last, and the row leaves We owe them." onclick="settle('${c.id}')">Settled</button>`:`<button class="quiet small" data-tip="We owe them…|Mark something we still have to do for them, with a day.|The ball stays in our court after we write, and Follow up lists it under We owe them." onclick="oweDialog('${c.id}')">We owe them…</button>`}<span class="stamps" data-tip="Them and Us|Their last word to us, and our last word to them.|The court counts from whichever is newer, unless we owe them something."><b>Them</b><span>${i?`${chWord(i).toLowerCase()} · ${fmt(i.at)}`:'nothing yet'}</span><b>Us</b><span>${o?`${chWord(o).toLowerCase()} · ${fmt(o.at)}`:'nothing yet'}</span></span>`; };
const courtShort = c => { const k=courtOf(c); if(k.owe) return {side:k.side, word:'Our · we owe', title:k.word}; return {side:k.side, word:k.word.replace(/^Our court/,'Our').replace(/^Their court/,'Their'), title:k.word}; };
const snippetOf = m => m.ch==='email' ? (m.subject||m.text.split('\n')[0]) : m.ch==='missed' ? 'no voicemail' : m.text;
const waitingSince = c => { const last=[...messages].filter(m=>m.c===c.id&&m.dir==='in').sort((a,b)=>b.at-a.at)[0]; if(!last) return ''; const mins=Math.max(1,Math.round((NOW-last.at)/60000)); if(mins<60) return `waiting ${mins} min`; if(mins<60*24) return `waiting ${Math.round(mins/60)} h`; return `waiting ${Math.round(mins/1440)} d`; };

      ${c.state!=='waiting'?`<button class="quiet" title="Demo: a new message from them reopens the row by itself" onclick="theyReply('${c.id}')">They text back (demo)</button>`:''}
</div>
    <div class="jobs-rail" id="rail"><span class="note" data-tip="Their jobs|The bids, projects and Pipeline jobs they are part of.|New messages from them land on the ★ one. Drag a job onto a line to tie that message there; press and hold on a phone. A line with no job sits on the person alone.">Their jobs</span>${cJobs.map(j=>`<span class="jobchip ${jobFilter===j.id?'on':''}" draggable="true" data-job="${j.id}" title="Drag onto a message to tie it there. Click to filter."><span class="star" title="New messages go here" onclick="event.stopPropagation();setDefault('${c.id}','${j.id}')">${c.def===j.id?'★':'☆'}</span><span onclick="jobFilter=jobFilter==='${j.id}'?null:'${j.id}';render()">${esc(jobLabel(c,j.id))}</span><span class="note" onclick="jobFilter=jobFilter==='${j.id}'?null:'${j.id}';render()"> · ${esc(j.note)}</span><span class="x" title="Open this job" onclick="event.stopPropagation();jobModal('${j.id}')">⧉</span><span class="x" title="Remove this job from them" onclick="event.stopPropagation();removeJob('${c.id}','${j.id}')">×</span></span>`).join('')}<span class="jobchip ghost" onclick="addJob('${c.id}')">+ add a job</span>${jobFilter?`<button class="quiet small" onclick="jobFilter=null;render()">show all</button>`:''}</div>
  </div>
  <div id="lines"></div>
  <div class="reply">
    <div class="kinds">${[['text','Text'],['email','Email'],['note','Note for the team']].map(([k,l])=>`<button class="${k==='note'?'team ':''}${replyKind===k?'on':''}" onclick="replyKind='${k}';if('${k}'!=='note')settling=null;render()">${l}</button>`).join('')}<span class="note" style="margin-left:auto">${replyKind==='text'?'from the company number (210) 555-0100 · Click Construction':replyKind==='email'?'from bids@clickconstruction · Click Construction':'only the team sees a note; adding one closes the row'}</span></div>
    ${replyKind!=='note'?`<div class="quickwrap"><div class="ql">Quick replies <span>· scroll for more · a press fills the box, nothing sends</span><button class="quiet small" style="margin-left:auto" data-tip="Edit quick replies|Opens the team's lines and yours.|Anyone can add or change a line; each keeps who added or edited it and when." onclick="editQuick()">Edit</button></div><div class="quick">${quickList().map(q=>`<button title="${q.scope==='team'?'The team\'s':'Mine'}" onclick="useQuick(${q.id})">${esc(q.text)}</button>`).join('')}</div></div>`:''}
    ${settling===c.id&&c.owe?`<div class="settling"><b>Settling:</b> we owed ${esc(c.owe.what)}${c.owe.by?' · by '+esc(c.owe.by):''} · marked by ${esc(c.owe.who)} ${esc(c.owe.since)}<span class="note">Say how or why, for the team. The note settles it.</span></div>`:''}
    <textarea id="box" oninput="countBox(this)" class="${replyKind==='note'?'team':''}" placeholder="${settling===c.id&&c.owe?'How it was settled: what we did, or why nothing is owed…':replyKind==='note'?'A note only the team sees…':'Write to '+esc(c.name)+'…'}" ${c.optout&&replyKind==='text'?'disabled':''}></textarea>
    ${replyKind!=='note'?`<div class="previews"><span>Send shows it to you the way they will see it, before it goes.</span><span class="note" id="pvcount"></span></div>`:''}
    <div class="send">${settling===c.id&&c.owe?`<button class="primary" data-tip="Settle with this note|Clears what we owed and keeps your words in the thread.|The row closes as any note does; the ball goes by whose word was last. Follow up drops it from We owe them." onclick="finishSettle('${c.id}')">Settle with this note</button><button class="quiet" onclick="cancelSettle()">Not settled yet</button>`:`<button class="primary" onclick="${replyKind==='note'?`sendReply('${c.id}')`:`previewDraft('${c.id}','${replyKind}')`}" ${c.optout&&replyKind==='text'?'disabled':''}>${replyKind==='note'?'Add the note':replyKind==='email'?'Send email…':'Send text…'}</button>`}${c.optout&&replyKind==='text'?'<span class="note">They sent STOP. The app will not text this number.</span>':''}
      <span class="tie">Tie to: <button type="button" class="tiebtn" data-tip="Tie to|Which job this message lands on.|The job's page shows only what is tied to it; the person's thread shows everything. New messages from them go to the ★ default." onclick="tiePicker('${c.id}',this)">${tieLabel(c)} <span>▾</span></button></span></div>
  </div>`;
  const L=th.querySelector('#lines');
  if(!lines.length) L.innerHTML='<div class="empty">Nothing yet.</div>';
  let lastDay='';
  for(const x of lines){ const d=dayOf(x.at); if(d!==lastDay){ const dd=document.createElement('div'); dd.className='day'; dd.textContent=d; L.appendChild(dd); lastDay=d; }
    if(x.ch==='event'){ const ev=document.createElement('div'); ev.className='evt'; ev.innerHTML=`${esc(x.text)} · ${fmt(x.at)}`; L.appendChild(ev); continue; }
    const e=document.createElement('div'); e.className=`msg clickable ${x.dir==='team'?'team':x.dir}`; e.dataset.id=x.id; e.title='Open this message';
    e.addEventListener('click',ev=>{ if(ev.target.closest('button, a, select, input, .job, .offer, .chip, .player')) return; openMessage(x.id); });
    e.innerHTML=`<div class="meta"><span class="ch">${chWord(x)}${x.dur?` · ${x.dur}`:''}</span><span>${esc(x.who)}</span><span>${fmt(x.at)}</span>
        ${x.settled?`<span class="settled-chip" data-tip="Settled|This note settled what we owed them.|We owed ${esc(x.settled.what)}${x.settled.by?' by '+esc(x.settled.by):''}; the court went back to whose word was last.">✓ settled ${esc(x.settled.what)}</span>`:''}<span class="job ${x.job?'':'none'}" title="${x.job?'Untie from this job':'Tie to a job'}" onclick="${x.job?`untie(${x.id})`:`tieMenu(${x.id})`}">${x.job?esc(jobLabel(c,x.job))+' ×':'no job'}</span></div>
      ${x.subject?`<div class="subject">${esc(x.subject)}</div>`:''}
      ${bodyHtml(c,x)}
      ${x.attachments?`<div class="att">${x.attachments.map((a,i)=>`<span class="chip" onclick="event.stopPropagation();openAttachment(${x.id},${i})">${a.kind==='image'?'<span class="thumb"></span>':`<span class="ic ${a.kind}">${a.kind==='pdf'?'PDF':a.kind==='link'?'↗':'F'}</span>`}<span>${esc(a.name)} <span class="note">· ${esc(a.size)}</span></span></span>`).join('')}</div>`:''}
      ${x.transcript?`<span class="player">▶ ${x.dur||''} · Transcript</span>`:''}
      ${x.promise&&x.promise.state==='offered'?promiseOffer(c,x):''}
      ${x.promise&&x.promise.state==='written'?`<div class="written">✓ Written down by ${esc(x.promise.by)}: ${esc(x.promise.what)} by ${esc(x.promise.day)} · ${esc(x.promise.where)}.</div>`:''}
      ${x.promise&&x.promise.state==='no'?`<div class="written" style="color:var(--text-muted)">Not a promise, said ${esc(x.promise.by)}.</div>`:''}
      ${x.question&&x.question.state==='offered'?`<div class="offer q">This reads like a question about the plans. <button class="small primary" onclick="askArchitect(${x.id})">Ask the architect</button><button class="small" onclick="answerMyself(${x.id})">Answer it myself</button></div>`:''}
      ${x.question&&x.question.state==='asked'?`<div class="written">✓ Sent to the architect as a plan question by ${esc(x.question.by)}.</div>`:''}`;
    // drag targets
    e.addEventListener('dragover',ev=>{ if(dragJob){ev.preventDefault(); e.classList.add('drop');} });
    e.addEventListener('dragleave',()=>e.classList.remove('drop'));
    e.addEventListener('drop',ev=>{ ev.preventDefault(); e.classList.remove('drop'); if(dragJob){ tie(x.id,dragJob); dragJob=null; } });
    // press and hold on narrow
    let pt; e.addEventListener('pointerdown',()=>{ if(!narrow()) return; pt=setTimeout(()=>tieMenu(x.id),550); }); e.addEventListener('pointerup',()=>clearTimeout(pt)); e.addEventListener('pointermove',()=>clearTimeout(pt));
    L.appendChild(e); }
  th.querySelectorAll('.jobchip[draggable]').forEach(ch=>{ ch.addEventListener('dragstart',ev=>{ dragJob=ch.dataset.job; ev.dataTransfer.setData('text/plain',dragJob); }); ch.addEventListener('dragend',()=>{dragJob=null;}); });
  wrap.appendChild(th);
  if(flowOpen){ const fp=document.createElement('div'); fp.className='card fpanel'; fp.innerHTML=flowPanelHtml(c); wrap.appendChild(fp); }
  else { const fr=document.createElement('div'); fr.className='card frail'; fr.innerHTML=flowRailHtml(c); wrap.appendChild(fr); }
  m.appendChild(wrap);
  requestAnimationFrame(()=>{ if(window.__landing) return; const l=document.getElementById('lines'); if(l) l.scrollIntoView({block:'nearest'}); });
}

function renderJob(m){
  const j=jobById(openJob);
  const rows = messages.filter(x=>x.job===j.id).sort((a,b)=>b.at-a.at);
  const el=document.createElement('div');
  el.innerHTML=`<p class="lead">${esc(j.name)} <span class="note">· ${esc(j.note)} · ${j.kind==='bid'?'a bid':j.kind==='project'?'a GC project':'a Pipeline job'}</span></p>
  <div class="filters">${jobs.map(x=>`<button class="${x.id===openJob?'on':''}" onclick="openJob='${x.id}';render()">${esc(x.name)}</button>`).join('')}</div>
  <p class="note">Conversations on this job: the messages tied to it, by person, newest first. The job reads only what is tied to it; the person's thread reads everything.</p>
  <div class="card list jobconv">${rows.length?rows.map(x=>{ const c=cById(x.c); return `<div class="row" onclick="openThread('${c.id}')" style="cursor:pointer"><div class="avatar ${kindClass(c)}">${initials(c)}</div><div style="flex:1"><div class="who">${esc(c.name)} <span class="note">· ${esc(c.company||kindWord(c))}</span></div><div class="last">${chWord(x)}: ${esc(x.text)}</div></div><div class="right">${fmt(x.at)}<br>${c.state==='waiting'?'<span class="pill waiting">waiting</span>':'<span class="pill done">answered</span>'}</div></div>`;}).join(''):'<div class="empty">No calls or texts tied to this job yet.</div>'}</div>`;
  m.appendChild(el);
}

function renderSettings(m){
  const el=document.createElement('div');
  el.innerHTML=`<p class="lead">Settings → Phone and texts</p><div class="card settings"><dl>
  <dt>Quo connection</dt><dd>Connected · last event 2 min ago · API key qo_live_••••••••7f3a</dd>
  <dt>The company number</dt><dd>(210) 555-0100, one for everyone. Rings everyone; anyone answers or texts from it.</dd>
  <dt>Text registration</dt><dd>Approved. Needed before texting customers. STOP and HELP are answered by the app.</dd>
  <dt>Recordings</dt><dd>On, every call, no notice (Texas needs one side's consent).</dd>
  <dt>Transcripts and summaries</dt><dd>On, every call (Quo Business).</dd>
  <dt>Quo seats</dt><dd>Two: Rosa, the assistant (customers), and Robert, the estimator (trade partners). Everyone else works in the app.</dd>
  <dt>Who sees threads</dt><dd>Everyone on the team. The Money tab stays the owner's.</dd>
  <dt>Who gets a new message</dt><dd>In this order: whoever answered this person last, if they are here today; else by who they are: a customer → Rosa (the assistant's seat), a trade partner or an architect → Robert (the estimator's seat); a number nobody knows → nobody, so whoever answers first takes it. The pill says it was by the rule, and anyone can take it. <span class="note">(proposed 2026-10-11, the owner's call)</span></dd>
  <dt>Email</dt><dd>bids@ read through a Google grant; replies go out as Click Construction. <span class="note">(open question)</span></dd>
  <dt>Claude</dt><dd>Reads texts and call summaries for a promised day or a plans question; every guess is a button. <span class="note">(day one or later: the owner's call)</span></dd>
  </dl></div>${flowsEditorHtml()}`;
  m.appendChild(el);
}

// ---------- actions ----------
function openThread(id, mid){ openContact=id; jobFilter=null; replyTie=null; if(view!=='customers') view='messages'; render(); if(mid){ requestAnimationFrame(()=>{ const el=[...document.querySelectorAll('#lines .msg')].find(e=>e.dataset.id===String(mid)); if(el){ el.scrollIntoView({block:'center'}); el.classList.add('flash'); } }); } }
function hasPill(c){ if(!c.has) return `<button type="button" class="haspill none" data-tip="Nobody has it|No one has claimed this conversation.|Whoever answers first takes it. Press to take it or hand it to someone." onclick="whoPicker('${c.id}',this)"><span class="av">?</span>Nobody has it · Take it</button>`; const me=c.has===ME; return `<button type="button" class="haspill ${me?'me':''}" data-tip="${me?'You have this|You claimed it, so the team leaves it to you.|Press to hand it to someone or put it back; the thread records the change.':esc(c.has)+' has this|'+esc(c.has)+' claimed it, so nobody else answers it.|Press to take it or hand it on; the thread records the change.'}" onclick="whoPicker('${c.id}',this)"><span class="av">${initialsOf(c.has)}</span>${me?'You have this':esc(c.has)+' has this'}${c.hasSince?` <span class="since">· since ${esc(c.hasSince)}</span>`:''}</button>`; }
function whoPicker(cid, btn){ document.removeEventListener('click', outsideWho); if(document.getElementById('whopick')){ closeWho(); return; } const c=cById(cid);
  const person = n => `<div class="wrow ${c.has===n?'on':''}" onclick="claim('${cid}','${n}');closeWho()"><span class="chk">${c.has===n?'✓':''}</span><span class="av">${initialsOf(n)}</span><span class="wn"><b>${n===ME?'You':n}<span class="dot ${TEAM_INFO[n].here?'':'away'}" title="${TEAM_INFO[n].here?'here':'away'}"></span>${c.has===n?' <span class="note">· has it now</span>':''}</b><small>${esc(TEAM_INFO[n].role)} · ${esc(TEAM_INFO[n].status)} · holds ${holdCount(n)} waiting</small></span></div>`;
  const take = c.has!==ME ? `<div class="wrow take" onclick="claim('${cid}','${ME}');closeWho()"><span class="chk"></span><span class="av">${initialsOf(ME)}</span><span class="wn"><b>I'll take it</b><small>${c.has?`${esc(c.has)} sees it move to you; the thread says so.`:'So nobody else answers it too.'}</small></span></div>` : '';
  const others = TEAM.filter(n=>n!==ME).map(person).join('');
  const none = c.has ? `<div class="wrow" onclick="claim('${cid}','')"><span class="chk"></span><span class="av">?</span><span class="wn"><b>Nobody</b><small>Put it back for whoever answers first.</small></span></div>` : '';
  const pk=document.createElement('div'); pk.className='whopick'; pk.id='whopick'; pk.innerHTML=`<div class="ph">${c.has?`${c.has===ME?'You have':esc(c.has)+' has'} ${esc(c.name)}${c.hasSince?' since '+esc(c.hasSince):''}.`:`Nobody has ${esc(c.name)} yet.`} Hand it to:</div>${take}${c.has===ME?person(ME):''}${others}${none}`;
  btn.parentElement.appendChild(pk); setTimeout(()=>document.addEventListener('click', outsideWho, {once:true}),0); }
function morePicker(cid, btn){ document.removeEventListener('click', outsideWho); closeWho(); const c=cById(cid);
  const pk=document.createElement('div'); pk.className='whopick'; pk.id='whopick'; pk.style.width='260px';
  pk.innerHTML=`<div class="wrow" onclick="closeWho();showAll['${cid}']=!showAll['${cid}'];render()"><span class="chk">${showAll[cid]?'✓':''}</span><span class="wn"><b>Show all text</b><small>Every message in full instead of four lines or its highlights. This thread only.</small></span></div>
    <div class="wrow" onclick="closeWho();toggleOptout('${cid}')"><span class="chk">${c.optout?'✓':''}</span><span class="wn"><b>${c.optout?'Clear opt-out':'Mark STOP'}</b><small>${c.optout?'Lets the app text this number again.':'They asked for no more texts; the app refuses to text this number.'}</small></span></div>
    <div class="wrow" onclick="closeWho();view='settings';flowTab='${c.kind==='unknown'?'trade':c.kind}';render();setTimeout(()=>document.getElementById('flows')?.scrollIntoView({block:'start'}),0)"><span class="chk"></span><span class="wn"><b>Edit the flow</b><small>Settings → Flows, the ${c.kind==='customer'?'customer':c.kind==='arch'?'architect':'trade partner'} journey.</small></span></div>`;
  btn.parentElement.appendChild(pk); setTimeout(()=>document.addEventListener('click', outsideWho, {once:true}),0); }
function outsideWho(e){ const pk=document.getElementById('whopick'); if(!pk) return; if(e.target.closest('.haspill')||e.target.closest('.whowrap>button')) return; if(!pk.contains(e.target)) closeWho(); else setTimeout(()=>document.addEventListener('click', outsideWho, {once:true}),0); }
function closeWho(){ document.getElementById('whopick')?.remove(); }
function claim(id,who){ const c=cById(id); const before=c.has; c.has=who||null; c.hasSince=who?NOW_WORDS:null; if(before!==c.has){ const line = !who ? `${ME} put ${c.name} back for whoever answers first.` : who===ME ? (before ? `${ME} took ${c.name} from ${before}.` : `${ME} took ${c.name}.`) : (before ? `${ME} handed ${c.name} to ${who}.` : `${ME} gave ${c.name} to ${who}.`); messages.push({id:++seq,c:id,job:null,ch:'event',dir:'team',who:ME,at:NOW+messages.length,text:line}); } toast(who?(who===ME?`You have ${c.name}.`:`${who} has ${c.name}.`):'Nobody has it.'); render(); }
function setState(id,s){ const c=cById(id); c.state=s; if(s==='done') c.has=null; toast(s==='done'?`${c.name} cleared from Follow up.`:`${c.name} is back in Follow up.`); render(); }
function remind(id){ const c=cById(id); c.state='snoozed'; toast(`${c.name} comes back to Follow up on Monday.`); render(); }
function toggleOptout(id){ const c=cById(id); c.optout=!c.optout; toast(c.optout?'Marked STOP: the app will not text this number.':'Opt-out cleared.'); render(); }
function setDefault(cid,jid){ const c=cById(cid); c.def=jid; toast(`New messages from ${c.name} go to ${jobLabel(c,jid)}.`); render(); }
function removeJob(cid,jid){ const c=cById(cid); c.jobs=c.jobs.filter(j=>j!==jid); if(c.def===jid) c.def=c.jobs[0]||null; if(jobFilter===jid) jobFilter=null; toast('Job removed from the person. Their messages tied to it keep the tie.'); render(); }
function addJob(cid){ const c=cById(cid); const left=jobs.filter(j=>!c.jobs.includes(j.id)); if(!left.length){toast('They are on every job already.');return;} modal(`Add a job to ${esc(c.name)}`, `<div class="f">Which job<select id="mj">${left.map(j=>`<option value="${j.id}">${esc(j.name)} · ${esc(j.note)}</option>`).join('')}</select></div><p class="note">The app adds most of these itself: the ask, the customer record, the architect on the project.</p>`, ()=>{ const v=document.getElementById('mj').value; c.jobs.push(v); if(!c.def) c.def=v; toast('Added.'); render(); }); }
function tie(mid,jid){ const x=messages.find(m=>m.id===mid); const c=cById(x.c); if(!c.jobs.includes(jid)) c.jobs.push(jid); x.job=jid; toast(`Tied to ${jobLabel(c,jid)}.`); render(); }
function untie(mid){ const x=messages.find(m=>m.id===mid); x.job=null; toast('Untied. The line sits on the person alone.'); render(); }
function tieMenu(mid){ const x=messages.find(m=>m.id===mid); const c=cById(x.c); const opts=c.jobs.map(jid=>`<button onclick="tie(${mid},'${jid}');closeSheet()">${esc(jobLabel(c,jid))}</button>`).join('')+ jobs.filter(j=>!c.jobs.includes(j.id)).map(j=>`<button onclick="tie(${mid},'${j.id}');closeSheet()" class="note">${esc(j.name)} (not one of theirs yet)</button>`).join(''); sheet('Tie this message to', opts); }
function promiseKinds(c,x){ const j=x.job?jobById(x.job):null; const jn=j?j.name:'a job'; const tr=c.trade||'their trade';
  if(c.kind==='customer') return [
    {k:'payment', what:`a payment on ${jn}`, where:'the Pipeline\'s payment promises', label:'A payment', tag:'Pipeline'},
    {k:'decision', what:`their answer on our bid for ${jn}`, where:'the bid\'s follow-up', label:'Their answer on our bid', tag:'Bid'},
    {k:'access', what:`a day we can be on site at ${jn}`, where:'the schedule, as a wait', label:'A day we can be on site', tag:'Schedule'} ];
  if(c.kind==='arch') return [
    {k:'answer', what:`the architect\'s answer on ${jn}`, where:'the plan question', label:'Their answer', tag:'Plan question'},
    {k:'cert', what:`the certificate for ${jn}`, where:'the pay application', label:'The certificate', tag:'Pay app'} ];
  return [
    {k:'quote', what:`${c.company}\'s ${tr} quote for ${jn}`, where:'their ask on the Board', label:'Their quote', tag:'Board'},
    {k:'start', what:`${c.company}\'s start or delivery on ${jn}`, where:'the schedule', label:'A start or delivery', tag:'Schedule'},
    {k:'papers', what:`${c.company}\'s insurance or W-9`, where:'the company\'s papers', label:'Insurance or W-9', tag:'Papers'} ]; }
function promiseOffer(c,x){ const kinds=promiseKinds(c,x); return `<div class="offer"><span><b>${esc(x.promise.day)}</b> is a promise of</span>${kinds.map((k,i)=>`<button class="small ${i===0?'primary':''}" title="Goes on ${esc(k.where)}" onclick="writeDown(${x.id},${i})">${esc(k.label)} <span class="tag">${esc(k.tag)}</span></button>`).join('')}<button class="small quiet" onclick="notPromise(${x.id})">just talk</button></div>`; }
function writeDown(mid, ki){ const x=messages.find(m=>m.id===mid); const c=cById(x.c); const k=promiseKinds(c,x)[ki||0]; x.promise.state='written'; x.promise.by=ME; x.promise.what=k.what; x.promise.where=k.where; c.promise=`promised ${x.promise.day} · ${k.k}`; toast(`Written down on ${k.where.split(',')[0]}: ${k.what} by ${x.promise.day}.`); render(); }
function notPromise(mid){ const x=messages.find(m=>m.id===mid); x.promise.state='no'; x.promise.by=ME; render(); }
function askArchitect(mid){ const x=messages.find(m=>m.id===mid); x.question.state='asked'; x.question.by=ME; const c=cById(x.c); messages.push({id:++seq,c:c.id,job:x.job,ch:'note',dir:'team',who:`${ME} · note for the team`,at:NOW,text:`Sent to the architect as a plan question: "${x.text}"`}); toast('Sent to the architect as a plan question.'); render(); }
function answerMyself(mid){ const x=messages.find(m=>m.id===mid); x.question.state='mine'; replyKind='text'; openThread(x.c); document.getElementById('box')?.focus(); }
function sendReply(cid){ const c=cById(cid); const box=document.getElementById('box'); const t=box.value.trim(); if(!t){toast('Write something first.');return;} const job = replyTie==='none'?null:(replyTie||c.def); const who = replyKind==='note'?`${ME} · note for the team`:replyKind==='email'?`${ME} · bids@`:`${ME} · from the company number`; messages.push({id:++seq,c:cid,job,ch:replyKind,dir:replyKind==='note'?'team':'out',who,at:NOW+messages.length,text:t}); c.state='done'; c.has=null; box.value=''; toast(replyKind==='note'?'Note added and the row closed. Only the team sees the note.':replyKind==='email'?'Email sent as Click Construction; its copy is kept in Documents.':'Text sent from the company number.'); render(); }
function oweDialog(cid, after){ const c=cById(cid); modal(`What do we still owe ${esc(c.name)}?`, `<div class="f">What<input id="ow" placeholder="the start date, a revised number, a call back…" value="${c.owe?esc(c.owe.what):''}"></div><div class="f">By when (optional)<input id="ob" placeholder="Mon Oct 5" value="${c.owe?esc(c.owe.by||''):''}"></div><p class="note">The ball stays in our court until someone presses Settled, even after we write to them. Follow up lists it under We owe them.</p>`, ()=>{ const w=document.getElementById('ow').value.trim(); if(!w){toast('Say what we owe, or Not now.');return false;} c.owe={what:w, by:document.getElementById('ob').value.trim()||null, since:NOW_WORDS, who:ME}; messages.push({id:++seq,c:cid,job:null,ch:'event',dir:'team',who:ME,at:NOW+messages.length,text:`${ME} marked that we owe ${c.name} ${w}${c.owe.by?' by '+c.owe.by:''}.`}); toast(`Marked: we owe ${c.name} ${w}.`); if(after) after(); render(); }); }
function settle(cid){ settling=cid; replyKind='note'; if(view!=='messages'||openContact!==cid) openThread(cid); else render(); setTimeout(()=>{ const b=document.getElementById('box'); if(b){ b.scrollIntoView({block:'center'}); b.focus(); } },0); }
function cancelSettle(){ settling=null; render(); }
function finishSettle(cid){ const c=cById(cid); const box=document.getElementById('box'); const t=box.value.trim(); if(!t){toast('Say how it was settled, or press Not settled yet.');return;} const w=c.owe.what, by=c.owe.by; c.owe=null; settling=null; messages.push({id:++seq,c:cid,job:replyTie==='none'?null:(replyTie||c.def),ch:'note',dir:'team',who:`${ME} · note for the team`,at:NOW+messages.length,text:t,settled:{what:w,by}}); c.state='done'; c.has=null; box.value=''; toast('Settled, with the note for the team. The ball moves by whose word was last.'); render(); }
function theyReply(cid){ const c=cById(cid); messages.push({id:++seq,c:cid,job:c.def,ch:'text',dir:'in',who:c.name.split(' ')[0],at:NOW+messages.length,text:'Got it, thanks. One more thing when you have a minute.'}); c.state='waiting'; toast(`${c.name} wrote back; the row is open again by itself.`); render(); }
function whoIsThis(cid){ const c=cById(cid); modal(`Who is this? ${esc(c.phones[0])}`, `<div class="f">Their name<input id="wn" placeholder="Dee …"></div><div class="f">What they are to us<select id="wk"><option value="trade">trade partner</option><option value="customer">customer</option><option value="arch">architect</option></select></div><div class="f">Their company<input id="wc" placeholder="Alamo Concrete"></div><div class="f">Tie this message to<select id="wj"><option value="">no job yet</option>${jobs.map(j=>`<option value="${j.id}">${esc(j.name)} · ${esc(j.note)}</option>`).join('')}</select></div><p class="note">The answer becomes the rule for this number: the next text from it lands on this person.</p>`, ()=>{ const n=document.getElementById('wn').value.trim(); if(!n){toast('A name, please.');return false;} c.name=n; c.kind=document.getElementById('wk').value; c.company=document.getElementById('wc').value.trim(); const j=document.getElementById('wj').value; if(j){ c.jobs=[j]; c.def=j; messages.filter(x=>x.c===c.id).forEach(x=>x.job=j); } toast(`${n} is known now.`); render(); }); }

// ---------- a message's body in the thread: four lines, or its highlights ----------
const isLong = x => (x.text.split('\n').length>4) || x.text.length>280;
function bodyHtml(c,x){ const hls=highlights[x.id]||[]; const full=showAll[c.id];
  if(hls.length && !full) return hls.map(h=>`<div class="hl">${esc(h.text)}<small>highlighted by ${esc(h.by)} · ${esc(h.at)}</small></div>`).join('')+`<div class="more">the whole ${x.ch==='email'?'email':'message'} ›</div>`;
  if(isLong(x) && !full) return `<div class="body clamp">${esc(x.text)}</div><div class="more">the whole ${x.ch==='email'?'email':'message'} ›</div>`;
  return `<div class="body">${markHtml(x)}</div>`; }
function markHtml(x){ let h=esc(x.text); for(const hl of (highlights[x.id]||[])){ const e=esc(hl.text); h=h.split(e).join(`<mark title="highlighted by ${esc(hl.by)} · ${esc(hl.at)}">${e}</mark>`); } return h; }

// ---------- the message window ----------
const longWhen = ts => new Date(ts).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})+' at '+fmt(ts).split(' · ').pop();
const viaOf = x => x.ch==='email'?(x.dir==='in'?'to bids@clickconstruction':'from bids@clickconstruction, as Click Construction'):x.ch==='note'?'a note only the team sees':(x.who.includes("Quo's phone app")?"Quo's phone app":'the company number (210) 555-0100');
function openMessage(mid){ const x=messages.find(m=>m.id===mid); const c=cById(x.c); const bg=document.createElement('div'); bg.className='modal-bg'; const m=document.createElement('div'); m.className='modal wide mw'; bg.appendChild(m);
  const paint=()=>{ const hls=highlights[mid]||[]; m.innerHTML=`<h2>${chWord(x)}${x.subject?': '+esc(x.subject):''}</h2>
    <dl class="facts"><dt>${x.dir==='in'?'From':x.dir==='team'?'By':'To'}</dt><dd>${esc(x.dir==='in'?x.who:x.dir==='team'?x.who:c.name+(c.emails[0]&&x.ch==='email'?' <'+esc(c.emails[0])+'>':c.phones[0]?' · '+esc(c.phones[0]):''))}</dd>
      <dt>${x.dir==='in'?'Received':x.dir==='team'?'Added':'Sent'}</dt><dd>${longWhen(x.at)}${x.dur?' · '+x.dur+' long':''}</dd>
      <dt>Through</dt><dd>${viaOf(x)}</dd>
      <dt>Tied to</dt><dd>${x.job?esc(jobLabel(c,x.job)):'<i>no job, sits on the person</i>'} <button class="small quiet" onclick="this.closest('.modal-bg').remove();tieMenu(${mid})">change</button></dd>
      ${x.dir==='out'&&x.ch!=='note'?'<dt>Kept</dt><dd>A copy as it went is in Documents.</dd>':''}
      ${x.transcript?'<dt>Recording</dt><dd>▶ '+esc(x.dur||'')+' · the transcript is below; Quo wrote the summary.</dd>':''}</dl>
    <div class="tools"><button class="small primary" id="hlbtn" onclick="window.__hl(${mid})" disabled>Highlight the selected words</button><button class="small" onclick="navigator.clipboard&&navigator.clipboard.writeText(${JSON.stringify(x.text).replace(/"/g,'&quot;')});toast('Copied.')">Copy</button><button class="small" onclick="document.body.classList.add('printing');window.print();setTimeout(()=>document.body.classList.remove('printing'),500)">Print or save as PDF</button><button class="small" onclick="window.__share(${mid})">Share…</button>${x.dir==='in'?`<button class="small" onclick="this.closest('.modal-bg').remove();document.getElementById('box')?.focus()">Reply</button>`:''}</div>
    <div class="full" id="fulltext">${markHtml(x)}</div>
    ${hls.length?`<h3>Highlights (${hls.length})</h3><div class="hls">${hls.map((h,i)=>`<div><span>${esc(h.text)}</span><small>${esc(h.by)} · ${esc(h.at)}</small><button class="small quiet" onclick="window.__unhl(${mid},${i})">×</button></div>`).join('')}</div>`:''}
    ${x.attachments?`<h3>Attachments (${x.attachments.length})</h3><div class="attl">${x.attachments.map((a,i)=>`<div><span class="ic ${a.kind}" style="width:22px;height:22px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;background:${a.kind==='pdf'?'#c0392b':a.kind==='image'?'#2a8f5a':'#1f5fbf'}">${a.kind==='pdf'?'PDF':a.kind==='link'?'↗':'IMG'}</span><span class="nm">${esc(a.name)} <span class="note">· ${esc(a.size)}${a.kind==='link'?' · a link, not a file':' · our copy kept on arrival'}</span></span><button class="small" onclick="toast('Opens the file.')">Open</button><button class="small" onclick="toast('The file agent copies it to ${esc(x.job?jobById(x.job).name:'the job')} › ${a.quote||a.kind==='image'?'Team only':'Plans'} in Drive.')">Save to Drive</button>${a.quote?`<button class="small primary" onclick="toast('Opens Enter their quote with this PDF beside it.')">Enter it as their quote</button>`:''}</div>`).join('')}</div>`:''}
    <div class="btns"><button onclick="this.closest('.modal-bg').remove();render()">Close</button></div>`;
    const full=m.querySelector('#fulltext'); const upd=()=>{ const s=document.getSelection(); const txt=s&&s.toString().trim(); const inside=s&&s.rangeCount&&full.contains(s.getRangeAt(0).commonAncestorContainer); selectedInWindow=(inside&&txt)?txt:''; m.querySelector('#hlbtn').disabled=!selectedInWindow; }; document.addEventListener('selectionchange',upd); bg.addEventListener('remove',()=>document.removeEventListener('selectionchange',upd)); };
  window.__hl=id=>{ if(!selectedInWindow) return; (highlights[id]=highlights[id]||[]).push({text:selectedInWindow, by:ME, at:NOW_WORDS}); selectedInWindow=''; document.getSelection()?.removeAllRanges(); toast('Highlighted. The thread shows it instead of the first lines.'); paint(); };
  window.__unhl=(id,i)=>{ highlights[id].splice(i,1); paint(); };
  window.__share=id=>{ const x=messages.find(m=>m.id===id); const data={title:(x.subject||chWord(x))+' · '+c.name, text:x.text}; if(navigator.share){ navigator.share(data).catch(()=>{}); } else toast("Opens the Mac's share sheet (Mail, Messages, AirDrop, Notes).") };
  paint(); document.body.appendChild(bg); bg.onclick=e=>{ if(e.target===bg){ bg.remove(); render(); } }; }
function openAttachment(mid,i){ openMessage(mid); setTimeout(()=>document.querySelector('.mw .attl')?.scrollIntoView({block:'nearest'}),0); }

// ---------- their flow: the right panel, drawn from FLOWS and FLOW_STATE ----------
function stepState(c, id){ const st=FLOW_STATE[c.id]||{done:[],now:null,rounds:{}}; if(st.done.includes(id)) return 'done'; if(st.now===id) return 'now'; return ''; }
function whoNow(c, step){ if(c.owe) return 'us'; const k=courtOf(c); if(k.side==='ours') return 'us'; if(k.side==='theirs') return 'them'; return step.who; }
function flowRailHtml(c){ const flow=FLOWS[c.kind]||[]; const st=FLOW_STATE[c.id]||{done:[],now:null,rounds:{}}; const all=flow.flatMap(l=>l.steps); const nDone=all.filter(s=>stepState(c,s.id)==='done').length;
  const mark=(step,i,steps)=>{ const s=stepState(c,step.id); const w=s==='now'?whoNow(c,step):''; const rounds=(st.rounds[step.id]||[]);
    const tip=`${esc(step.name)}${step.loop?' · '+esc(step.loop):''}${step.dec?' · a fork':''}|${s==='done'?'Done: '+esc(step.done):s==='now'?(w==='us'?'On now, our move.':w==='them'?'On now, their move.':'On now, both sides.')+(rounds.length?' '+rounds.length+' so far.':''):'Not yet. Finishes when '+esc(step.done)+'.'}|${s==='now'?'The nudge if it stalls: '+esc(step.nudge)+'. ':''}Click to open the flow at this step.`;
    return `<span class="stepw"><span class="st ${s} ${w} ${step.dec?'dec':''}" data-tip="${tip}" onclick="setFlow(true,'${step.id}')">${s==='done'?'✓':step.loop?'↻':''}</span>${s==='now'?`<span class="tag ${w}">${w}</span>`:''}</span>${i<steps.length-1?`<span class="ln ${s==='done'?'done':''}"></span>`:''}`; };
  return `<button class="open" data-tip="Their flow|Opens the panel with their journey with us: what is done, what is on now, whose move it is, what comes next.|Your choice is kept on this computer. The journey is drawn from Settings → Flows." onclick="setFlow(true)">‹</button>${flow.map(l=>`<span class="lane">${esc(l.lane)}</span>${l.steps.map((s,i)=>mark(s,i,l.steps)).join('')}`).join('')}<span class="cnt" data-tip="How far along|${nDone} of ${all.length} steps done.|Loops count once, however many rounds they have had.">${nDone} / ${all.length}</span>`; }
function flowPanelHtml(c){ const flow=FLOWS[c.kind]||[]; const st=FLOW_STATE[c.id]||{done:[],now:null,rounds:{}};
  const box=(step)=>{ const s=stepState(c,step.id); const tag = s==='now' ? `<span class="who ${whoNow(c,step)}">${whoNow(c,step)}</span>` : '';
    if(step.loop){ const rounds=(st.rounds[step.id]||[]); return `<div class="loop"><span class="lt">${esc(step.loop)}${rounds.length?` · ${rounds.length} so far`:''}</span><span class="box ${s}" id="fstep-${step.id}"><span>${esc(step.name)}</span>${tag}</span>${rounds.length?`<span class="rounds">${rounds.map(r=>`<span class="${r.s==='done'?'done':r.s==='now'?'now':''}">${esc(r.n)}</span>`).join('')}</span>`:`<span class="rounds"><span>none yet</span></span>`}</div>`; }
    return `<span class="box ${s} ${step.dec?'dec':''}" id="fstep-${step.id}"><span>${esc(step.name)}${step.dec?' <span class="note">· a fork</span>':''}</span>${tag}</span>`; };
  const lanes=flow.map(l=>`<div class="lane"><div class="t">${esc(l.lane)}${l.lane==='Per job'&&c.def?' · '+esc(jobById(c.def).name):''}</div><div class="boxes">${l.steps.map((s,i)=>(i?'<div class="arr">↓</div>':'')+box(s)).join('')}</div></div>`).join('');
  const nowStep=flow.flatMap(l=>l.steps).find(s=>s.id===st.now); const k=courtOf(c);
  const next = nowStep ? `<b>On now:</b> ${esc(nowStep.name)} · ${k.side==='ours'?'our court':k.side==='theirs'?'their court':'no court'}${c.owe?' · we owe '+esc(c.owe.what)+(c.owe.by?' by '+esc(c.owe.by):''):c.promise?' · '+esc(c.promise):''}.<br><b>Finished when:</b> ${esc(nowStep.done)}.<br><b>Nudge:</b> ${esc(nowStep.nudge)}.` : 'Nothing on now.';
  return `<div class="ph2"><b>${c.kind==='customer'?'Her flow · customer':c.kind==='trade'?'Their flow · trade partner':c.kind==='arch'?'Their flow · architect':'Their flow'}</b><button class="quiet small" data-tip="Fold|Shrinks the flow to its rail of marks at the right.|Your choice is kept on this computer." onclick="setFlow(false)">fold ›</button></div><div class="flow">${lanes}</div><div class="fnext">${next}</div><div class="note" style="margin-top:8px">Drawn from Settings → Flows. <button class="quiet small" style="padding:0" onclick="view='settings';flowTab='${c.kind==='unknown'?'trade':c.kind}';render();setTimeout(()=>document.getElementById('flows')?.scrollIntoView({block:'start'}),0)">Edit the flow</button></div>`; }
function flowsEditorHtml(){ const kinds=[['customer','Customer'],['trade','Trade partner'],['arch','Architect']]; const flow=FLOWS[flowTab];
  const rows=flow.map(l=>`<tr class="lanehead"><td colspan="5">${esc(l.lane)}</td></tr>`+l.steps.map(s=>`<tr><td><input value="${esc(s.name)}" onchange="renameStep('${flowTab}','${s.id}',this.value)"></td><td class="g">${esc(s.done)}</td><td class="g">${esc(s.who)}</td><td class="g">${esc(s.nudge)}</td><td class="g">${s.loop?'yes · '+esc(s.loop):'no'}</td></tr>`).join('')).join('');
  return `<h2 id="flows" style="margin-top:18px">Flows</h2><p class="note">One flow per kind of person. A step is finished by a fact the app already keeps, never by a typed word; whose move it is and when to nudge follow from it; a step that repeats is a loop in the panel. Renaming a step here renames it in every panel (the other columns are read-only in this prototype).</p>
  <div class="card feditor"><div class="tabs">${kinds.map(([k,l])=>`<button class="${flowTab===k?'on':''}" onclick="flowTab='${k}';render();setTimeout(()=>document.getElementById('flows')?.scrollIntoView({block:'start'}),0)">${l}</button>`).join('')}</div>
  <table><tr><th>Step</th><th>Finished when</th><th>Whose move</th><th>Nudge after</th><th>Repeats</th></tr>${rows}</table>
  <p class="note" style="margin:10px 0 0">The same list could drive Follow up's nudges and the ring on the Board, so one edit moves all three.</p></div>`; }
function renameStep(kind,id,v){ const s=FLOWS[kind].flatMap(l=>l.steps).find(x=>x.id===id); if(s&&v.trim()){ s.name=v.trim(); toast('Renamed in every panel.'); } }

// ---------- quick replies: use, edit, add ----------
function useQuick(id){ const q=quickReplies.find(x=>x.id===id); const box=document.getElementById('box'); box.value=q.text; countBox(box); box.focus(); }
function quickMeta(q){ return `added by ${esc(q.addedBy)} · ${esc(q.addedAt)}${q.editedBy?` · edited by ${esc(q.editedBy)} · ${esc(q.editedAt)}`:''}`; }
function editQuick(){ const bg=document.createElement('div'); bg.className='modal-bg'; const m=document.createElement('div'); m.className='modal wide'; bg.appendChild(m);
  let editing=null;
  const row=q=>`<div class="qrow" id="qr${q.id}">${editing===q.id?`<input id="qe${q.id}" value="${esc(q.text)}" style="width:100%"><div class="qmeta"><button class="small primary" onclick="window.__qSave(${q.id})">Save</button><button class="small" onclick="window.__qEdit(null)">Cancel</button></div>`:`<div class="qtext">${esc(q.text)}</div><div class="qmeta"><span>${quickMeta(q)}</span><button class="small" onclick="window.__qEdit(${q.id})">Edit</button></div>`}</div>`;
  const paint=()=>{ const team=quickReplies.filter(q=>q.scope==='team'); const mine=quickReplies.filter(q=>q.scope==='mine'&&q.addedBy===ME);
    m.innerHTML=`<h2>Quick replies</h2><p class="note">Anyone can add one and anyone can edit one. Each keeps who added it and when, and who last edited it and when.</p>
    <h3>The team's (${team.length})</h3><div class="qlist">${team.map(row).join('')||'<div class="empty">none yet</div>'}</div>
    <h3>Mine (${mine.length})</h3><div class="qlist">${mine.map(row).join('')||'<div class="empty">none yet</div>'}</div>
    <h3>Add one</h3><div class="qadd"><input id="qnew" placeholder="The line you type every day…" style="width:100%"><div class="qmeta"><label><input type="radio" name="qscope" value="team" checked> for the team</label><label><input type="radio" name="qscope" value="mine"> just me</label><button class="small primary" style="margin-left:auto" onclick="window.__qAdd()">Add</button></div></div>
    <div class="btns"><button onclick="this.closest('.modal-bg').remove();render()">Done</button></div>`;
    const f=m.querySelector(editing?`#qe${editing}`:'#qnew'); if(f&&editing) f.focus(); };
  window.__qEdit=id=>{ editing=id; paint(); };
  window.__qSave=id=>{ const q=quickReplies.find(x=>x.id===id); const v=m.querySelector(`#qe${id}`).value.trim(); if(!v){toast('Write something, or Cancel.');return;} if(v!==q.text){ q.text=v; q.editedBy=ME; q.editedAt='Oct 2'; toast('Saved, with your name and today on it.'); } editing=null; paint(); };
  window.__qAdd=()=>{ const v=m.querySelector('#qnew').value.trim(); if(!v){toast('Write the line first.');return;} const scope=m.querySelector('input[name=qscope]:checked').value; quickReplies.push({id:++qseq, scope, text:v, addedBy:ME, addedAt:'Oct 2'}); toast(scope==='team'?'Added for the team, with your name and today on it.':'Added to yours, with your name and today on it.'); paint(); };
  paint(); document.body.appendChild(bg); bg.onclick=e=>{ if(e.target===bg){ bg.remove(); render(); } }; }

// ---------- tie picker and the job card ----------
const kindPill = j => `<span class="kindpill ${j.kind}">${j.kind==='bid'?'bid':j.kind==='project'?'GC project':'Pipeline job'}</span>`;
function tieLabel(c){ if(replyTie==='none') return 'no job'; const jid=replyTie||c.def; if(!jid) return 'the person alone'; const j=jobById(jid); return `${esc(jobLabel(c,jid))}${kindPill(j)}${jid===c.def&&!replyTie?' <span class="note">· default</span>':''}`; }
function tiePicker(cid, btn){ document.removeEventListener('click', outsidePicker); if(document.getElementById('picker')){ closePicker(); return; } const c=cById(cid); const cur=replyTie==='none'?null:(replyTie||c.def);
  const rows = c.jobs.map(jid=>{ const j=jobById(jid); const n=messages.filter(m=>m.c===c.id&&m.job===jid).length; return `<div class="prow ${cur===jid&&replyTie!=='none'?'on':''}" onclick="replyTie='${jid}';closePicker();render()"><span class="chk">${cur===jid&&replyTie!=='none'?'✓':''}</span><span class="pname"><b>${esc(j.name)}${kindPill(j)}${jid===c.def?' <span class="note">· default</span>':''}</b><small>${esc(j.note)}${c.trade&&j.kind==='bid'?' · '+esc(c.trade):''} · ${n} message${n===1?'':'s'} tied</small></span><button class="small open" onclick="event.stopPropagation();jobModal('${jid}')">Open</button></div>`; }).join('');
  const none=`<div class="prow ${replyTie==='none'?'on':''}" onclick="replyTie='none';closePicker();render()"><span class="chk">${replyTie==='none'?'✓':''}</span><span class="pname"><b>No job</b><small>The message sits on ${esc(c.name)} alone.</small></span></div>`;
  const add=`<div class="prow" onclick="closePicker();addJob('${cid}')"><span class="chk"></span><span class="pname"><b>+ Add a job to ${esc(c.name)}</b><small>A bid, a GC project or a Pipeline job they are part of.</small></span></div>`;
  const pk=document.createElement('div'); pk.className='picker'; pk.id='picker'; pk.innerHTML=`<div class="ph">Where this message lands. New messages from them go to the ★ default.</div>${rows}${none}${add}`;
  btn.parentElement.appendChild(pk); setTimeout(()=>document.addEventListener('click', outsidePicker, {once:true}),0); }
function outsidePicker(e){ const pk=document.getElementById('picker'); if(!pk) return; if(e.target.closest('.tiebtn')) return; if(!pk.contains(e.target)) closePicker(); else setTimeout(()=>document.addEventListener('click', outsidePicker, {once:true}),0); }
function closePicker(){ document.getElementById('picker')?.remove(); }
function jobModal(jid){ const j=jobById(jid); const people=contacts.filter(c=>c.jobs.includes(jid)); const tied=messages.filter(m=>m.job===jid).sort((a,b)=>b.at-a.at).slice(0,5);
  const facts = j.kind==='bid' ? [['What','A bid we are putting together as the GC'],['Bid day',j.note.replace('bid ','')],['Customer', people.filter(p=>p.kind==='customer').map(p=>p.name).join(', ')||'—'],['Trades asked', people.filter(p=>p.kind==='trade').map(p=>`${p.company} (${p.trade})`).join(', ')||'—'],['Architect', people.filter(p=>p.kind==='arch').map(p=>p.company).join(', ')||'—']]
    : j.kind==='project' ? [['What','A GC project we won'],['Stage',j.note],['Customer', people.filter(p=>p.kind==='customer').map(p=>p.name).join(', ')||'—'],['Trade partners', people.filter(p=>p.kind==='trade').map(p=>`${p.company} (${p.trade})`).join(', ')||'—']]
    : [['What','A Pipeline job, our own crew'],['Job',j.note],['Customer', people.filter(p=>p.kind==='customer').map(p=>p.name).join(', ')||'—']];
  const bg=document.createElement('div'); bg.className='modal-bg'; bg.innerHTML=`<div class="modal wide jobcard"><h2>${esc(j.name)} ${kindPill(j)}</h2>
    <dl class="facts">${facts.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
    <h3>People on it</h3><div class="people">${people.length?people.map(p=>`<span>${esc(p.name)} · ${esc(p.company||kindWord(p))}</span>`).join(''):'<span class="note">nobody yet</span>'}</div>
    <h3>Last conversations tied to it</h3><div class="conv">${tied.length?tied.map(m=>{const c=cById(m.c);return `<div><b>${esc(c.name)}</b> · ${chWord(m)} · ${fmt(m.at)}<br>${esc(m.text).slice(0,140)}${m.text.length>140?'…':''}</div>`;}).join(''):'<div class="note">none yet</div>'}</div>
    <div class="btns"><button onclick="this.closest('.modal-bg').remove()">Close</button><button onclick="this.closest('.modal-bg').remove();openJob='${jid}';view='job';render()">Its conversations</button><button class="primary" onclick="toast('Opens ${esc(j.kind==='bid'?'the bid':j.kind==='project'?'the project on the Board':'the Pipeline job')} in the app.')">Open ${j.kind==='bid'?'the bid':j.kind==='project'?'the project':'the job'}</button></div></div>`;
  document.body.appendChild(bg); bg.onclick=e=>{ if(e.target===bg) bg.remove(); }; }

// ---------- preview before it goes ----------
const COMPANY = {name:'Click Construction', phone:'(210) 555-0100', email:'bids@clickconstruction.example', site:'clickconstruction.example', addr:'San Antonio, Texas'};
const firstTextEver = c => !messages.some(m=>m.c===c.id&&m.ch==='text'&&m.dir==='out');
function subjectFor(c, job, body){ const j=job?jobById(job):null; const first=body.split('\n')[0].replace(/[.!?]+$/,'').slice(0,60); return (j?`${j.name}: `:'')+(first||'A note from Click Construction'); }
function countBox(el){ const n=document.getElementById('pvcount'); if(!n) return; const L=el.value.length; n.textContent = L? `${L} characters · ${Math.max(1,Math.ceil(L/160))} text${L>160?'s':''}` : ''; }
function previewDraft(cid, kind){ const c=cById(cid); const box=document.getElementById('box'); const body=(box.value||'').trim(); if(!body){ toast('Write the message first.'); return; } const job=replyTie==='none'?null:(replyTie||c.def); let cur=kind;
  const draw=()=>{ const tabs=`<div class="pv-tabs"><button class="${cur==='email'?'on':''}" onclick="window.__pvSet('email')">Email</button><button class="${cur==='text'?'on':''}" onclick="window.__pvSet('text')">Text</button></div>`;
    let html;
    if(cur==='email'){ const subj=subjectFor(c,job,body); const to=c.emails[0]||'(no email on file)';
      html=`${tabs}<p class="note">What ${esc(c.name)} sees in their inbox, then opened.</p>
      <div class="mail"><div class="inboxrow"><span class="from">${COMPANY.name}</span><span class="subj">${esc(subj)}</span><span class="when">10:32 AM</span></div>
      <div class="head"><b>From:</b> ${COMPANY.name} &lt;${COMPANY.email}&gt;<br><b>To:</b> ${esc(c.name)} &lt;${esc(to)}&gt;<br><b>Subject:</b> ${esc(subj)}</div>
      <div class="lh">CLICK CONSTRUCTION<small>${COMPANY.phone} · ${COMPANY.site}</small></div>
      <div class="body">${esc(c.kind==='customer'||c.kind==='arch'?('Hello '+c.name.split(' ').filter(w=>!/^dr\.?$/i.test(w))[0]+','):'Hello '+c.name.split(' ')[0]+',')}\n\n${esc(body)}</div>
      <div class="sig">${ME}\n${COMPANY.name} · ${COMPANY.phone}\nReply to this email or text ${COMPANY.phone}.</div>
      <div class="foot">${COMPANY.name}, ${COMPANY.addr}. ${job?'About '+esc(jobById(job).name)+'. ':''}A copy of this email is kept in Documents.</div></div>
      ${!c.emails.length?'<div class="pv-warn">They have no email on file. The email cannot go until one is added.</div>':''}
      <div class="pv-note">The subject comes from the job and your first line; the greeting from their contact name; the letterhead from who the job is for (Click Construction on a GC job). Nothing here is typed twice.</div>`;
    } else { const prior=[...messages].filter(m=>m.c===c.id&&m.ch==='text').sort((a,b)=>a.at-b.at).slice(-2); const segs=Math.max(1,Math.ceil(body.length/160)); const first=firstTextEver(c); const footer=first?`\n\n${COMPANY.name}. Reply STOP to opt out.`:''; const full=body+footer; const fsegs=Math.max(1,Math.ceil(full.length/160));
      html=`${tabs}<p class="note">What ${esc(c.name)} sees on their phone, under the texts already there.</p>
      <div class="phone"><div class="bar"><b>${COMPANY.name}</b>${COMPANY.phone}</div><div class="screen">
        ${prior.map(m=>`<div class="bub ${m.dir==='in'?'them':'us'}">${esc(m.text)}</div>`).join('')}
        <div class="stamp">Today 10:32 AM</div>
        <div class="bub us new">${esc(full)}</div><div class="dl">Delivered</div></div></div>
      ${c.optout?'<div class="pv-warn">They sent STOP. The app will not send this text.</div>':''}
      ${!c.phones.length?'<div class="pv-warn">They have no mobile number on file.</div>':''}
      ${fsegs>2?`<div class="pv-warn">${full.length} characters is ${fsegs} texts. Long texts arrive in pieces on some phones; an email may read better.</div>`:''}
      <div class="pv-note">${full.length} characters · ${fsegs} text${fsegs>1?'s':''}${first?' · their first text from us carries the company name and the opt-out line the carriers require':''}. Sent from the company number, so their reply lands back in this thread whoever answers.</div>`; }
    return html; };
  const bg=document.createElement('div'); bg.className='modal-bg'; const m=document.createElement('div'); m.className='modal wide'; bg.appendChild(m);
  const paint=()=>{ m.innerHTML=`<h2>Before it goes, this is what they see</h2>${draw()}<div class="owe-ask ${c.owe?'has':''}">${c.owe?`<div class="owe-toggle on"><span class="box">✓</span><span>We still owe them ${esc(c.owe.what)}${c.owe.by?' by '+esc(c.owe.by):''}. The ball stays in our court after this goes.</span></div>`:`<label class="owe-toggle" for="oweck"><input type="checkbox" id="oweck"><span class="box"></span><span class="words"><b>Something is still on us after this goes</b><small>Tick it and the ball stays in our court; Follow up lists it under We owe them.</small></span></label><div class="owe-fields"><input id="owew" placeholder="what we still owe them, in a few words" autocomplete="off"><input id="oweb" placeholder="by when" autocomplete="off" style="width:120px"></div>`}</div><div class="btns"><button onclick="this.closest('.modal-bg').remove()">Change it</button><button onclick="toast('A test copy went to your own address.')">Send a test to me</button><button class="primary" ${cur==='text'&&(c.optout||!c.phones.length)?'disabled':''} ${cur==='email'&&!c.emails.length?'disabled':''} onclick="window.__oweFromSend('${c.id}');replyKind='${cur}';this.closest('.modal-bg').remove();render();document.getElementById('box').value=window.__pvBody;sendReply('${c.id}')">Send as ${cur}</button></div>`; };
  window.__pvBody=body; window.__pvSet=k=>{cur=k;paint();}; m.addEventListener('change',e=>{ if(e.target.id==='oweck'&&e.target.checked) setTimeout(()=>document.getElementById('owew')?.focus(),60); }); window.__oweFromSend=cid=>{ const ck=document.getElementById('oweck'); if(ck&&ck.checked&&!ck.disabled){ const w=(document.getElementById('owew')?.value||'').trim(); if(w){ const cc=cById(cid); cc.owe={what:w, by:(document.getElementById('oweb')?.value||'').trim()||null, since:NOW_WORDS, who:ME}; messages.push({id:++seq,c:cid,job:null,ch:'event',dir:'team',who:ME,at:NOW+messages.length,text:`${ME} marked that we owe ${cc.name} ${w}${cc.owe.by?' by '+cc.owe.by:''}.`}); } } }; paint(); document.body.appendChild(bg); bg.onclick=e=>{ if(e.target===bg) bg.remove(); }; }

// ---------- modal / sheet ----------
function modal(title, body, onOk){ const bg=document.createElement('div'); bg.className='modal-bg'; bg.innerHTML=`<div class="modal"><h2>${title}</h2>${body}<div class="btns"><button id="mcancel">Not now</button><button class="primary" id="mok">Save</button></div></div>`; document.body.appendChild(bg); bg.querySelector('#mcancel').onclick=()=>bg.remove(); bg.querySelector('#mok').onclick=()=>{ if(onOk()!==false) bg.remove(); }; bg.onclick=e=>{ if(e.target===bg) bg.remove(); }; const f=bg.querySelector('input'); if(f) f.focus(); }
function sheet(title, optsHtml){ closeSheet(); const s=document.createElement('div'); s.className='sheet'; s.id='sheet'; s.innerHTML=`<h2>${title}</h2><div class="opts">${optsHtml}<button class="quiet" onclick="closeSheet()">Cancel</button></div>`; document.body.appendChild(s); }
function closeSheet(){ document.getElementById('sheet')?.remove(); }

// ---------- hover cards: what a control does, and what it changes ----------
(function(){ const tip=document.createElement('div'); tip.className='tip'; document.body.appendChild(tip); let timer=null, cur=null;
  const show=el=>{ const [head,what,changes]=el.dataset.tip.split('|'); tip.innerHTML=`<b>${esc(head)}</b><p class="what">${esc(what||'')}</p>${changes?`<p class="changes">${esc(changes)}</p>`:''}`; const r=el.getBoundingClientRect(); tip.style.left='0px'; tip.style.top='0px'; tip.classList.add('show'); const w=tip.offsetWidth, h=tip.offsetHeight; let x=r.left+r.width/2-w/2, y=r.bottom+8; if(x<8) x=8; if(x+w>window.innerWidth-8) x=window.innerWidth-8-w; if(y+h>window.innerHeight-8) y=r.top-8-h; tip.style.left=x+'px'; tip.style.top=y+'px'; };
  const hide=()=>{ clearTimeout(timer); tip.classList.remove('show'); cur=null; };
  document.addEventListener('mouseover',e=>{ const el=e.target.closest('[data-tip]'); if(!el||el===cur) return; hide(); cur=el; timer=setTimeout(()=>show(el),300); });
  document.addEventListener('mouseout',e=>{ const el=e.target.closest('[data-tip]'); if(el&&el===cur&&!el.contains(e.relatedTarget)) hide(); });
  document.addEventListener('focusin',e=>{ const el=e.target.closest('[data-tip]'); if(el){ cur=el; show(el); } });
  document.addEventListener('focusout',hide); document.addEventListener('click',()=>setTimeout(hide,0),true); window.addEventListener('scroll',hide,true); })();

window.addEventListener('resize',()=>render());
render();
</script>
