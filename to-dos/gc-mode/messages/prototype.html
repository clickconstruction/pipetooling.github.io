/* The conversation sits in a tinted well between the header and the reply box (v1.68, thread-regions-mockups A): a shade

.thread .msg.in{background:var(--surface)}

function setCollapsed(v){ listCollapsed=v; try{ localStorage.setItem('msgListCollapsed', v?'1':'0'); }catch(e){} render(); }
const narrow = () => window.matchMedia('(max-width: 860px)').matches;

// ---------- helpers ----------
const fmt = ts => { const d=new Date(ts); const today=new Date(2026,9,2); const same=d.toDateString()===today.toDateString(); const h=d.getHours(), m=String(d.getMinutes()).padStart(2,'0'); const hh=((h+11)%12)+1, ap=h<12?'AM':'PM'; return same? `${hh}:${m} ${ap}` : d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})+` · ${hh}:${m} ${ap}`; };
const isToday = ts => new Date(ts).toDateString()===new Date(2026,9,2).toDateString();
const fmtDay = ts => isToday(ts) ? `today · ${fmt(ts)}` : fmt(ts);
// A stamp on the header's block also says how many days ago, as a small mark, (+6) (the owner, 2026-10-11); today needs no more.
const agoDays = ts => { const n=dayDiff(NOW,ts); return n<=0 ? '' : ` <span class="ago">(+${n})</span>`; };
const agoWordsOf = ts => { const n=dayDiff(NOW,ts); return n<=0 ? '' : n===1 ? ' · yesterday' : ` · ${n} days ago`; };
// The stamp's compact form (the owner's pick 4, 2026-10-11): today keeps its time, an older one is its date with the +N mark.
const stampShort = ts => isToday(ts) ? `today · ${fmt(ts)}` : new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric'});
const stampFull = m => `${chWord(m).toLowerCase()} · ${fmtDay(m.at)}${agoWordsOf(m.at)}`;
const dayOf = ts => { const d=new Date(ts); const today=new Date(2026,9,2); return d.toDateString()===today.toDateString()?'Today, Fri Oct 2':d.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'}); };
const lastOut = c => [...messages].filter(m=>m.c===c.id&&m.dir==='out').sort((a,b)=>b.at-a.at)[0];
const agoWords = ts => { const mins=Math.max(1,Math.round((NOW-ts)/60000)); if(mins<60) return `${mins} min`; if(mins<60*24) return `${Math.round(mins/60)} h`; return `${Math.round(mins/1440)} d`; };
const lastInOnly = c => [...messages].filter(m=>m.c===c.id&&m.dir==='in').sort((a,b)=>b.at-a.at)[0];
const courtOf = c => { const i=lastInOnly(c), o=lastOut(c); if(c.optout) return {side:'none', word:'opted out'}; if(c.owe) return {side:'ours', word:`Our move · we owe ${c.owe.what}${c.owe.by?' · by '+c.owe.by:''}`, owe:true}; if(!i&&!o) return {side:'none', word:'no messages yet'}; if(!o || (i && i.at>o.at)) return {side:'ours', word:`Our move · ${agoWords(i.at)}`, since:i.at}; return {side:'theirs', word:c.promise?`Their move · ${c.promise.replace('promised ','until ')}`:`Their move · ${agoWords(o.at)}`, since:o.at}; };
const courtStrip = c => { const k=courtOf(c), i=lastInOnly(c), o=lastOut(c); if(k.owe) return `<span class="whowrap"><button type="button" class="court ours owed" data-tip="What we owe|We owe ${esc(firstName(c))} ${esc(c.owe.what)}${c.owe.by?' by '+esc(c.owe.by):''}. It stays our move until it is done.|Press to go to the reply box, where the ways to deal with it are." onclick="owedAt('${c.id}')"><i></i>${esc(k.word)} ▾</button></span><span class="stamps" data-tip="Them and Us||" data-tip-legend="stamps"><b>Them</b><span>${i?`${chWord(i).toLowerCase()} · ${stampShort(i.at)}${agoDays(i.at)}`:'nothing yet'}</span><b>Us</b><span>${o?`${chWord(o).toLowerCase()} · ${stampShort(o.at)}${agoDays(o.at)}`:'nothing yet'}</span></span>${stampSentence(c,i,o)}`;
  return `<span class="court ${k.side}" data-tip="${k.side==='ours'?'Our move|The last word was theirs, so the next move is ours.|It counts from their last message. A reply, an email or a call from us makes it their move, unless we mark that we still owe them something.':k.side==='theirs'?'Their move|The last word was ours, so we are waiting on them.|It counts from our last message, or runs until the day they promised. Their next message makes it our move again.':'No move|Nothing is waiting either way.|'}"><i></i>${esc(k.word)}</span><button class="quiet small" data-tip="We owe them…|Mark something we still have to do for them, with a day.|Opens the strip above the reply box, with the blanks to fill. It stays our move after we write, and Follow up lists it under We owe them." onclick="owedAt('${c.id}')">We owe them…</button><span class="stamps" data-tip="Them and Us||" data-tip-legend="stamps"><b>Them</b><span>${i?`${chWord(i).toLowerCase()} · ${stampShort(i.at)}${agoDays(i.at)}`:'nothing yet'}</span><b>Us</b><span>${o?`${chWord(o).toLowerCase()} · ${stampShort(o.at)}${agoDays(o.at)}`:'nothing yet'}</span></span>${stampSentence(c,i,o)}`; };
// The folded header's form (stamps-narrow-mockups.html C, the owner's pick 2026-10-11): two pills, the newer one filled in its
// side's color (green them, blue us, the calendar's pair), the older one plain with its +N. Who wrote last reads before the words.
// The folded header's stamps as one sentence (stamps-words-mockups.html B, the owner's pick 2026-10-11): the newer side
// first, the channel as the verb, the when in words, no color. The person is named, never a guessed pronoun; a number
// nobody has named reads "they". Hover the sentence for the card with the exact stamps and the calendar.
function whenWords(ts){ const n=dayDiff(NOW,ts); if(n<=0) return `today at ${fmt(ts)}`; if(n===1) return 'yesterday';
  if(n<=6){ const d=new Date(ts); const wd=d.toLocaleDateString('en-US',{weekday:'long'}); const today=new Date(NOW); const thisSun=new Date(today); thisSun.setHours(0,0,0,0); thisSun.setDate(thisSun.getDate()-thisSun.getDay()); return d>=thisSun?`on ${wd}`:`last ${wd}`; }
  const thisSun=new Date(NOW); thisSun.setHours(0,0,0,0); thisSun.setDate(thisSun.getDate()-thisSun.getDay()); const weeksBack=Math.floor((thisSun-new Date(ts).setHours(0,0,0,0))/(7*86400000))+1;
  if(weeksBack===1) return 'last week'; if(weeksBack===2) return 'two weeks ago'; if(weeksBack===3) return 'three weeks ago';
  return 'on '+new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
const verbOf = m => ({text:'texted',email:'emailed',call:'called',voicemail:'left a voicemail',missed:'called'})[m.ch]||'wrote';
const verbTail = m => m.ch==='missed' ? ', no voicemail' : '';
function stampSentence(c,i,o){ const who = c.kind==='unknown' ? 'They' : esc(firstName(c));
  const them = i ? `${who} ${verbOf(i)} <b>${whenWords(i.at)}</b>${verbTail(i)}` : `${who} ${c.kind==='unknown'?'have':'has'} not written yet`;
  const us = o ? `we ${verbOf(o)} <b>${whenWords(o.at)}</b>${verbTail(o)}` : 'we have not written yet';
  const themFirst = !o || (i && i.at>o.at); const [a,b] = themFirst ? [them, us] : [us.replace(/^we/,'We'), them.replace(/^They /,'they ')];
  return `<span class="stampsn" data-tip="Them and Us||" data-tip-legend="stamps">${a}; ${b}.</span>`; }
const courtShort = c => { const k=courtOf(c); if(k.owe) return {side:k.side, word:'Our move · we owe', title:k.word}; return {side:k.side, word:k.word, title:k.word}; };
const snippetOf = m => m.ch==='email' ? (m.subject||m.text.split('\n')[0]) : m.ch==='missed' ? 'no voicemail' : m.text;
const waitingSince = c => { const last=[...messages].filter(m=>m.c===c.id&&m.dir==='in').sort((a,b)=>b.at-a.at)[0]; if(!last) return ''; const mins=Math.max(1,Math.round((NOW-last.at)/60000)); if(mins<60) return `waiting ${mins} min`; if(mins<60*24) return `waiting ${Math.round(mins/60)} h`; return `waiting ${Math.round(mins/1440)} d`; };
const kindWord = c => ({customer:'customer',trade:'trade partner',arch:'architect',unknown:'who is this?'})[c.kind];
const kindClass = c => ({customer:'cust',trade:'trade',arch:'arch',unknown:'unknown'})[c.kind];
const initials = c => c.kind==='unknown'?'?':c.name.split(' ').filter(w=>!/^dr\.?$/i.test(w)).map(w=>w[0]).slice(0,2).join('');
const lastMsg = c => [...messages].filter(m=>m.c===c.id&&m.ch!=='event').sort((a,b)=>b.at-a.at)[0];
const lastIn = c => [...messages].filter(m=>m.c===c.id&&m.dir==='in').sort((a,b)=>b.at-a.at)[0] || lastMsg(c);
const chWord = m => ({call:'Call',voicemail:'Voicemail',text:'Text',email:'Email',note:'Note for the team',missed:'Missed call',event:'Event'})[m.ch];
const jobLabel = (c,jid) => { const j=jobById(jid); if(!j) return ''; return j.name + (c&&c.trade&&j.kind==='bid'?` · ${c.trade}`:''); };
const esc = s => String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
let toastT; function toast(s){ const t=document.getElementById('toast'); t.textContent=s; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }
const waitingCount = () => contacts.filter(c=>c.state==='waiting').length;

function render(){ closeCard(); try{ const h=document.querySelector('header.top'); if(h) document.documentElement.style.setProperty('--hdrh', h.offsetHeight+'px'); }catch(e){} const bx=document.getElementById('box'); const keep = bx && bx.value ? {c:openContact, k:replyKind, v:bx.value} : null; renderNav(); const m=document.getElementById('main'); m.innerHTML=''; ({followup:renderFollowup, messages:renderMessages, customers:renderMessages, trades:renderTrades, money:renderMoney, log:renderLog, job:renderJob, settings:renderSettings})[view](m); const bx2=document.getElementById('box'); if(keep && bx2 && keep.c===openContact && keep.k===replyKind && !bx2.value){ bx2.value=keep.v; countBox(bx2); } }

}

function renderFollowup(m){
  const waiting = contacts.filter(c=>c.state==='waiting').sort((a,b)=> (lastMsg(a)?.at||0)-(lastMsg(b)?.at||0));
  const el=document.createElement('div');
  el.innerHTML = `<p class="lead">Follow up</p><p class="note">Everyone waiting on us, one count. Texts, voicemails and missed calls nobody has answered come first, the longest waiting at the top; the quote asks Follow up lists today continue below, unchanged.</p>
  ${(()=>{ const due=contacts.filter(c=>c.back&&c.back.at<=NOW); return due.length?`<h3>Needs you (${due.length})</h3><div class="card list queue">${due.map(c=>{ const nt=messages.find(m=>m.id===c.back.noteId); return `<div class="row clickable" onclick="openThread('${c.id}',${c.back.noteId||'null'})"><div class="top"><div class="avatar ${kindClass(c)}">${initials(c)}</div><div style="flex:1"><div class="who">${esc(c.name)} <span class="pill" style="color:var(--accent);border-color:#bcd0f0;background:var(--accent-soft)">↩ back today</span></div><div class="sub">${esc(c.company||kindWord(c))} · the note by ${esc(c.back.by)}, ${esc(c.back.label)}</div></div><div class="right"><span class="whowrap">${hasPill(c)}</span></div></div><div class="snippet"><b>Note for the team:</b> ${esc(nt?nt.text:'')}</div><div class="acts"><button class="small primary" onclick="event.stopPropagation();openThread('${c.id}')">Open the thread</button><button class="small" onclick="event.stopPropagation();clearBack('${c.id}')">Done with it</button><button class="small" onclick="event.stopPropagation();pushBack('${c.id}')">Another day</button></div></div>`; }).join('')}</div><p class="note" style="margin:-4px 0 10px">A team note with a follow-up day on it brings the row back here that morning, with the note. Done with it clears it; Another day moves it.</p>`:''; })()}
  <h3>Needs a reply (${waiting.length})</h3><div class="card list queue" id="queue"></div>
  <h3>We owe them (${contacts.filter(x=>x.owe).length})</h3><div class="card list queue">${contacts.filter(x=>x.owe).map(x=>`<div class="row clickable" onclick="openThread('${x.id}')"><div class="top"><div class="avatar ${kindClass(x)}">${initials(x)}</div><div style="flex:1"><div class="who">${esc(x.name)} <span class="whowrap"><button type="button" class="court ours owed" data-tip="What we owe|We owe ${esc(firstName(x))} ${esc(x.owe.what)}${x.owe.by?' by '+esc(x.owe.by):''}.|Press to open the thread at the reply box, where the ways to deal with it are." onclick="event.stopPropagation();owedAt('${x.id}')"><i></i>we owe ${esc(x.owe.what)}${x.owe.by?' · by '+esc(x.owe.by):''} ▾</button></span></div><div class="sub">${esc(x.company||kindWord(x))} · ${markedBy(x.owe)}</div></div></div></div>`).join('')||'<div class="empty">Nothing we owe anyone.</div>'}</div>
  ${(()=>{ const rows=nudgeRows(); const notin=BILL_JOBS.map(j=>({j,n:drawsFor(j).filter(d=>d.state==='notin'&&!d.nothing).length})).filter(x=>x.n>1); return `<h3>Nudges from the flow (${rows.length})${notin.map(x=>` <button class="quiet small" style="padding:0;font-weight:400;text-transform:none;letter-spacing:0" onclick="moneyJob='${x.j}';view='money';moneyTab='trades';render()">${x.n} trades not in on ${esc(jobById(x.j).name)} · see them together ›</button>`).join('')}</h3><div class="card list queue">${rows.map(r=>`<div class="row clickable" onclick="openThread('${r.c.id}')"><div class="top"><div class="avatar ${kindClass(r.c)}">${initials(r.c)}</div><div style="flex:1"><div class="who">${esc(r.c.name)} <span class="pill promise">${esc(r.step.name)}</span> <span class="court ours"><i></i>Our move · ${esc(r.how)}</span></div><div class="sub">${esc(r.c.company||kindWord(r.c))} · ${esc(r.why)}</div></div><div class="right"><button class="small" onclick="event.stopPropagation();toast('Opens the call in Quo\\'s app; it comes back as a line.')">Call in Quo</button> <button class="small" onclick="event.stopPropagation();askFor('${r.c.id}','${r.step.id}','${r.paper||''}')">${r.how==='a call'?'Text instead':'Write it'}</button> <button class="small" onclick="event.stopPropagation();holdNudge('${r.c.id}','${r.step.id}');render()">Hold</button></div></div></div>`).join('')||'<div class="empty">No step is quiet past its nudge.</div>'}</div><p class="note" style="margin:-4px 0 10px">A step's nudge fires when it is on now, the move is theirs, and the thread has been quiet that many days, or the day on it has passed; a promised day beats the count. The row says the step, what we are waiting on and the channel the flow asked for. Answering, or the fact turning true, clears it; the thread gets the gray event line.</p>`; })()}

    row.addEventListener('click',ev=>{ if(ev.target.closest('button, select, input, a')) return; openThread(c.id, last?last.id:null); });
    row.innerHTML=`<div class="top"><div class="avatar ${kindClass(c)}">${initials(c)}</div><div style="flex:1"><div class="who">${esc(c.name)} <span class="court ${courtOf(c).side}" title="${esc(courtOf(c).word)}"><i></i>${esc(courtOf(c).word)}</span></div><div class="sub">${esc(c.company||kindWord(c))}${c.def&&jobById(c.def).name!==c.company?` · ${jobTag(c.def)}`:''}</div></div>
      <div class="right"><span class="whowrap">${hasPill(c)}</span></div></div>

        ${c.kind==='unknown'?`<button class="small primary" onclick="whoIsThis('${c.id}')">Who is this?</button>`:`<button class="small primary" onclick="openThread('${c.id}')">Reply</button>`}
        ${last&&(last.ch==='missed'||last.ch==='voicemail')?`<button class="small" onclick="toast('Opens the call in Quo\\'s app; it comes back as a line.')">Call back in Quo</button>`:''}
        <button class="small" onclick="setState('${c.id}','done')">No reply needed</button>
        <button class="small" onclick="remind('${c.id}')">Remind me Monday</button></div>`;
    q.appendChild(row);
  }
}

function renderMessages(m){
  if(view==='customers' && customersBoard){ const el=document.createElement('div'); el.innerHTML=`<p class="lead">Customers <span class="note">· ${boardPeople('customer').length}</span></p><div class="filters"><button onclick="customersBoard=false;render()">Threads</button><button class="${customersBoard==='step'?'on':''}" onclick="customersBoard='step';render()">By step</button><button class="${customersBoard==='company'?'on':''}" onclick="customersBoard='company';render()">By company</button></div><div class="card" style="padding:12px">${customersBoard==='company'?companyTableHtml('customer'):boardHtml('customer')}</div>`; m.appendChild(el); return; }
  const autoRail = flowOpen && openContact && window.innerWidth<=1040 && window.innerWidth>760;
  const panelOn = flowOpen && !window.matchMedia('(max-width: 760px)').matches;
  const wrap=document.createElement('div'); wrap.className='two'+((listCollapsed||autoRail)&&!narrow()?' collapsed':'')+(panelOn&&openContact?' with-flow':openContact?' with-frail':'');
  // list
  const list=document.createElement('div'); list.className='card list'+(narrow()&&openContact?' hidden-narrow':'');
  if((listCollapsed||autoRail)&&!narrow()){ const filt0 = c => (listFilter==='all')|| (listFilter==='customers'&&c.kind==='customer')|| (listFilter==='trades'&&(c.kind==='trade'||c.kind==='arch'))|| (listFilter==='unknown'&&c.kind==='unknown');
    const rows0 = contacts.filter(filt0).sort((a,b)=>(lastMsg(b)?.at||0)-(lastMsg(a)?.at||0));
    list.className='card rail'; list.innerHTML=`<button class="collapse" data-tip="${autoRail&&!listCollapsed?'The list is folded while the flow is open|At this window width the flow panel needs the room.|Fold the flow to get the list back, or widen the window.':'Show the list|Opens the people list again.|Your choice is kept on this computer.'}" onclick="${autoRail&&!listCollapsed?'setFlow(false)':'setCollapsed(false)'}">›</button>${rows0.map(c=>`<div class="avatar ${kindClass(c)} ${c.id===openContact?'on':''}" data-tip="${esc(c.name)}|${esc(c.company||kindWord(c))}|${esc(courtOf(c).word)}" onclick="openThread('${c.id}')">${initials(c)}<span class="cd ${courtOf(c).side}"></span></div>`).join('')}`;
    wrap.appendChild(list); }
  else {
  const filt = c => (listFilter==='all')|| (listFilter==='customers'&&c.kind==='customer')|| (listFilter==='trades'&&(c.kind==='trade'||c.kind==='arch'))|| (listFilter==='unknown'&&c.kind==='unknown');
  const hit = c => !search || [c.name,c.company,...messages.filter(x=>x.c===c.id).map(x=>x.text)].join(' ').toLowerCase().includes(search.toLowerCase());
  // Newest conversation first and nothing else (v1.147): the move pill says whose move it is, and Follow up is the queue; a state change never moves a row.
  const rows = contacts.filter(c=>filt(c)&&hit(c)&&(!stepFilter||(c.kind===stepFilter.kind&&personOn(c,stepFilter.id)))).sort((a,b)=>(lastMsg(b)?.at||0)-(lastMsg(a)?.at||0));
  list.innerHTML=`<div class="lhead"><input placeholder="Search people, companies, words in texts and transcripts" value="${esc(search)}" oninput="search=this.value;render();document.querySelector('.list input').focus()">${narrow()?'':`<button class="collapse" data-tip="Hide the list|Folds the people list to a rail of faces so the thread gets the room.|Each face keeps its dot for whose move it is; your choice is kept on this computer." onclick="setCollapsed(true)">‹</button>`}</div>
    <div class="filters" style="padding:0 10px">${[['all','All'],['customers','Customers'],['trades','Trades'],['unknown','Who is this?']].map(([k,l])=>`<button class="${listFilter===k?'on':''}" onclick="listFilter='${k}';stepFilter=null;render()">${l}</button>`).join('')}<span class="whowrap"><button class="${stepFilter?'on':''}" data-tip="By step|Narrows the list to the people on one step of their flow.|Press again to clear it." onclick="${stepFilter?'stepFilter=null;render()':'stepFilterPicker(this)'}">${stepFilter?esc((stepById(stepFilter.kind,stepFilter.id)||{}).name||'')+' ×':'by step ▾'}</button></span>${view==='customers'?`<button data-tip="By step|Everyone by step: one row per step with the people as chips.|The same people, by where they are." onclick="customersBoard='step';render()">By step</button><button data-tip="By company|One row per company: the flow as a track, the step on now, one line per job.|The same people, by name." onclick="customersBoard='company';render()">By company</button>`:''}</div>`;
  if(!rows.length) list.innerHTML+='<div class="empty">Nothing matches.</div>';
  for(const c of rows){ const last=lastMsg(c); const r=document.createElement('div'); r.className='row'+(c.id===openContact?' on':''); r.onclick=()=>openThread(c.id);
    r.innerHTML=`<div class="avatar ${kindClass(c)}">${initials(c)}</div><div class="body"><div class="l1"><span class="who">${esc(c.name)}</span><span class="when">${last?fmt(last.at).split(' · ')[0]:''}</span></div><div class="l2"><span class="sub">${esc(c.company||kindWord(c))}${c.trade?` · ${esc(c.trade)}`:''}</span>${c.has?`<span class="pill has">${esc(c.has)}</span>`:''}<span class="court ${courtShort(c).side} tiny" title="${esc(courtShort(c).title)}"><i></i>${esc(courtShort(c).word)}</span></div><div class="last">${last?`<b>${chWord(last)}</b> ${esc(snippetOf(last))}`:''}</div></div>`;
    list.appendChild(r); }
  wrap.appendChild(list); }
  // thread
  const th=document.createElement('div'); th.className='card thread';
  const c=cById(openContact);
  if(!c){ th.innerHTML='<div class="empty">Pick a person.</div>'; wrap.appendChild(th); m.appendChild(wrap); return; }
  const cJobs = c.jobs.map(jobById);
  const lines = messages.filter(x=>x.c===c.id && (!jobFilter || x.job===jobFilter)).sort((a,b)=>a.at-b.at);

  <p class="note">Conversations on this job: the messages tied to it, by person, newest first. The job reads only what is tied to it; the person's thread reads everything.</p>
  ${BILL_JOBS.includes(j.id)&&signedAs!=='Wendi'?`<div class="card" style="padding:10px 12px;margin:0 0 6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b>Bill day · ${dayShort(BILL_DAY)}</b><span class="note">pay application ${OWNER_APPS[j.id].number} · trades by ${wdayOf(CUTOFF)} · ${drawsFor(j.id).filter(d=>d.state!=='notin'||d.nothing).length} of ${drawsFor(j.id).length} in · gates ${gatesFor(j.id).filter(g=>g.ok).length} of ${gatesFor(j.id).length}</span><button class="small" style="margin-left:auto" onclick="moneyJob='${j.id}';view='money';moneyTab='trades';render()">From the trades ›</button></div>`:''}
  <h3 style="margin:14px 0 6px">Papers on this job, by company</h3><p class="note">The company's Documents rows read the flow back: the step each paper turns on and where the person is, with the step card's own buttons.</p>
  <div class="card" style="padding:0 12px">${contacts.filter(c=>c.jobs.includes(j.id)&&c.kind!=='unknown').map(c=>{ const order=flat(c.kind); const nowIx=order.findIndex(x=>x.id===S(c).now); const steps=order.filter((x,i)=>(x.papers||[]).length && (['done','lapsed','now'].includes(stepState(c,x.id)) || (nowIx>=0 && i===nowIx+1))); const lines=steps.flatMap(s=>s.papers.map(p=>{ const f=FACTS.find(x=>x.paper===p); if(!f) return ''; const r=factRead(c,f.id,s.loop?(S(c).rounds[s.id]||[]).find(x=>x.s==='now'):null); const st=stepState(c,s.id); const where = st==='done'?'done':st==='lapsed'?'lapsed':st==='now'?`<b>${esc(firstName(c))} is on it</b>`:st==='skipped'?'skipped':'next'; const act = r.m==='ok'?`<button class="small" onclick="toast('Opens it.')">Open</button>`:f.ours&&r.m==='no'?`<button class="small" onclick="sendPaper('${c.id}','${s.id}','${p}')">Send</button>`:!f.ours&&(r.m==='no'||r.m==='bad')?`<button class="small" onclick="askFor('${c.id}','${s.id}','${p}')">Ask for it</button>`:''; return `<div class="doc"><span>${esc(PAPER_NAMES[p].replace(/^\w/,ch=>ch.toUpperCase()))}</span><span class="${r.m==='ok'?'':'note'}" style="${r.m==='ok'?'color:var(--ok)':r.m==='bad'?'color:var(--danger)':''}">${esc(r.m==='ok'?r.words||'on file':r.m==='wait'?'went, waiting on them':r.m==='bad'?r.words:'nothing on file')}</span><span>${esc(s.name)} · ${where}</span><span>${act}</span></div>`; })).join(''); return `<div class="doc h" style="margin-top:6px"><span>${esc(c.company||c.name)} · ${esc(kindWord(c))}</span><span>State</span><span>Finishes</span><span></span></div>${lines}`; }).join('')||'<div class="empty">Nobody on this job has papers.</div>'}</div>

function hasPill(c){ if(!c.has) return `<button type="button" class="haspill none" data-tip="Nobody has it|No one has claimed this conversation.|Whoever answers first takes it. Press to take it or hand it to someone." onclick="whoPicker('${c.id}',this)"><span class="av">?</span><span><span class="lbl">Nobody has it · </span>Take it</span></button>`; const me=c.has===ME; const sinceWords=c.hasSinceAt?` Since ${whenWords(c.hasSinceAt).replace(/^on /,'')}, ${esc(c.hasSince)}.`:(c.hasSince?' Since '+esc(c.hasSince)+'.':''); return `<button type="button" class="haspill ${me?'me':''}" data-tip="${me?'You have this|You claimed it, so the team leaves it to you.'+sinceWords+'|Press to hand it to someone or put it back; the thread records the change.':esc(c.has)+' has this|'+esc(c.has)+' claimed it, so nobody else answers it.'+sinceWords+'|Press to take it or hand it on; the thread records the change.'}" onclick="whoPicker('${c.id}',this)"><span class="av">${initialsOf(c.has)}</span><span>${me?'You':esc(c.has)}<span class="lbl">${me?' have this':' has this'}</span></span></button>`; }

function addStepFile(cid, which){ const c=cById(cid); const f = which==='portal' ? {name:'Their portal link', size:'click.co/t/7Hq2#papers', kind:'link', from:'job', portal:'papers'} : {name:`${PAPER_SHORT[which].replace(/^\w/,ch=>ch.toUpperCase())} form.pdf`, size:'2 pages', kind:'pdf', from:'job'}; if(draftFiles.some(x=>x.name===f.name)){ toast('That one is on it already.'); return; } draftFiles.push(f); toast(`${f.name} is on the message.`); render(); }

  const strip=btn.closest('.tools'); if((strip && getComputedStyle(strip).overflowX==='auto') || btn.closest('.scrollarea')){ const r=btn.getBoundingClientRect(); pk.style.position='fixed'; pk.style.left=Math.max(8,Math.min(r.left, window.innerWidth-268))+'px'; pk.style.top=(r.bottom+6)+'px'; pk.style.right='auto'; document.body.appendChild(pk); }

// A popover opens pinned to its button's right edge; when that would run past the window's left edge it flips to the
// button's left edge, and a bottom-anchored one that would run past the top opens downward (the owner, 2026-10-11: the
// More menu hung off the left edge of a narrow pane).
function keepInside(pk){ const r=pk.getBoundingClientRect(); if(r.left<8){ pk.style.right='auto'; pk.style.left='0'; const r2=pk.getBoundingClientRect(); if(r2.right>window.innerWidth-8) pk.style.width=Math.max(200, window.innerWidth-16-r2.left)+'px'; } if(r.top<8 && pk.style.bottom){ pk.style.bottom='auto'; pk.style.top='calc(100% + 6px)'; } }
function outsideWho(e){ const pk=document.getElementById('whopick'); if(!pk) return; if(e.target.closest('.haspill')||e.target.closest('.whowrap>button')||e.target.closest('.statepill')||e.target.closest('.attach>button')) return; if(!pk.contains(e.target)) closeWho(); else setTimeout(()=>document.addEventListener('click', outsideWho, {once:true}),0); }
function closeWho(){ document.getElementById('whopick')?.remove(); }
function claim(id,who){ const c=cById(id); const before=c.has; c.has=who||null; c.hasSince=who?NOW_WORDS:null; c.hasSinceAt=who?NOW:null; if(before!==c.has){ const line = !who ? `${ME} put ${c.name} back for whoever answers first.` : who===ME ? (before ? `${ME} took ${c.name} from ${before}.` : `${ME} took ${c.name}.`) : (before ? `${ME} handed ${c.name} to ${who}.` : `${ME} gave ${c.name} to ${who}.`); messages.push({id:++seq,c:id,job:null,ch:'event',dir:'team',who:ME,at:NOW+messages.length,text:line}); } toast(who?(who===ME?`You have ${c.name}.`:`${who} has ${c.name}.`):'Nobody has it.'); render(); }
function setState(id,s){ const c=cById(id); c.state=s; if(s==='done') c.has=null; toast(s==='done'?`${c.name} cleared from Follow up.`:`${c.name} is back in Follow up.`); render(); }

  const chips=dayChips().map(d=>`<button type="button" class="daychip ${noteBack&&noteBack.label===d.label?'on':''}" onclick="setNoteBack('${d.label}')"><b>${esc(d.top)}</b><small>${esc(d.sub)}</small></button>`).join('');

function setNoteBack(v){ const r=readDay(v); if(!r){ toast('Say a day, like Friday or Oct 16.'); return; } const base=new Date(NOW); base.setHours(0,0,0,0); const at=(()=>{ const m=r.label.match(/([A-Z][a-z]{2}) (\d{1,2})/); if(!m) return base.getTime()+86400000; const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; const d=new Date(base.getFullYear(), months.indexOf(m[1]), +m[2], 8, 0); if(d<base) d.setFullYear(d.getFullYear()+1); return d.getTime(); })(); noteBack={label:r.label, at}; noteBackOpen=true; render(); const box=document.getElementById('box'); if(box) box.focus(); }
function clearBack(cid){ const c=cById(cid); const l=c.back?c.back.label:''; c.back=null; render(); toast(`Cleared; the note stays in the thread${l?' ('+l+')':''}.`); }
function pushBack(cid){ const c=cById(cid); const d=new Date(NOW); d.setDate(d.getDate()+ (d.getDay()>=5?3:1)); d.setHours(8,0,0,0); c.back={...c.back, label:d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}).replace(',',''), at:d.getTime()}; render(); toast(`Comes back ${c.back.label}.`); }

function confirmRemoveJob(cid,jid){ const c=cById(cid), j=jobById(jid); const first=firstName(c); const n=messages.filter(m=>m.c===cid&&m.job===jid).length; const isDef=c.def===jid; const next=isDef?(c.jobs.find(x=>x!==jid)||null):null;

      ${isDef?`<div><span class="k">★</span><span>It is where new messages from ${esc(first)} land. After this they land on ${next?jobTag(next):`<b>${esc(first)} alone</b>, until someone adds a job`}.</span></div>`:''}

function removeJob(cid,jid){ const c=cById(cid); const j=jobById(jid); const wasDef=c.def===jid; c.jobs=c.jobs.filter(x=>x!==jid); if(wasDef) c.def=c.jobs[0]||null; if(jobFilter===jid) jobFilter=null; messages.push({id:++seq,c:cid,job:null,ch:'event',dir:'team',who:ME,at:NOW+messages.length,text:`${ME} took ${jobText(jid)} off ${c.name}.${wasDef?(c.def?` New messages land on ${jobText(c.def)} now.`:' New messages land on them alone now.'):''}`}); toast(`${jobText(jid)} is off ${c.name}. The lines tied to it keep their tie.`); render(); }

  if(low==='today') return {label:lbl(base), known:true}; if(low==='tomorrow'){ const d=new Date(base); d.setDate(d.getDate()+1); return {label:lbl(d), known:true}; }
  const days=['sunday','monday','tuesday','wednesday','thursday','friday','saturday']; const m=low.match(/^(next\s+)?(sun|mon|tue|wed|thu|fri|sat)[a-z]*$/); if(m){ const want=days.findIndex(d=>d.startsWith(m[2])); const d=new Date(base); let add=(want-d.getDay()+7)%7; if(add===0) add=7; if(m[1]&&add<7) add+=7; d.setDate(d.getDate()+add); return {label:lbl(d), known:true}; }
  const md=t.match(/^([A-Za-z]{3,9})\.?\s+(\d{1,2})$/); if(md){ const mi=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'].indexOf(md[1].slice(0,3).toLowerCase()); if(mi>=0){ const d=new Date(2026,mi,Number(md[2])); if(d<base) d.setFullYear(2027); return {label:lbl(d), known:true}; } }

  return {label:t, known:false}; }

// Why the opt-out line is on this text, if it is (v1.86): 'first' for the first text we ever send the number, 'silence' when our
// last text to them is 30 days or more old (OPTOUT_SILENCE_DAYS), '' when the conversation is live. The carriers' rule for a
// registered business number; a person may hold it back once when the reason is only the silence, never on a first text.
const OPTOUT_SILENCE_DAYS = 30;
function optoutReason(c){ const ours=messages.filter(m=>m.c===c.id&&m.ch==='text'&&m.dir==='out').sort((a,b)=>b.at-a.at); if(!ours.length) return 'first'; const days=(NOW-ours[0].at)/86400000; return days>=OPTOUT_SILENCE_DAYS ? 'silence' : ''; }

function setSubject(val){ const v=(val||'').trim(); if(!v){ toast('Type a subject, or Cancel.'); return; } subjectOverride=v; toEditing=null; window.__pvPaint(); }
function setGoesBy(cid,val){ const c=cById(cid); const v=(val||'').trim(); if(!v){ toast('Type what they go by, or Cancel.'); return; } const was=firstName(c); if(v!==was){ c.goesBy=v; messages.push({id:++seq,c:cid,job:null,ch:'event',dir:'team',who:ME,at:NOW+messages.length,text:`${ME} set that ${c.name} goes by ${v}${was?', not '+was:''}.`}); toast(`${c.name} goes by ${v} now, in every greeting.`); } toEditing=null; window.__pvPaint(); }
function setContactTo(cid,kind,val){ const c=cById(cid); const v=(val||'').trim(); if(!v){ toast(kind==='email'?'Type their email, or Cancel.':'Type their number, or Cancel.'); return; } if(kind==='email'&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){ toast('That does not read as an email.'); return; } const was=kind==='email'?c.emails[0]:c.phones[0]; if(kind==='email') c.emails[0]=v; else c.phones[0]=v; messages.push({id:++seq,c:cid,job:null,ch:'event',dir:'team',who:ME,at:NOW+messages.length,text:`${ME} ${was?'changed':'added'} ${c.name}'s ${kind==='email'?'email':'number'}${was?' from '+was:''} to ${v}.`}); toEditing=null; toast(`${c.name}'s ${kind==='email'?'email':'number'} is ${v} now, on their record.`); window.__pvPaint(); }
let afterMove='theirs';
let subjectOverride=null; // the subject typed in the send window, for this one email (v1.84)
function previewDraft(cid, kind){ const c=cById(cid); afterMove = c.owe ? 'ours' : 'theirs'; subjectOverride=null; optoutHeld=false; const box=document.getElementById('box'); const body=(box.value||'').trim(); if(!body){ toast('Write the message first.'); return; } const job=replyTie==='none'?null:(replyTie||c.def); let cur=kind;
  let footNote='';
  const draw=()=>{ footNote=''; const tabs=`<div class="pv-tabs"><button class="${cur==='email'?'on':''}" onclick="window.__pvSet('email')">Email</button><button class="${cur==='text'?'on':''}" onclick="window.__pvSet('text')">Text</button></div>`;
    let html;
    if(cur==='email'){ const subj=subjectOverride||subjectFor(c,job,body); const to=c.emails[0]||'(no email on file)';
      html=`${tabs}<p class="note">What ${esc(c.name)} sees in their inbox, then opened.</p>
      <div class="mail"><div class="inboxrow"><span class="from">${COMPANY.name}</span><span class="subj">${esc(subj)}</span><span class="when">10:32 AM</span></div>
      <div class="head"><b>From:</b> ${COMPANY.name} &lt;${COMPANY.email}&gt;<br><b>To:</b> ${toLine(c,'email')}<br><b>Subject:</b> ${toEditing==='subject'?`<span class="to-box"><input id="subjin" value="${esc(subj)}" style="min-width:360px" onkeydown="if(event.key==='Enter'){setSubject(this.value)} if(event.key==='Escape'){toEditing=null;window.__pvPaint()}"><button class="small primary" onclick="setSubject(document.getElementById('subjin').value)">Save</button><button class="small" onclick="toEditing=null;window.__pvPaint()">Cancel</button></span>`:`${esc(subj)} <button type="button" class="quiet small to-edit subj-edit" data-tip="Change the subject|For this email only.|The app made it from the job and your first line; your words replace it here and nowhere else." onclick="toEditing='subject';window.__pvPaint();setTimeout(()=>{const i=document.getElementById('subjin'); if(i){i.focus(); i.select();}},0)">change</button>`}</div>
      <div class="lh">CLICK CONSTRUCTION<small>${COMPANY.phone} · ${COMPANY.site}</small></div>
      <div class="body">${toEditing==='name'?`Hello <span class="to-box"><input id="namein" value="${esc(c.goesBy||firstName(c))}" placeholder="what they go by" onkeydown="if(event.key==='Enter'){setGoesBy('${c.id}',this.value)} if(event.key==='Escape'){toEditing=null;window.__pvPaint()}"><button class="small primary" onclick="setGoesBy('${c.id}',document.getElementById('namein').value)">Save</button><button class="small" onclick="toEditing=null;window.__pvPaint()">Cancel</button></span>,`:`Hello ${esc(firstName(c))}, <button type="button" class="quiet small name-edit" data-tip="What they go by|Sets the name every greeting uses, on ${esc(c.name)}'s record.|Dr. Raman, Gregory, Bill: whatever they want to be called. The thread records the change." onclick="toEditing='name';window.__pvPaint();setTimeout(()=>document.getElementById('namein')?.focus(),0)">change</button>`}\n\n${esc(body)}</div>
      ${draftFiles.length?`<div class="att" style="padding:0 14px 10px">${draftFiles.map(f=>f.big?`<span class="chip" title="Over the email limit, so it stays in the job's Drive folder and goes as our link to it"><span class="ic link">↗</span><span>${esc(f.name)} <span class="note">· our link to it in Drive · ${esc(f.size)}</span></span></span>`:`<span class="chip">${f.from==='photo'?'<span class="thumb"></span>':`<span class="ic ${f.kind}">${f.kind==='pdf'?'PDF':'F'}</span>`}<span>${esc(f.name)} <span class="note">· ${esc(f.size)}</span></span></span>`).join('')}</div>`:''}
      <div class="sig">${ME}${TEAM_INFO[ME].title?' · '+TEAM_INFO[ME].title:''}${TEAM_INFO[ME].cell?'\ncell '+TEAM_INFO[ME].cell:''}\nEmail back, text, or call.</div>
      <div class="foot">${COMPANY.name}, ${COMPANY.addr}. ${job?'About '+esc(jobById(job).name)+'. ':''}A copy of this email is kept in Documents${draftFiles.length?', with its file'+(draftFiles.length===1?'':'s'):''}.</div></div>
      ${draftFiles.some(f=>f.big)?`<div class="pv-note">${draftFiles.filter(f=>f.big).map(f=>esc(f.name)).join(', ')} ${draftFiles.filter(f=>f.big).length===1?'is':'are'} over the email limit, so ${draftFiles.filter(f=>f.big).length===1?'it stays':'they stay'} in the job's Drive folder and ${draftFiles.filter(f=>f.big).length===1?'goes':'go'} as our link, ${draftFiles.filter(f=>f.big).some(f=>f.portal)?'to their portal page':'to the file'}, the way a plan set always has. The link is ours, not Drive's: it opens the Plans half only, we see who opened it, and we can cut it off.</div>`:''}
      ${!c.emails.length?'<div class="pv-warn">They have no email on file. Add one on the To line and the email can go.</div>':''}
      `; footNote='The subject comes from the job and your first line, or your own words on it; the greeting from their contact name; the letterhead from who the job is for (Click Construction on a GC job); the signature from your account, your title and your cell if you have one there. Nothing here is typed twice.';
    } else { const prior=[...messages].filter(m=>m.c===c.id&&m.ch==='text').sort((a,b)=>a.at-b.at).slice(-2); const segs=Math.max(1,Math.ceil(body.length/160)); const reason=optoutReason(c); const withLine = reason && !(reason==='silence'&&optoutHeld); const footer=withLine?`\n\n${OPTOUT_LINE}`:''; const linkText=linkLines(draftFiles).map(l=>`\n${l.text}${l.link}`).join(''); const full=body+linkText+footer; const fsegs=Math.max(1,Math.ceil(full.length/160)); const lastOurs=messages.filter(m=>m.c===c.id&&m.ch==='text'&&m.dir==='out').sort((a,b)=>b.at-a.at)[0]; const quietDays=lastOurs?Math.round((NOW-lastOurs.at)/86400000):0;
      html=`${tabs}<p class="note">What ${esc(c.name)} sees on their phone, under the texts already there.</p>
      <div class="to-line"><b>To:</b> ${toLine(c,'phone')}</div>
      <div class="phone"><div class="bar"><b>${COMPANY.name}</b>${COMPANY.phone}</div><div class="screen">
        ${prior.map(m=>`<div class="bub ${m.dir==='in'?'them':'us'}">${esc(m.text)}</div>`).join('')}
        <div class="stamp">Today 10:32 AM</div>
        <div class="bub us new">${esc(body)}${linkLines(draftFiles).map(l=>`\n${esc(l.text)}<u>${l.link}</u>`).join('')}</div>${draftFiles.filter(f=>f.from==='photo').map(f=>`<div class="bub us pic" title="${esc(f.name)}"><span class="thumb"></span></div>`).join('')}${withLine?`<div class="bub us legal" data-tip="Added by the app|${reason==='first'?'Their first text from us carries the company name and the opt-out line the carriers require.':'Our last text to them was '+quietDays+' days ago, so the line goes on again, as the carriers ask after a quiet spell.'}|It goes as its own bubble, so it never reads as your words.">${esc(OPTOUT_LINE)}<span class="lg">added by the app · ${reason==='first'?'required on a first text':'after '+quietDays+' quiet days'}</span></div>`:''}<div class="dl">Delivered</div></div></div>
      ${reason==='silence'?`<div class="legal-note">${optoutHeld?`The opt-out line is held back this time; you said the ${quietDays} quiet days do not make a stranger of ${esc(firstName(c))}. <button type="button" class="quiet small hold" onclick="optoutHeld=false;window.__pvPaint()">Put it back</button>`:`The line is on because our last text was ${quietDays} days ago. <button type="button" class="quiet small hold" data-tip="Leave it off this time|Holds the opt-out line back on this one text.|Only when the reason is the quiet spell, never on a first text. The message keeps a note that you held it back." onclick="optoutHeld=true;window.__pvPaint()">Leave it off this time</button>`}</div>`:''}
      ${c.optout?'<div class="pv-warn">They sent STOP. The app will not send this text.</div>':''}
      ${!c.phones.length?'<div class="pv-warn">They have no mobile number on file. Add one on the To line and the text can go.</div>':''}
      ${fsegs>2?`<div class="pv-warn">${full.length} characters is ${fsegs} texts${withLine?', with the opt-out line':''}. Long texts arrive in pieces on some phones; an email may read better.</div>`:''}
      <div class="pv-note">${full.length} characters · ${fsegs} text${fsegs>1?'s':''}${draftFiles.some(f=>f.from==='photo')?' · the photo goes as a picture message':''}${draftFiles.some(f=>f.from!=='photo')?' · a text cannot carry a file, so each goes as our link, to their portal when it has a page there, else to the file in the job\'s Drive folder':''}. Sent from the company number, so their reply lands back in this thread whoever answers.</div>`; }
    return html; };
  const bg=document.createElement('div'); bg.className='modal-bg'; const m=document.createElement('div'); m.className='modal wide'; bg.appendChild(m);
  const paint=()=>{ m.innerHTML=`<h2>Before it goes, this is what they see</h2>${draw()}<div class="after ${afterMove}"><span class="al">After this sends:</span> <span class="seg"><button type="button" class="${afterMove==='theirs'?'on':''}" data-tip="Their move|${c.owe?'This message gets '+esc(c.owe.what)+' done. We are waiting on them.':'We are waiting on them.'}|${c.owe?'What we owe clears when this goes; the row leaves We owe them.':'Nothing is on us after this goes.'}" onclick="window.__after('theirs')">Their move</button><button type="button" class="${afterMove==='ours'?'on':''}" data-tip="Our move|${c.owe?'We still owe '+esc(c.owe.what)+' after this goes.':'Something is still on us after this goes.'}|Follow up keeps it under We owe them until it is done." onclick="window.__after('ours')">Our move</button></span> <span class="aw">${afterMove==='theirs'?(c.owe?`This message gets <span class="fill">${esc(c.owe.what)}</span> done.`:`Nothing is on us.`):(c.owe?`We still owe <span class="fill">${esc(c.owe.what)}</span>${c.owe.by?' by <span class="fill">'+esc(c.owe.by)+'</span>':''}.`:`<span style="white-space:nowrap">We still owe <span class="to-box"><input id="owew" placeholder="what?" autocomplete="off"></span> by <span class="to-box"><input id="oweb" placeholder="when?" autocomplete="off"></span></span>`)}</span></div><div class="btns"><button onclick="this.closest('.modal-bg').remove()">Change it</button><button onclick="toast('A test copy went to your own address.')">Send a test to me</button><button class="primary" ${cur==='text'&&(c.optout||!c.phones.length)?'disabled':''} ${cur==='email'&&!c.emails.length?'disabled':''} onclick="window.__oweFromSend('${c.id}');replyKind='${cur}';this.closest('.modal-bg').remove();render();document.getElementById('box').value=window.__pvBody;sendReply('${c.id}')">Send as ${cur}</button></div>${footNote?`<div class="pv-note foot">${footNote}</div>`:''}`; };
  window.__pvBody=body; window.__pvSet=k=>{cur=k;toEditing=null;paint();}; window.__pvPaint=paint; window.__after=v=>{ afterMove=v; paint(); if(v==='ours') setTimeout(()=>document.getElementById('owew')?.focus(),0); }; window.__oweFromSend=cid=>{ const cc0=cById(cid); if(cc0.owe && afterMove==='theirs'){ pendingSettle={what:cc0.owe.what, by:cc0.owe.by}; } if(!cc0.owe && afterMove==='ours'){ const w=(document.getElementById('owew')?.value||'').trim(); if(w){ const cc=cById(cid); cc.owe={what:w, by:(document.getElementById('oweb')?.value||'').trim()||null, since:NOW_WORDS, at:NOW, who:ME}; messages.push({id:++seq,c:cid,job:null,ch:'event',dir:'team',who:ME,at:NOW+messages.length,text:`${ME} marked that we owe ${cc.name} ${w}${cc.owe.by?' by '+cc.owe.by:''}.`}); } } }; paint(); document.body.appendChild(bg); bg.onclick=e=>{ if(e.target===bg) bg.remove(); }; }

// ---------- modal / sheet ----------
function modal(title, body, onOk){ const bg=document.createElement('div'); bg.className='modal-bg'; bg.innerHTML=`<div class="modal"><h2>${title}</h2>${body}<div class="btns"><button id="mcancel">Not now</button><button class="primary" id="mok">Save</button></div></div>`; document.body.appendChild(bg); bg.querySelector('#mcancel').onclick=()=>bg.remove(); bg.querySelector('#mok').onclick=()=>{ if(onOk()!==false) bg.remove(); }; bg.onclick=e=>{ if(e.target===bg) bg.remove(); }; const f=bg.querySelector('input'); if(f) f.focus(); }
function sheet(title, optsHtml){ closeSheet(); const s=document.createElement('div'); s.className='sheet'; s.id='sheet'; s.innerHTML=`<h2>${title}</h2><div class="opts">${optsHtml}<button class="quiet" onclick="closeSheet()">Cancel</button></div>`; document.body.appendChild(s); }
function closeSheet(){ document.getElementById('sheet')?.remove(); }

// ---------- hover cards: what a control does, and what it changes ----------
// The card's calendar (the owner, 2026-10-11): the last weeks as rows, S M T W T F S, each day colored by who wrote that
// day (blue us, green them, both split), a yellow dot for a team note, today outlined, days to come dashed. Six weeks, or back
// to the first message when that is sooner.
function stampCalendar(c){ const DAY=86400000; const mine=messages.filter(m=>m.c===c.id&&m.ch!=='event'); if(!mine.length) return '';
  const key=ts=>new Date(ts).toDateString(); const byDay={}; for(const m of mine){ const k=key(m.at); const d=byDay[k]=byDay[k]||{inN:0,outN:0,note:0}; if(m.dir==='in') d.inN++; else if(m.dir==='out') d.outN++; else d.note++; }
  const today=new Date(NOW); today.setHours(0,0,0,0); const first=new Date(Math.min(...mine.map(m=>m.at))); first.setHours(0,0,0,0);
  const sixWeeksBack=new Date(today.getTime()-DAY*41); const start=new Date(Math.max(first.getTime(), sixWeeksBack.getTime())); start.setDate(start.getDate()-start.getDay());
  const end=new Date(today); end.setDate(end.getDate()+(6-end.getDay()));
  let html='<div class="cal">'+['S','M','T','W','T','F','S'].map(h=>`<span class="h">${h}</span>`).join('')+'<span></span>';
  const md=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  for(let w=new Date(start); w<=end; w.setDate(w.getDate()+7)){ const m1=new Date(w), m2=new Date(w); m2.setDate(m2.getDate()+6); const thisWeek=today>=m1&&today<=m2; const lbl=`${md(m1)} – ${m2.getMonth()===m1.getMonth()?m2.getDate():md(m2)}${thisWeek?' · this week':''}`;
    for(let d=0; d<7; d++){ const day=new Date(w); day.setDate(day.getDate()+d); const k=key(day); const v=byDay[k]; const fut=day>today; const cls=['c', fut?'future':'', v?(v.inN&&v.outN?'both':v.inN?'them':v.outN?'us':''):'', v&&v.note?'note':'', day.getTime()===today.getTime()?'today':''].filter(Boolean).join(' '); const n=v?v.inN+v.outN:0; html+=`<span class="${cls}">${n>1?n:''}</span>`; } html+=`<span class="m">${lbl}</span>`; }
  html+='</div><div class="callg"><span><i class="us"></i>us</span><span><i class="them"></i>them</span><span><i class="both"></i>both</span><span><i class="note"></i>a team note</span><span><i class="today"></i>today</span><span>· a number is how many that day</span></div>';
  return html; }
// A card may carry a legend (data-tip-legend), drawn when it opens from the page's own state, so the sample chips are the real ones.
const TIP_LEGENDS = {
  stamps(){ const c=cById(openContact); if(!c) return ''; const i=lastInOnly(c), o=lastOut(c);
    return `<div class="leg"><div><b style="width:36px;text-align:right;flex:none">Them</b><span class="w">${i?esc(stampFull(i)):'nothing yet'}</span></div><div><b style="width:36px;text-align:right;flex:none">Us</b><span class="w">${o?esc(stampFull(o)):'nothing yet'}</span></div></div>${stampCalendar(c)}`; },
  jobs(){ const c=cById(openContact); if(!c) return ''; const nm=id=>jobById(id)?jobById(id).name:''; const def=c.def?nm(c.def):null; const blueId=jobFilter||c.jobs.find(j=>j!==c.def)||c.def; const blue=blueId?nm(blueId):'a job'; const blueJ=blueId?jobById(blueId):null; const defJ=c.def?jobById(c.def):null; const first=firstName(c);
    return `<div class="leg">
      <div><span class="jobtile mini on"><span class="ln"><span class="num ${blueJ?blueJ.kind:'bid'}">${esc(blueJ?jobNum(blueJ):'B?')}</span><span class="nm">${esc(blue)}</span></span></span><span class="w"><b>Blue</b> is what you are looking at: the thread shows only the lines tied to that job. Click it again, or <i>show all</i>, to see everything.</span></div>
      <div><span class="jobtile mini"><span class="ln"><span class="star">★</span>${defJ?`<span class="num ${defJ.kind}">${esc(jobNum(defJ))}</span>`:''}<span class="nm">${esc(def||'none yet')}</span></span></span><span class="w"><b>The gold star</b> is where new messages from ${esc(first)} land until someone changes it. Click ☆ on another job to move it. It never changes what you are looking at.</span></div>
      <div><span class="jobchip" style="color:var(--text-muted)">⧉ ×</span><span class="w">⧉ opens the job's card; × takes the job off ${esc(first)} (the lines tied to it keep their tie). The second line is the job's day in words: a bid's day, a project's stage, a Pipeline job's step.</span></div>
      <div><span class="jobchip ghost">drag</span><span class="w">Drag a tile onto a line to tie that one message there; press and hold on a phone. A line with no job sits on the person alone.</span></div>
    </div>`; }
};
(function(){ const tip=document.createElement('div'); tip.className='tip'; document.body.appendChild(tip); let timer=null, cur=null;
  const show=el=>{ const [head,what,changes]=el.dataset.tip.split('|'); const [lk,la]=(el.dataset.tipLegend||'').split(':'); const leg=lk&&TIP_LEGENDS[lk]?TIP_LEGENDS[lk](la):''; tip.innerHTML=`<b>${esc(head)}</b>${what?`<p class="what">${esc(what)}</p>`:''}${changes?`<p class="changes">${esc(changes)}</p>`:''}${leg}`; const r=el.getBoundingClientRect(); tip.style.left='0px'; tip.style.top='0px'; tip.classList.add('show'); const w=tip.offsetWidth, h=tip.offsetHeight; let x=r.left+r.width/2-w/2, y=r.bottom+8; if(x<8) x=8; if(x+w>window.innerWidth-8) x=window.innerWidth-8-w; if(y+h>window.innerHeight-8) y=Math.max(8, window.innerHeight-8-h); tip.style.left=x+'px'; tip.style.top=y+'px'; };
  const hide=()=>{ clearTimeout(timer); tip.classList.remove('show'); cur=null; };
  document.addEventListener('mouseover',e=>{ const el=e.target.closest('[data-tip]'); if(!el||el===cur) return; hide(); cur=el; timer=setTimeout(()=>show(el),300); });
  document.addEventListener('mouseout',e=>{ const el=e.target.closest('[data-tip]'); if(el&&el===cur&&!el.contains(e.relatedTarget)) hide(); });
  document.addEventListener('focusin',e=>{ const el=e.target.closest('[data-tip]'); if(el){ cur=el; show(el); } });
  document.addEventListener('focusout',hide); document.addEventListener('click',()=>setTimeout(hide,0),true); window.addEventListener('scroll',hide,true); })();

window.addEventListener('resize',()=>render());
render();
