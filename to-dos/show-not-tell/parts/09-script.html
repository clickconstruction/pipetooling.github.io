          if (c.v === 'miss') { const dot = document.createElement('i'); dot.className = 'dot miss'; dot.style.marginBottom = '2px'; d.appendChild(dot); }
          else { const col = document.createElement('i'); col.className = 'col' + (c.flag === 'today' ? ' today' : c.flag === 'part' ? ' part' : ''); col.style.height = c.v + '%'; d.appendChild(col); }
        }
      } else {
        const ms = marks[i] || [];
        if (!ms.length && sched && sched.has(dow)) ms.push('ring');
        ms.forEach((cls) => { const dot = document.createElement('i'); dot.className = 'dot ' + cls; d.appendChild(dot); });
      }
      el.appendChild(d);
    }
  }
  function renderDaysLab(el) {
    if (el.dataset.rendered) return;
    el.dataset.rendered = '1';
    const n = +el.dataset.n || 1;
    (el.dataset.labels || '').split('|').filter(Boolean).forEach((l) => {
      const parts = l.split(':');
      const idx = +parts[0];
      const text = parts[1];
      const mods = parts.slice(2);
      const s = document.createElement('span');
      s.textContent = text;
      s.style.left = ((idx + 0.5) / n * 100) + '%';
      mods.forEach((m) => s.classList.add(m));
      if (idx === 0 && !mods.includes('l') && !mods.includes('r')) { s.classList.add('l'); s.style.left = '0'; }
      if (mods.includes('l')) s.style.left = (idx / n * 100) + '%';
      if (mods.includes('r')) s.style.left = ((idx + 1) / n * 100) + '%';
      el.appendChild(s);
    });
  }
  $$('.days[data-n]').forEach(renderDays);
  $$('.dayslab[data-n]').forEach(renderDaysLab);

  // --- the backlog rows under each shape
  function rowHtml(f) {
    return '<tr data-id="' + f.id + '"><td class="id">' + f.id + '</td><td><div class="t">' + f.a + ' · ' + f.t + '</div><div class="s">' + f.now + '</div></td><td><div class="s">' + f.sh + '</div></td><td class="w">' + f.w + ' · ' + f.z + '</td><td><div class="pick sm" data-for="' + f.id + '"></div></td></tr>';
  }
  $$('.also[data-shape]').forEach((also) => {
    const s = +also.dataset.shape;
    const rows = F.filter((f) => f.s === s && !f.d);
    $('tbody', also).innerHTML = rows.map(rowHtml).join('');
    $('.cap', also).textContent = 'Also takes this shape · ' + rows.length + ' more place' + (rows.length === 1 ? '' : 's');
    if (!rows.length) also.hidden = true;
  });
  // a Build all · Later all · Clear row per shape, after the "lives" line
  $$('.shape').forEach((sec) => {
    const s = +sec.id.slice(1);
    const all = F.filter((f) => f.s === s);
    const div = document.createElement('div');
    div.className = 'pick';
    div.innerHTML = '<span class="lbl">Everything in this shape · ' + all.length + '</span>' + PICKS.map((p) => '<button type="button" data-all="' + p + '">' + WORDS[p] + ' all</button>').join('') + '<button type="button" data-all="">Clear</button>';
    div.addEventListener('click', (e) => {
      const b = e.target.closest('button[data-all]'); if (!b) return;
      const p = b.dataset.all;
      all.forEach((f) => { setPick(f.id, p || null, undefined, true); });
      flushAll();
    });
    $('.lives', sec).insertAdjacentElement('afterend', div);
  });

  // --- the prototype and build bars
  const PROTOS = Object.fromEntries((MANIFEST ? MANIFEST.prototypes : []).map((p) => [p.id, p]));
  const TAGS = { proto: 'Prototype ready', build: 'Built, on its way', shipped: 'Shipped' };
  const esc = (v) => String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const protoUrl = (p) => 'http://localhost:' + p.port + (p.as === 'dev' ? '/dev-login?as=1&to=' + encodeURIComponent(p.door) : p.door);
  const protoCmd = (p) => 'npm run proto -- ' + p.id;
  function barHtml(p) {
    const state = p.kind === 'shipped' ? p.ver + ' · on main' : p.kind === 'build' ? p.ver + ' · auto-merge armed' : p.ver + ' · on its branch behind a switch, off by default';
    const where = (p.kind === 'shipped' ? 'see it at ' : 'door ') + '<code>' + esc(p.door) + '</code>' + (p.note ? ' · ' + esc(p.note) : '');
    const jump = '<span class="jump"><code class="cmd">' + esc(protoCmd(p)) + '</code><button type="button" class="copy" data-cmd="' + esc(protoCmd(p)) + '">Copy</button><span class="then">then</span><a href="' + esc(protoUrl(p)) + '" target="_blank" rel="noreferrer">open it on localhost:' + p.port + ' ↗</a>' + (p.as === 'dev' ? '<span class="then">signed in as the dev</span>' : '') + '</span>';
    return '<span class="tag">' + TAGS[p.kind] + '</span><a href="' + PR_URL + p.pr + '" target="_blank" rel="noreferrer">PR #' + p.pr + ' ↗</a><span class="how">' + state + ' · ' + where + '</span>' + jump;
  }
  Object.values(PROTOS).forEach((p) => {
    $$('.pair[data-id="' + p.id + '"]').forEach((sec) => {
      if ($('.protobar', sec)) return;
      const bar = document.createElement('div');
      bar.className = 'protobar ' + p.kind;
      bar.innerHTML = barHtml(p);
      const meta = $('.meta', sec);
      (meta || $('h3', sec)).insertAdjacentElement('afterend', bar);
    });
  });
  (function drawProtos() {
    const box = $('#protos'); if (!box) return;
    const list = Object.values(PROTOS).sort((x, y) => x.pr - y.pr || x.id.localeCompare(y.id));
    if (!list.length) return;
    const byPr = {}; list.forEach((p) => { (byPr[p.pr] = byPr[p.pr] || []).push(p); });
    const word = (k) => (k === 'shipped' ? ' · shipped' : k === 'build' ? ' · built' : '');
    box.innerHTML = '<div class="cap">Prototypes and builds so far · ' + Object.keys(byPr).length + ' PRs · ' + list.length + ' places · press one to jump to its pair</div><div class="list">'
      + Object.entries(byPr).map(([pr, ps]) => '<a class="' + ps[0].kind + '" href="#' + ps[0].id + '">#' + pr + ' · ' + ps.map((p) => esc(p.title)).join(' + ') + word(ps[0].kind) + '</a>').join('') + '</div>'
      + "<p><b>To jump into one on your own machine.</b> Once: clone the repo and <code>npm install</code>; for the doors that sign in as the dev, put the main checkout's <code>.env.local</code> beside <code>package.json</code> (it holds the dev login's secret; the portal and sample pages need none). Then run the command on the pair's bar: it fetches the PR's branch into its own worktree under <code>.claude/worktrees</code>, starts it on its own port and opens the door with today's look above the shape. <code>npm run proto</code> alone lists them all, and a bar's <i>open it</i> link works once its server is up. The list is <code>to-dos/show-not-tell/prototypes.json</code>; a shipped one is on main, so <code>npm run dev</code> and its door are enough.</p>";
    box.hidden = false;
  })();
  document.addEventListener('click', (e) => {
    const b = e.target.closest('button.copy'); if (!b) return;
    const done = () => { b.textContent = 'Copied'; setTimeout(() => { b.textContent = 'Copy'; }, 1400); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(b.dataset.cmd).then(done, done); else done();
  });

  // --- picks
  function pickHtml(id, small) {
    return '<span class="lbl">Pick</span>' + PICKS.map((p) => '<button type="button" data-pick="' + p + '" aria-pressed="false">' + WORDS[p] + '</button>').join('') + (small ? '' : '<input type="text" id="note-' + id + '" placeholder="a note (what you want different, or why)" maxlength="400">');
  }
  $$('.pick[data-for]').forEach((el) => {
    const id = el.dataset.for;
    el.innerHTML = pickHtml(id, el.classList.contains('sm'));
    el.addEventListener('click', (e) => {
      const b = e.target.closest('button[data-pick]'); if (!b) return;
      const cur = picks[id] && picks[id].pick;
      setPick(id, cur === b.dataset.pick ? null : b.dataset.pick);
      flush(id);
    });
    const inp = $('input', el);
    if (inp) {
      let t = null;
      inp.addEventListener('input', () => { setPick(id, undefined, inp.value, true); clearTimeout(t); t = setTimeout(() => flush(id), 700); });
      inp.addEventListener('blur', () => { clearTimeout(t); flush(id); });
    }
  });
  function setPick(id, pick, note, quiet) {
    const p = picks[id] || (picks[id] = {});
    if (pick !== undefined) p.pick = pick || null;
    if (note !== undefined) p.note = note;
    p.at = new Date().toISOString();
    if (!quiet) render();
  }
  // A note Claude has acted on is cleared (its words live in the pair's blue box), so an empty line means it is the owner's turn again.
  const HANDLED = Object.fromEntries(Object.entries(SEED).filter(([, v]) => v.handledAt).map(([k, v]) => [k, v.handledAt]));
  function applyHandled() {
    Object.entries(HANDLED).forEach(([id, h]) => { const p = picks[id]; if (p && p.note && (!p.at || p.at <= h)) { p.note = ''; p.handled = true; } });
  }
  function render() {
    applyHandled();
    $$('.pick[data-for]').forEach((el) => {
      const p = picks[el.dataset.for] || {};
      $$('button[data-pick]', el).forEach((b) => b.setAttribute('aria-pressed', String(p.pick === b.dataset.pick)));
      const inp = $('input', el);
      if (inp && document.activeElement !== inp && (p.note || '') !== inp.value) inp.value = p.note || '';
      const h = HANDLED[el.dataset.for]; let hs = $('.handled', el);
      if (h && inp && !(p.note)) { if (!hs) { hs = document.createElement('span'); hs.className = 'handled'; el.appendChild(hs); } hs.textContent = 'Your note of Oct 30 was acted on; its words are in the blue box above. The line is yours again.'; } else if (hs) hs.remove();
    });
    const counts = { build: 0, later: 0, drop: 0 };
    let answered = 0;
    F.forEach((f) => { const p = picks[f.id]; if (p && p.pick) { counts[p.pick]++; answered++; } });
    const tally = $('#tally');
    tally.innerHTML = '<span class="chip ok">build <b class="n">' + counts.build + '</b></span><span class="chip">later <b class="n">' + counts.later + '</b></span><span class="chip stop">drop <b class="n">' + counts.drop + '</b></span><span>' + answered + ' of ' + TOTAL + ' answered</span><span class="status ' + (storeState === 'live' ? 'live' : '') + '" id="pick-status">' + (storeState === 'live' ? 'Picks save to this page as you press them.' : storeState === 'refused' ? 'This page is read-only for you; picks stay in this browser.' : 'Picks stay in this browser; Copy my picks to send them. Her picks on shapes 1 and 2, pasted 2026-10-30, are in the page already.') + '</span>';
    applyShow();
  }
  // storage: the page's db when it is served with one, this browser otherwise
  const LS = 'snt217-picks';
  function saveLocal() { try { localStorage.setItem(LS, JSON.stringify(picks)); } catch (e) { /* no storage */ } }
  function loadLocal() { try { const s = localStorage.getItem(LS); if (s) Object.assign(picks, JSON.parse(s)); } catch (e) { /* no storage */ } }
  const inflight = {};
  async function flush(id) {
    saveLocal();
    if (!db) return;
    if (inflight[id]) { inflight[id] = 'again'; return; }
    inflight[id] = true;
    try {
      const p = picks[id] || {};
      if (p.pick || p.note) await db.doc('picks/' + id).set({ pick: p.pick || null, note: p.note || '', at: p.at || new Date().toISOString() });
      else await db.doc('picks/' + id).delete();
    } catch (e) {
      if (e && e.code === 'invalid_argument') { storeState = 'refused'; render(); }
    }
    const again = inflight[id] === 'again';
    delete inflight[id];
    if (again) flush(id);
  }
  function flushAll() { render(); Object.keys(picks).forEach((id) => flush(id)); }
  async function initDb() {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    try { db = await window.claude.use('db'); } catch (e) { db = null; }
    if (!db) return;
    db.collection('picks').onSnapshot((snap) => {
      snap.docs.forEach((d) => { if (d.exists) picks[d.id] = Object.assign({}, d.data()); });
      snap.docChanges().forEach((c) => { if (c.type === 'removed') delete picks[c.doc.id]; });
      if (storeState !== 'refused') storeState = 'live';
      render();
    }, () => { if (storeState === 'live') storeState = 'local'; render(); });
  }
  loadLocal();
  render();
  initDb();

  // --- copy my picks
  $('#copy-picks').addEventListener('click', async () => {
    const lines = ['Show-not-tell picks · punch list #217 · ' + new Date().toISOString().slice(0, 10)];
    PICKS.forEach((p) => { const ids = F.filter((f) => picks[f.id] && picks[f.id].pick === p).map((f) => f.id + (f.with ? ' (+ ' + f.with.join(', ') + ')' : '')); lines.push(WORDS[p].toUpperCase() + ' (' + ids.length + '): ' + (ids.join(', ') || '—')); });
    const notes = F.filter((f) => picks[f.id] && picks[f.id].note).map((f) => '- ' + f.id + ': ' + picks[f.id].note);
    if (notes.length) lines.push('NOTES:', ...notes);
    const text = lines.join('\n');
    const b = $('#copy-picks');
    try { await navigator.clipboard.writeText(text); b.textContent = 'Copied'; }
    catch (e) { const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;left:0;top:0;width:90vw;height:40vh;z-index:9'; document.body.appendChild(ta); ta.select(); b.textContent = 'Select and copy'; }
    setTimeout(() => { b.textContent = 'Copy my picks'; }, 2000);
  });

  // --- theme and show
  const root = document.documentElement;
  function setTheme(t) { root.setAttribute('data-theme', t); $('#theme-light').setAttribute('aria-pressed', String(t === 'light')); $('#theme-dark').setAttribute('aria-pressed', String(t === 'dark')); }
  $('#theme-light').addEventListener('click', () => setTheme('light'));
  $('#theme-dark').addEventListener('click', () => setTheme('dark'));
  try { const q = new URLSearchParams(location.search).get('theme'); if (q === 'dark' || q === 'light') setTheme(q); else if (root.getAttribute('data-theme') === 'dark') setTheme('dark'); } catch (e) { /* none */ }
  function applyShow() {
    const dropped = (id) => { const p = picks[id]; return !!(p && p.pick === 'drop'); };
    $$('.pair').forEach((sec) => { const p = picks[sec.dataset.id]; sec.hidden = (show === 'picked' && !(p && p.pick)) || (!showDropped && dropped(sec.dataset.id)); });
    $$('.also').forEach((a) => {
      if (!$$('tr[data-id]', a).length || show === 'drawn') { a.hidden = true; return; }
      let any = false;
      $$('tr[data-id]', a).forEach((tr) => { const p = picks[tr.dataset.id]; const h = (show === 'picked' && !(p && p.pick)) || (!showDropped && dropped(tr.dataset.id)); tr.hidden = h; if (!h) any = true; });
      a.hidden = show === 'picked' && !any;
    });
    ['all', 'drawn', 'picked'].forEach((k) => $('#show-' + k).setAttribute('aria-pressed', String(show === k)));
    const sd = $('#show-dropped'); const nd = F.filter((f) => dropped(f.id)).length; sd.setAttribute('aria-pressed', String(showDropped)); sd.textContent = showDropped ? 'Hide dropped' + (nd ? ' · ' + nd : '') : 'Show dropped' + (nd ? ' · ' + nd : '');
  }
  ['all', 'drawn', 'picked'].forEach((k) => $('#show-' + k).addEventListener('click', () => { show = k; applyShow(); }));
  $('#show-dropped').addEventListener('click', () => { showDropped = !showDropped; applyShow(); });
  applyShow();
  // --- export: the picks as picks.json, to save beside the page and commit
  function picksFile() {
    const out = { about: SAVED && SAVED.about ? SAVED.about : 'Punch list #217, the saved picks.', saved: new Date().toISOString(), picks: {} };
    Object.keys(picks).sort().forEach((id) => {
      const p = picks[id] || {};
      const row = { pick: p.pick || null, note: p.note || '', at: p.at || null };
      if (HANDLED[id]) row.handledAt = HANDLED[id];
      if (row.pick || row.note || row.handledAt) out.picks[id] = row;
    });
    return JSON.stringify(out, null, 2) + '\n';
  }
  function showPicksText(text) {
    const dlg = $('#picks-out'); if (!dlg) return;
    $('textarea', dlg).value = text; if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', '');
  }
  async function exportPicks() {
    const b = $('#export-picks'); const text = picksFile();
    const said = (w) => { b.textContent = w; setTimeout(() => { b.textContent = 'Export picks'; }, 1600); };
    if (window.claude && typeof window.claude.use === 'function') {
      let dl = null; try { dl = await window.claude.use('downloads'); } catch (e) { dl = null; }
      if (dl) {
        try { await dl.save({ filename: 'picks.json', data: text }); said('Saved'); }
        catch (e) { if (e && e.code === 'declined') said('Not saved'); else showPicksText(text); }
        return;
      }
    }
    try {
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = 'picks.json';
      document.body.appendChild(a); a.click(); a.remove(); said('Downloaded');
    } catch (e) { showPicksText(text); }
  }
  $('#export-picks').addEventListener('click', () => { exportPicks(); });
  $('#picks-out .copy-text').addEventListener('click', async () => {
    const ta = $('#picks-out textarea'); const b = $('#picks-out .copy-text');
    try { await navigator.clipboard.writeText(ta.value); b.textContent = 'Copied'; } catch (e) { ta.select(); b.textContent = 'Select all and copy'; }
    setTimeout(() => { b.textContent = 'Copy'; }, 1600);
  });
  $('#picks-out .close').addEventListener('click', () => { const d = $('#picks-out'); if (d.close) d.close(); else d.removeAttribute('open'); });
  window.__snt = { F, picks, SHAPE_NAMES, picksFile };
})();
</script>
