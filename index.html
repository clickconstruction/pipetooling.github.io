<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // iOS Safari auto-zooms the page when focusing an input whose font-size is
      // under 16px. Capping maximum-scale suppresses that focus-zoom, and since
      // iOS 10 Safari ignores the cap for user pinch gestures, so manual zoom
      // still works. iOS only: Android Chrome honors the cap and would lose
      // pinch-zoom entirely.
      if (
        /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)
      ) {
        var viewportMeta = document.querySelector('meta[name="viewport"]')
        if (viewportMeta) {
          viewportMeta.setAttribute('content', viewportMeta.getAttribute('content') + ', maximum-scale=1')
        }
      }
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.svg" />
    <!-- iOS ignores SVG touch icons, which left link previews without the app
         mark — the PNG is what Messages shows (share cards, v2.3147). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="description" content="Jobs, bids, crews and money — one app for the office and the field." />
    <!-- Link unfurls (v2.1767; card + image v2.3147): every app URL serves this
         shell, so Messages/Slack read these. Crawlers never run the app — the
         per-guide cards are static pages at /g/<slug>/ (helpSharePagesPlugin). -->
    <meta property="og:site_name" content="ClickTooling" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ClickTooling" />
    <meta property="og:description" content="Jobs, bids, crews and money — one app for the office and the field." />
    <meta property="og:url" content="https://clicktooling.com/" />
    <meta property="og:image" content="https://clicktooling.com/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ClickTooling" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ClickTooling" />
    <meta name="twitter:description" content="Jobs, bids, crews and money — one app for the office and the field." />
    <meta name="twitter:image" content="https://clicktooling.com/og-card.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400&family=Playfair+Display:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- iOS "Add to Home Screen" pre-fills from this title (no
         apple-mobile-web-app-title override) — keep it the app's public name. -->
    <title>ClickTooling</title>
  </head>
  <body>
    <script>
      (function () {
        try {
          var k = 'pipetooling-hard-reload-restore'
          var raw = sessionStorage.getItem(k)
          if (!raw) return
          sessionStorage.removeItem(k)
          var o = JSON.parse(raw)
          var path =
            (o.pathname || '/') + (o.search == null ? '' : o.search) + (o.hash == null ? '' : o.hash)
          var cur = location.pathname + location.search + location.hash
          if (path !== cur) history.replaceState(null, '', path)
        } catch (e) {
          /* ignore */
        }
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
