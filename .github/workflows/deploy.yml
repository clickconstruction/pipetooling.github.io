name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and the newest push waits its turn instead of cancelling the run in
# flight. With cancel-in-progress the ~15-minute run was cancelled by every merge; on
# 2026-09-07 twenty merges landed in nine hours and not one deploy completed, so the site sat
# on a 07:19 UTC build all day. GitHub keeps only the newest pending run per group, so the
# queue never grows past one waiting run and each completed deploy is at most one behind main.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Every job carries a timeout-minutes. On 2026-09-30 the build job's Chromium install hung for
# four and a half hours (run 36727134434, v2.4228); with cancel-in-progress off it held the
# "pages" group, so 45 later merges' deploys were cancelled or replaced and nothing reached the
# site all afternoon until the run was cancelled by hand. A run that stalls now fails and the
# next push takes the group. Budgets: build ~7 min, deploy under a minute.
#
# No checks job. Nothing reaches main except through the merge queue (ruleset "main merge queue", no
# bypass actors), and the queue runs ci.yml's checks job on the merged content before it lands, so a copy
# of that job here only repeated it: until 2026-10-27 one did, 22 minutes of runner time on each deploy that
# ran (29 of 60 on 2026-10-26, 648 minutes in all) and every deploy waited on it. The build's own `npm run build`
# still runs tsc before vite build.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Migrations are pushed by hand (CLAUDE.md → Deploy model), so a client that calls a function, table or view only
      # a still-pending migration creates is refused on prod from this deploy until the push: on 2026-10-30 v2.6099
      # (#6473) merged at 4:46 AM, deployed at 4:57 AM and every clock press went through land_field_press, whose
      # migration was pending, until the push. This reads the prod ledger (the same query as migration-drift.yml) and
      # fails the build when a call in src is ahead of a pending migration, so the site keeps the old client; after
      # `bash scripts/db-push.sh` lands the migration the script re-runs this deploy. No token, or the API down: a
      # warning, and the build goes on.
      - name: Every call the client makes is on prod (holds the deploy until the push)
        run: npm run check:calls-ahead -- --prod
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # The build draws one 1200×630 share card per help guide (helpSharePagesPlugin, v2.4190) with Playwright's
      # Chromium; without a browser the pages fall back to the site card, so this step is a nicety, not a gate.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium for the share cards
        run: npx playwright install --with-deps chromium
        # Normally ~1 min; the 2026-09-30 hang sat here. A timed-out step counts as a failure, which
        # continue-on-error turns into "no share cards this deploy" instead of a lost afternoon.
        timeout-minutes: 5
        continue-on-error: true

      - name: Check environment variables
        run: |
          if [ -z "${{ secrets.VITE_SUPABASE_URL }}" ]; then
            echo "::error::VITE_SUPABASE_URL secret is not set in repository settings"
            exit 1
          fi
          if [ -z "${{ secrets.VITE_SUPABASE_ANON_KEY }}" ]; then
            echo "::error::VITE_SUPABASE_ANON_KEY secret is not set in repository settings"
            exit 1
          fi
          echo "Environment variables are set (values hidden for security)"

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          # Optional (v2.3145): Maps JavaScript API browser key for the Dashboard jobs map; unset → OpenStreetMap.
          VITE_GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.VITE_GOOGLE_MAPS_BROWSER_KEY }}

      - name: Verify build output
        run: |
          echo "Verifying build output..."
          echo "Contents of dist directory:"
          ls -la dist/ || true
          echo ""
          if [ ! -f dist/.nojekyll ]; then
            echo "::error::.nojekyll file is missing from dist directory"
            exit 1
          fi
          if [ ! -f dist/index.html ]; then
            echo "::error::index.html is missing from dist directory"
            exit 1
          fi
          if [ ! -f dist/404.html ]; then
            echo "::error::404.html is missing — vite copy-404 plugin should copy index.html for GitHub Pages SPA paths"
            exit 1
          fi
          echo "Contents of dist/index.html:"
          cat dist/index.html
          echo ""
          if ! grep -q "assets/index-" dist/index.html; then
            echo "::error::index.html does not reference built assets correctly"
            exit 1
          fi
          if grep -q "main.tsx" dist/index.html; then
            echo "::error::index.html still references source file main.tsx"
            exit 1
          fi
          echo "✓ Build output verified: .nojekyll present, index.html references built assets"

      # One release of asset overlap: a tab still running the just-superseded build can
      # keep fetching its hashed route chunks instead of 404ing (which triggers the
      # v2.811 auto-reload). The live site's sw.js embeds the precache manifest of the
      # CURRENT deploy's own build only — merged-in older assets are never listed — so
      # pulling from it carries exactly one deploy of history, with no accumulation.
      # Best-effort: a fetch failure must never block the deploy.
      - name: Merge previous deploy's assets (one release of overlap)
        run: |
          SITE_URL="https://$(cat CNAME)"
          echo "Fetching live SW precache manifest from $SITE_URL/sw.js..."
          if ! curl -fsSL --max-time 30 "$SITE_URL/sw.js" -o /tmp/live-sw.js; then
            echo "::warning::Could not fetch live sw.js — skipping asset overlap (first deploy or site unreachable)"
            exit 0
          fi
          PREV_ASSETS=$(grep -oE 'assets/[A-Za-z0-9._-]+' /tmp/live-sw.js | sort -u)
          if [ -z "$PREV_ASSETS" ]; then
            echo "::warning::No assets found in live sw.js manifest — skipping asset overlap"
            exit 0
          fi
          mkdir -p dist/assets
          total=0; merged=0; kept=0; failed=0
          for a in $PREV_ASSETS; do
            total=$((total + 1))
            if [ -f "dist/$a" ]; then
              kept=$((kept + 1))
              continue
            fi
            if curl -fsSL --max-time 30 "$SITE_URL/$a" -o "dist/$a"; then
              merged=$((merged + 1))
            else
              rm -f "dist/$a"
              failed=$((failed + 1))
              echo "::warning::Failed to fetch previous asset $a — stale clients needing it will 404 (auto-recovery reload covers them)"
            fi
          done
          echo "Asset overlap: $total previous assets — $merged merged, $kept already in new build, $failed failed"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # deploy-pages itself waits at most 10 minutes for the deployment; the job gets a little more.
    timeout-minutes: 15
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # deploy-pages max wait is 600000 ms (10m); omit timeout to use default.
          reporting_interval: 10000
