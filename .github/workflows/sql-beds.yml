name: SQL beds

# The whole-schema SQL beds (scripts/pgtest-*.sh) need Docker, and no session on the office Mac can
# reach it. GitHub's runners have it. Each bed applies every migration and then plays its scenario,
# so any migration can break any bed: when a PR touches a migration, a bed's test folder, a bed
# script or this workflow, every bed in scripts/sql-beds.txt runs. The one job branch protection
# requires is `sql-beds`, the gate at the bottom: it reports on every pull request and every
# merge-queue build (a required check that never reports would block the merge), passes when the
# beds passed or were not needed, and fails when any bed failed or was cancelled (2026-10-09, the
# owner's call after a red bed could have merged).
#
# To add a bed: its script scripts/pgtest-<name>.sh, its folder supabase/tests/<name>/, and one
# line in scripts/sql-beds.txt. This file does not change.
on:
  pull_request:
  merge_group:
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      beds: ${{ steps.filter.outputs.beds }}
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Which beds, and did a bed's file change?
        id: filter
        shell: bash
        run: |
          MATRIX=$(grep -v '^\s*#' scripts/sql-beds.txt | grep -v '^\s*$' | jq -R . | jq -cs .)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "beds=true" >> "$GITHUB_OUTPUT"; echo "beds=true (dispatch) $MATRIX"; exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}"
          HEAD="${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}"
          BEDS=false
          while IFS= read -r f; do
            case "$f" in
              supabase/migrations/*|supabase/tests/*|scripts/pgtest-*|scripts/sql-beds.txt|.github/workflows/sql-beds.yml) BEDS=true ;;
            esac
          done < <(git diff --name-only "$BASE" "$HEAD")
          echo "beds=$BEDS" >> "$GITHUB_OUTPUT"
          echo "beds=$BEDS ($BASE..$HEAD) $MATRIX"

  bed:
    needs: changes
    if: needs.changes.outputs.beds == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        bed: ${{ fromJSON(needs.changes.outputs.matrix) }}
    name: ${{ matrix.bed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: ${{ matrix.bed }} against every migration
        run: bash scripts/pgtest-${{ matrix.bed }}.sh

  # The one check branch protection requires.
  sql-beds:
    needs: [changes, bed]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every bed passed or was not needed
        shell: bash
        run: |
          echo 'bed: ${{ needs.bed.result }} · changes: ${{ needs.changes.result }}'
          case '${{ needs.bed.result }}' in
            failure|cancelled) echo "a bed failed or was cancelled"; exit 1 ;;
          esac
          case '${{ needs.changes.result }}' in
            failure|cancelled) echo "the changes job failed"; exit 1 ;;
          esac
          echo ok
