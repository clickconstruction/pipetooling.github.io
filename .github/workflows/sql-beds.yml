name: SQL beds

# The whole-schema SQL beds (scripts/pgtest-*.sh) need Docker, and no session on the office Mac can
# reach it. GitHub's runners have it. A PR that touches a bed's SQL runs the beds here before its
# migration is pushed: the schedule's (its PR 5), bid history's ledger (#73 PR 0b on), the
# unbanked check cases (#76 piece 3), the Stripe cases (#76 piece 1), Building's presses (GC mode U3a-i on: the daily log, the submittals),
# Owner Billing's bill to the customer (GC mode O4a-1) with its reminders (O5b), GC award (the Board's B6-a),
# Start and Start anyway (B6-c-i), the AIA pay applications (the bill an application became, v2.5032) and the
# trade portal's back-charges and change requests (the Portal's P4a).
on:
  pull_request:
    paths:
      - 'supabase/migrations/*gc_schedule*'
      - 'supabase/tests/gc_schedule/**'
      - 'scripts/pgtest-gc-schedule.sh'
      - 'supabase/migrations/*bid_changes*'
      - 'supabase/migrations/*labor_rows_unmatched*'
      - 'supabase/migrations/*list_bid_history*'
      - 'supabase/migrations/*latest_bid_cell_history*'
      - 'supabase/migrations/*put_back_bid_change*'
      - 'supabase/tests/bid_changes/**'
      - 'scripts/pgtest-bid-changes.sh'
      - 'supabase/migrations/*ar_unbanked_check*'
      - 'supabase/tests/ar_unbanked_checks/**'
      - 'scripts/pgtest-ar-unbanked-checks.sh'
      - 'supabase/migrations/*ar_stripe_cases*'
      - 'supabase/tests/ar_stripe_cases/**'
      - 'scripts/pgtest-ar-stripe-cases.sh'
      - 'supabase/migrations/*gc_save_daily_log*'
      - 'supabase/migrations/*gc_submittal_writes*'
      - 'supabase/tests/gc_building/**'
      - 'scripts/pgtest-gc-building.sh'
      - 'supabase/migrations/*gc_owner*'
      - 'supabase/migrations/*gc_remind*'
      - 'supabase/tests/gc_owner_billing/**'
      - 'scripts/pgtest-gc-owner-billing.sh'
      - 'supabase/migrations/*gc_award*'
      - 'supabase/tests/gc_award/**'
      - 'scripts/pgtest-gc-award.sh'
      - 'supabase/migrations/*job_pay_applications*'
      - 'supabase/tests/pay_applications/**'
      - 'scripts/pgtest-pay-applications.sh'
      - 'supabase/migrations/*gc_back_charges*'
      - 'supabase/tests/gc_back_charges/**'
      - 'scripts/pgtest-gc-back-charges.sh'
      - 'supabase/migrations/*gc_start_project*'
      - 'supabase/tests/gc_start/**'
      - 'scripts/pgtest-gc-start.sh'
      - '.github/workflows/sql-beds.yml'
  workflow_dispatch:

jobs:
  gc-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: The schedule's writes against every migration
        run: bash scripts/pgtest-gc-schedule.sh

  bid-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Bid history's ledger against every migration
        run: bash scripts/pgtest-bid-changes.sh

  ar-unbanked-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: The unbanked check sweep, its self-closes and the list rows
        run: bash scripts/pgtest-ar-unbanked-checks.sh

  ar-stripe-cases:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: The Stripe cases against stand-in tables
        run: bash scripts/pgtest-ar-stripe-cases.sh

  gc-building:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Building's presses against every migration
        run: bash scripts/pgtest-gc-building.sh

  gc-owner-billing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Our bill to the customer against every migration
        run: bash scripts/pgtest-gc-owner-billing.sh

  gc-award:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: GC award's gate and statement of work against every migration
        run: bash scripts/pgtest-gc-award.sh

  pay-applications:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: The AIA pay applications against every migration
        run: bash scripts/pgtest-pay-applications.sh

  gc-back-charges:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: GC back-charges and change requests against every migration
        run: bash scripts/pgtest-gc-back-charges.sh

  gc-start:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Start and Start anyway against every migration
        run: bash scripts/pgtest-gc-start.sh
