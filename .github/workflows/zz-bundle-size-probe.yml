name: bundle size probe (one time, by hand)

# A ONE-TIME PROBE (v2.8123). It is removed once its result is written down.
#
# Supabase holds a function bundled with Docker to 20 MB and does not say which size it means. A bundle has two:
# the one the CLI prints (compressed) and the one Supabase stores (unpacked: each file, its JavaScript and its source
# map, about 3.3 times the source). dev-mcp's bundle was accepted on 2026-11-20 at 3.46 MB compressed and 14.85 MB
# unpacked, which cannot tell them apart. So `check:edge-bundles` holds the seat to 5.8 MB of source, about five days
# of room, where the compressed reading would allow about 12 MB.
#
# This job makes a throwaway function in the runner, `zz-bundle-size-probe`: an index.ts that counts the lines of
# padding modules of made-up words. Nothing of it is in the repo. It deploys it bundled twice, then deletes it:
#
#   1. about 7.5 MB of source: over 20 MB unpacked, about 6 MB compressed. Accepted means the unpacked size is not
#      held to 20 MB. Refused means it is, and the second deploy is skipped.
#   2. about 14 MB of source: over 40 MB unpacked, about 12 MB compressed. Accepted means a seat of 12 MB of source
#      would be taken on both sizes.
#
# After each accepted deploy it reads the stored bundle's size and calls the function once, to see that a bundle of
# that size boots. The function answers one line of JSON, reads nothing and writes nothing. It exists for about a
# minute. The delete runs whatever happened before it, and the job fails if the function is still there after.
#
#   gh workflow run zz-bundle-size-probe.yml --ref main -f confirm=zz-bundle-size-probe
#
# Requires the SUPABASE_ACCESS_TOKEN repo secret, the one the two drift workflows use.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type zz-bundle-size-probe to deploy the throwaway function twice and delete it'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: zz-bundle-size-probe
  cancel-in-progress: false

env:
  SLUG: zz-bundle-size-probe
  REF: yewfzhbofbbyvkvtaatw

jobs:
  probe:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'zz-bundle-size-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The version the dev seat's deploy job uses.
      - name: Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.72.7

      # With no daemon the CLI sends raw files instead, which Supabase holds to 5 MB: the probe would answer nothing.
      - name: Docker is up
        run: docker info --format 'Docker {{.ServerVersion}}'

      # The probe makes its own function and deletes it. It never touches one that was there before it.
      - name: No function of this name exists
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          code=$(curl -s --max-time 60 -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$REF/functions/$SLUG")
          echo "GET function: $code"
          if [ "$code" != "404" ]; then
            echo "::error::Expected 404 for $SLUG before the probe, got $code. Nothing was deployed."
            exit 1
          fi
          test ! -e "supabase/functions/$SLUG"

      - name: Write the generator and the stage script
        run: |
          cat > "$RUNNER_TEMP/gen.mjs" <<'EOF'
          // Writes a throwaway edge function of about <rawMB> MB of source: an index.ts and padding modules of made-up words.
          import { mkdirSync, rmSync, writeFileSync } from 'node:fs'
          import { join } from 'node:path'
          const [dir, mbArg] = process.argv.slice(2)
          const target = Number(mbArg) * 1e6
          let seed = 20261120
          const rnd = () => (seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0) / 4294967296
          const letters = 'abcdefghijklmnopqrstuvwxyz'
          const vocab = Array.from({ length: 256 }, () => Array.from({ length: 3 + Math.floor(rnd() * 7) }, () => letters[Math.floor(rnd() * 26)]).join(''))
          rmSync(dir, { recursive: true, force: true })
          mkdirSync(dir, { recursive: true })
          const FILE = 1e6
          let written = 0
          let n = 0
          while (written < target) {
            const lines = []
            let size = 0
            while (size < Math.min(FILE, target - written)) {
              let line = ''
              while (line.length < 96) line += vocab[Math.floor(rnd() * vocab.length)] + ' '
              lines.push(`  '${line}',`)
              size += line.length + 6
            }
            const body = `export const pad${n}: string[] = [\n${lines.join('\n')}\n]\n`
            writeFileSync(join(dir, `pad${n}.ts`), body)
            written += body.length
            n++
          }
          const names = Array.from({ length: n }, (_, i) => `pad${i}`)
          writeFileSync(
            join(dir, 'index.ts'),
            names.map((p) => `import { ${p} } from './${p}.ts'`).join('\n') +
              `\n\nconst lines = [${names.join(', ')}].reduce((sum, pad) => sum + pad.length, 0)\n` +
              `Deno.serve(() => new Response(JSON.stringify({ probe: true, lines }), { headers: { 'content-type': 'application/json' } }))\n`,
          )
          console.log(`${(written / 1e6).toFixed(2)} MB of source in ${n + 1} files`)
          EOF
          cat > "$RUNNER_TEMP/stage.sh" <<'EOF'
          # stage.sh <name> <MB of source>: write the function, deploy it bundled, and when accepted read the stored
          # bundle's size and call it once. Writes accepted=true|false to the step's outputs. A refusal is a result.
          name="$1"
          node "$RUNNER_TEMP/gen.mjs" "supabase/functions/$SLUG" "$2" | tee "raw-$name.log"
          set +e
          supabase functions deploy "$SLUG" --no-verify-jwt --project-ref "$REF" --use-docker > "deploy-$name.log" 2>&1
          code=$?
          set -e
          grep -vE 'Pulling|Download|Pull complete|Waiting|Verifying|Extracting|Digest:|Status:|Already exists' "deploy-$name.log" | tail -30
          echo "deploy exit $code" | tee -a "deploy-$name.log"
          if grep -qE 'Uploading asset|Docker is not running' "deploy-$name.log"; then
            echo '::error::The CLI sent raw source files, not a Docker bundle. The probe answered nothing.'
            exit 1
          fi
          if [ "$code" -ne 0 ]; then
            echo "accepted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "accepted=true" >> "$GITHUB_OUTPUT"
          curl -s --max-time 180 -o /dev/null -w 'unpacked %{http_code} %{size_download}\n' \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$REF/functions/$SLUG/body" | tee "unpacked-$name.log" || true
          sleep 5
          curl -s --max-time 60 -w '\ncall %{http_code} %{time_total}s\n' "https://$REF.supabase.co/functions/v1/$SLUG" | tee "call-$name.log" || true
          EOF

      - name: First deploy, over 20 MB unpacked
        id: one
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: bash -e "$RUNNER_TEMP/stage.sh" one 7.5

      - name: Second deploy, over 40 MB unpacked
        id: two
        if: steps.one.outputs.accepted == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: bash -e "$RUNNER_TEMP/stage.sh" two 14

      # Whatever happened above, the function goes. The CLI first, the Management API if it is still there.
      - name: Delete the function
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          gone() { [ "$(curl -s --max-time 60 -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$REF/functions/$SLUG")" = "404" ]; }
          if gone; then echo 'never deployed, nothing to delete' | tee delete.log; exit 0; fi
          supabase functions delete "$SLUG" --project-ref "$REF" < /dev/null || true
          sleep 3
          if ! gone; then
            curl -s --max-time 60 -o /dev/null -w 'DELETE by the API: %{http_code}\n' -X DELETE -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$REF/functions/$SLUG"
            sleep 3
          fi
          if gone; then
            echo 'deleted: the function answers 404' | tee delete.log
          else
            echo 'STILL THERE' | tee delete.log
            echo "::error::$SLUG is still deployed. Delete it by hand: supabase functions delete $SLUG --project-ref $REF"
            exit 1
          fi

      - name: What happened
        if: always()
        run: |
          mb() { awk -v b="$1" 'BEGIN { printf "%.2f MB", b / 1000000 }'; }
          {
            echo '### Bundle size probe'
            for name in one two; do
              [ -f "deploy-$name.log" ] || { echo "- deploy $name: not run"; continue; }
              echo "- deploy $name: $(cat "raw-$name.log" 2>/dev/null)"
              echo "  - CLI: $(grep -oE 'script size: [0-9.]+ ?[A-Za-z]+' "deploy-$name.log" | head -1 || true)"
              if grep -qE '^unpacked 200 [0-9]+$' "unpacked-$name.log" 2>/dev/null; then
                echo "  - stored unpacked: $(mb "$(cut -d' ' -f3 "unpacked-$name.log")")"
              fi
              echo "  - $(grep -E '^deploy exit' "deploy-$name.log")"
              [ -f "call-$name.log" ] && echo "  - $(grep -E '^call ' "call-$name.log" || echo 'call: no answer')"
              echo '```'
              grep -E 'Deploying Function|Deployed Functions|exceed|too large|[Ee]rror|unexpected|status' "deploy-$name.log" | head -12 || true
              echo '```'
            done
            echo "- delete: $(cat delete.log 2>/dev/null || echo 'did not run')"
          } >> "$GITHUB_STEP_SUMMARY"
