name: Warm the typecheck and lint caches

# Runs once per merge to main and saves the .cache that every pull request and merge-queue build restores
# (ci.yml): a warm typecheck takes 40 seconds, a cold one twelve minutes (three programs since 2026-11-24,
# scripts/lib/typecheckParts.mjs). It runs no check the queue did not just
# run on this exact content, and nothing waits on it: it is not a gate, and deploy.yml does not need it. A
# cache saved on a branch is visible to that branch alone, which is why the save lives on main and not in
# ci.yml's static job. Budget (2026-11-24): about a minute warm, fourteen cold.
on:
  push:
    branches:
      - main

# A warm-up that is running finishes: its save is what the next warm-up and every pull request restore, and
# cancelling it for each newer merge would leave a busy hour with no cache at all. The newest merge's run
# waits behind it instead, and GitHub cancels the runs between them before they take a runner (ci.yml's push
# runs on main did exactly this on 2026-10-27: 446a3c514 ran while 833cb50, 75f7bb9 and 3e4fb90 queued, and
# only the last of those stayed queued). Their caches are not missed: a run restores the newest prefix match.
concurrency:
  group: warm-caches
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-latest
    # A cold run is the install, twelve minutes of typecheck and a cold lint: over the fifteen minutes this had
    # until 2026-11-24. A warm-up that is killed saves nothing, so every run after it would be cold too.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The key ci.yml restores by (scripts/check-workflow-parity.mjs holds the two together), so this run is
      # itself warm from the previous main.
      - name: Restore the previous caches
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: checks-cache-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig.json', 'tsconfig.app.json', 'tsconfig.tests-lib.json', 'tsconfig.tests-rest.json', 'eslint.config.js') }}-${{ github.sha }}
          restore-keys: |
            checks-cache-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig.json', 'tsconfig.app.json', 'tsconfig.tests-lib.json', 'tsconfig.tests-rest.json', 'eslint.config.js') }}-

      # TYPECHECK_NO_LOCK: the script queues typechecks across a machine's worktrees (scripts/typecheck-queued.mjs);
      # a runner is its own machine, so it runs tsc at once.
      - name: Typecheck
        env:
          TYPECHECK_NO_LOCK: '1'
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Save the caches
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: checks-cache-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig.json', 'tsconfig.app.json', 'tsconfig.tests-lib.json', 'tsconfig.tests-rest.json', 'eslint.config.js') }}-${{ github.sha }}
