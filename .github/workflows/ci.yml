name: CI

# Every pull request push and every merge-queue build, never main itself. Nothing reaches main except through
# the queue (ruleset "main merge queue", no bypass actors), so a run on main repeated the queue's run on the
# same content: until 2026-10-27 it did, 28 minutes of runner time a merge, 60 merges a day. The typecheck and
# lint caches this job restores are saved on main by warm-caches.yml.
on:
  pull_request:
  # Merge-queue builds: the queue re-runs "checks" on the speculative merge
  # result before landing; without this trigger queued PRs would time out.
  merge_group:

# A pull request's superseded run is cancelled when a newer push arrives; a merge-queue group's run never is
# (cancel-in-progress is false for it). Without this, every force-pushed rebase left the stale run holding a
# runner for its full 18 minutes while the queue waited (2026-10-13, 23 runs backed up).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    # Normally 20 to 30 minutes (2026-11-01, the tests 18 to 21 of them); a stalled check fails instead of hanging the queue.
    timeout-minutes: 40
    # pull-requests: write lets check:calls-ahead label a PR whose client calls ahead of its migration.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check migrations (unique versions + valid names)
        run: bash scripts/check-migrations.sh

      - name: Workflow cache-key parity (ci.yml restores what warm-caches.yml saves)
        run: node scripts/check-workflow-parity.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # A change that touches only docs/, to-dos/, a root .md, .claude/ or a release note cannot break the app, and
      # the suite costs 13 to 21 of this job's 25 minutes (2026-11-02: 16 of 74 merges were such changes, and the
      # queue built three at a time). The compare API lists the files between the build's base and head — on a
      # merge-queue build that is every entry in the group, so a code PR ahead in the group keeps the full suite.
      # scripts/lib/docsOnlyChange.mjs decides, fail-safe: no files, an unreadable body, a list cut at the API's
      # cap, or one file outside the patterns runs everything. Typecheck, lint and the house checks run either way.
      - name: Which files changed (a docs-only change runs the doc-reading tests alone)
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          HEAD: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
        run: gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE}...${HEAD}?per_page=300" | node scripts/ci-docs-only.mjs

      # Typecheck and lint caches. warm-caches.yml saves them on every push to main; every pull request and
      # merge-queue build restores the newest one it can see (a branch sees main's caches and its own). tsc then
      # re-checks only the files that changed since that main, and eslint only the files whose content changed,
      # instead of every file under src on every run (2026-10-27: Typecheck 5.5 and Lint 2 of the checks job's
      # 27 minutes). The key carries the lockfile, tsconfig and eslint config hashes, so a TypeScript or rule
      # change starts a fresh cache instead of trusting a stale one; check-workflow-parity.mjs holds it to the
      # key warm-caches.yml saves by. The typecheck script runs tsc without -b: build mode trusts timestamps,
      # and with a restored build info newer than the checkout it skipped a changed file holding a type error
      # (2026-10-27); plain tsc compares hashes.
      - name: Restore the typecheck and lint caches
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: checks-cache-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig.json', 'eslint.config.js') }}-${{ github.sha }}
          restore-keys: |
            checks-cache-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig.json', 'eslint.config.js') }}-

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The typecheck reads the app alone. Deno refuses a missing named export when a module loads, so a function
      # importing a name its `_shared` module does not export passed every check here and then answered 503
      # BOOT_ERROR from its first request after the deploy (v2.6294, 2026-11-01: job-drive-folders and photo-save).
      # This bundles every function with esbuild, remote imports external, in about half a second.
      - name: Every edge function links (a missing export fails here, not at boot)
        run: npm run check:edge-bundles

      # The fourth lock of the seal behind the Away note (v2.6572, v2.6579): a function that reads the caller and
      # switches to the service role queries as nobody, so it must refuse an archived caller itself.
      - name: Every edge function that reads the caller and switches to the service role carries the archived guard
        run: npm run check:edge-archived-guard

      - name: Theme token check
        run: node scripts/theme-tokenize.mjs --check src

      # A var(--name) no stylesheet or code defines paints nothing (v2.5444).
      - name: CSS token check
        run: npm run check:css-tokens

      # The one list of checks there is. Until 2026-10-27 deploy.yml ran a copy of this job on main, and this
      # check missing here let a raw 'America/Chicago' literal merge green (PR #649) and then fail every main
      # deploy from v2.965 to v2.985.
      - name: App calendar timezone check
        run: npm run check:timezone

      - name: To-dos render the punch list
        run: npm run check:todos

      - name: Changed help guides, sentences that open on a pronoun (warns, never fails)
        run: npm run check:pronouns

      - name: New empty states name the next press (fails on added lines only)
        run: npm run check:empty-words

      - name: Windows drawn inside windows stop their own backdrop click
        run: npm run check:nested-windows

      - name: Windows close on a click outside, not on the press
        run: npm run check:backdrop-click

      - name: Every window stands above the Dispatch / Job mode dock
        run: npm run check:window-z

      - name: Every dim full-screen backdrop holds a panel marked as a modal
        run: npm run check:dialog-role

      - name: Every window's panel starts below an iPhone's status bar
        run: npm run check:status-bar

      - name: A batch button says its count
        run: npm run check:batch-words

      - name: A button that cannot be pressed draws the dead-press pair
        run: npm run check:dead-press

      - name: Words on a text-token fill read in both themes
        run: npm run check:text-fill-words

      - name: A blue press under white words fills with #2563eb
        run: npm run check:press-blue

      - name: An error names its reason (fails on added lines only)
        run: npm run check:error-words

      # The client deploys on the merge; its migration waits for a hand db push. A client that calls what only its
      # migration creates is refused on prod from the deploy until the push (v2.6099, 2026-10-30: every clock press,
      # 4:57 AM until the push). This warns on the line, labels the PR, and deploy.yml holds the deploy until the push.
      - name: A call ahead of its migration says push right after the merge (warns and labels, never fails)
        run: npm run check:calls-ahead
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Test
        if: steps.changed.outputs.docs_only != 'true'
        run: npm test
        env:
          # Unit tests don't hit Supabase, but src/lib/supabase.ts throws at import
          # if these are unset. Dummy non-empty values satisfy the guard.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-dummy-anon-key

      # The five tests that read docs/, to-dos/, .claude/ or the release notes from disk — the list is the
      # step's output, kept by src/lib/docsOnlyChange.test.ts, so there is no second copy here to drift.
      - name: Test the doc readers (a docs-only change)
        if: steps.changed.outputs.docs_only == 'true'
        run: npx vitest run ${{ steps.changed.outputs.doc_tests }}
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-dummy-anon-key
