name: CI

# Every pull request push and every merge-queue build, never main itself. Nothing reaches main except through
# the queue (ruleset "main merge queue", no bypass actors), so a run on main repeated the queue's run on the
# same content: until 2026-10-27 it did, 28 minutes of runner time a merge, 60 merges a day. The typecheck and
# lint caches the static job restores are saved on main by warm-caches.yml.
#
# Three jobs since 2026-11-25. Until then one `checks` job ran the typecheck (1 to 17 minutes) and then the
# whole suite (22 to 37) on one runner, 27 to 59 minutes a run, and every code PR paid it twice.
#   static  typecheck, lint, every check and the doc-reading tests. One runner, both events.
#   test    the suite. In the merge queue, the whole of it in shards, a runner each. On a pull request, one
#           runner with the tests near the change and every test that reads files (scripts/lib/nearTests.mjs).
#   checks  the gate, and the one name branch protection requires.
# The queue is the only way onto main and still runs everything; a PR's own run is the quick answer first.
# Runners: the org runs 20 jobs at once. A queue build takes 3 and the queue builds 6 at once, so 18 at its
# fullest; a pull request's run takes 2. A leg waits for a runner when they are all out, it does not fail.
on:
  pull_request:
  # Merge-queue builds: the queue re-runs "checks" on the speculative merge
  # result before landing; without this trigger queued PRs would time out.
  merge_group:

# A pull request's superseded run is cancelled when a newer push arrives; a merge-queue group's run never is
# (cancel-in-progress is false for it). Without this, every force-pushed rebase left the stale run holding a
# runner for its full 18 minutes while the queue waited (2026-10-13, 23 runs backed up).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: typecheck, lint and the checks
    runs-on: ubuntu-latest
    # Normally 5 to 21 minutes warm (2026-11-25: the install and the checks 4, the typecheck 1 to 17 by how far
    # the restored cache is behind the build); a stalled check fails instead of hanging the queue. A cold run,
    # the first after the cache key changes, adds 14 to 17 minutes of typecheck and 3 of lint. The limit was 90
    # while this job also ran the suite: at 60 the queue's build of the change that made a new key was cancelled
    # inside its tests (2026-11-24).
    timeout-minutes: 45
    # pull-requests: write lets check:calls-ahead label a PR whose client calls ahead of its migration.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check migrations (unique versions + valid names)
        run: bash scripts/check-migrations.sh

      - name: Workflow cache-key parity (ci.yml restores what warm-caches.yml saves)
        run: node scripts/check-workflow-parity.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # A change that touches only docs/, to-dos/, a root .md, .claude/ or a release note cannot break the app, and
      # the suite costs 13 to 21 of this job's 25 minutes (2026-11-02: 16 of 74 merges were such changes, and the
      # queue built three at a time). The compare API lists the files between the build's base and head — on a
      # merge-queue build that is every entry in the group, so a code PR ahead in the group keeps the full suite.
      # scripts/lib/docsOnlyChange.mjs decides, fail-safe: no files, an unreadable body, a list cut at the API's
      # cap, or one file outside the patterns runs everything. Typecheck, lint and the house checks run either way.
      # Each test leg asks the same question for itself and stops before its install when the answer is docs-only;
      # this job only prints the answer and reads the list of doc-reading tests from it.
      - name: Which files changed (a docs-only change runs the doc-reading tests alone)
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          HEAD: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
        run: gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE}...${HEAD}?per_page=300" | node scripts/ci-docs-only.mjs

      # Typecheck and lint caches. warm-caches.yml saves them on every push to main; every pull request and
      # merge-queue build restores the newest one it can see (a branch sees main's caches and its own). tsc then
      # re-checks only the files that changed since that main, and eslint only the files whose content changed,
      # instead of every file under src on every run (2026-10-27: Typecheck 5.5 and Lint 2 of the checks job's
      # 27 minutes). The key carries the lockfile, tsconfig (the whole program's and the three parts' the check
      # reads, scripts/lib/typecheckParts.mjs) and eslint config hashes, so a TypeScript or rule
      # change starts a fresh cache instead of trusting a stale one; check-workflow-parity.mjs holds it to the
      # key warm-caches.yml saves by. The typecheck script runs tsc without -b: build mode trusts timestamps,
      # and with a restored build info newer than the checkout it skipped a changed file holding a type error
      # (2026-10-27); plain tsc compares hashes.
      - name: Restore the typecheck and lint caches
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: checks-cache-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig.json', 'tsconfig.app.json', 'tsconfig.tests-lib.json', 'tsconfig.tests-rest.json', 'eslint.config.js') }}-${{ github.sha }}
          restore-keys: |
            checks-cache-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig.json', 'tsconfig.app.json', 'tsconfig.tests-lib.json', 'tsconfig.tests-rest.json', 'eslint.config.js') }}-

      # TYPECHECK_NO_LOCK: the script queues typechecks across a machine's worktrees (scripts/typecheck-queued.mjs);
      # a runner is its own machine, so it runs tsc at once.
      - name: Typecheck
        env:
          TYPECHECK_NO_LOCK: '1'
        run: npm run typecheck

      # The typecheck above reads `src` alone. vite.config.ts and playwright.config.ts were read by no typecheck
      # and ignored by eslint until 2026-11-24, so only a build caught a mistake in the build's own config. Three
      # seconds, no cache: tsconfig.node.json takes the app's options and reads the two files and what they import.
      # The Lint step ends with `npm run lint:config`, which lints the two files past eslint.config.js's ignore of
      # `*.config.ts`. The ignore stays: eslint.config.js is in the caches' key below, and a change to it sends every
      # pull request through a cold typecheck, which is at its heap's edge (punch list #434).
      - name: Typecheck the build's own config (vite.config.ts, playwright.config.ts)
        run: npm run typecheck:config

      - name: Lint
        run: npm run lint

      # The typecheck reads the app alone. Deno refuses a missing named export when a module loads, so a function
      # importing a name its `_shared` module does not export passed every check here and then answered 503
      # BOOT_ERROR from its first request after the deploy (v2.6294, 2026-11-01: job-drive-folders and photo-save).
      # This bundles every function with esbuild, remote imports external, in about half a second.
      - name: Every edge function links (a missing export fails here, not at boot)
        run: npm run check:edge-bundles

      # The fourth lock of the seal behind the Away note (v2.6572, v2.6579): a function that reads the caller and
      # switches to the service role queries as nobody, so it must refuse an archived caller itself.
      - name: Every edge function that reads the caller and switches to the service role carries the archived guard
        run: npm run check:edge-archived-guard

      - name: Theme token check
        run: node scripts/theme-tokenize.mjs --check src

      # A var(--name) no stylesheet or code defines paints nothing (v2.5444).
      - name: CSS token check
        run: npm run check:css-tokens

      # The one list of checks there is. Until 2026-10-27 deploy.yml ran a copy of this job on main, and this
      # check missing here let a raw 'America/Chicago' literal merge green (PR #649) and then fail every main
      # deploy from v2.965 to v2.985.
      - name: App calendar timezone check
        run: npm run check:timezone

      - name: To-dos render the punch list
        run: npm run check:todos

      - name: Changed help guides, sentences that open on a pronoun (warns, never fails)
        run: npm run check:pronouns

      - name: New empty states name the next press (fails on added lines only)
        run: npm run check:empty-words

      - name: Windows drawn inside windows stop their own backdrop click
        run: npm run check:nested-windows

      - name: Windows close on a click outside, not on the press
        run: npm run check:backdrop-click

      - name: Every window stands above the Dispatch / Job mode dock
        run: npm run check:window-z

      - name: Every dim full-screen backdrop holds a panel marked as a modal
        run: npm run check:dialog-role

      - name: Every window's panel starts below an iPhone's status bar
        run: npm run check:status-bar

      - name: A batch button says its count
        run: npm run check:batch-words

      - name: A button that cannot be pressed draws the dead-press pair
        run: npm run check:dead-press

      - name: Words on a text-token fill read in both themes
        run: npm run check:text-fill-words

      - name: A blue press under white words fills with #2563eb
        run: npm run check:press-blue

      - name: A green press under white words fills with #15803d
        run: npm run check:press-green

      - name: A style's size and weight are not reset by the font shorthand
        run: npm run check:font-shorthand

      - name: An error names its reason (fails on added lines only)
        run: npm run check:error-words

      - name: An amount draws its cents smaller, through the one door (swept surfaces, added lines only)
        run: npm run check:small-cents

      # Git merges by line, and an entry written as one line of several thousand characters conflicted whenever two
      # PRs amended it (2026-11-16: one PR dropped from the queue three times on docs/GLOSSARY.md alone).
      - name: The shared docs hold one sentence a line, so two amendments to one entry merge
        run: npm run check:doc-lines

      # The client deploys on the merge; its migration waits for a hand db push. A client that calls what only its
      # migration creates is refused on prod from the deploy until the push (v2.6099, 2026-10-30: every clock press,
      # 4:57 AM until the push). This warns on the line, labels the PR, and deploy.yml holds the deploy until the push.
      - name: A call ahead of its migration says push right after the merge (warns and labels, never fails)
        run: npm run check:calls-ahead
        env:
          GH_TOKEN: ${{ github.token }}

      # The five tests that read docs/, to-dos/, .claude/ or the release notes from disk — the list is the
      # step's output, kept by src/lib/docsOnlyChange.test.ts, so there is no second copy here to drift. They run
      # here on every build, about half a minute, and not only on a docs-only one: the test legs decide docs-only
      # for themselves, and a leg that skips must never be the only place these would have run.
      - name: Test the doc readers
        run: npx vitest run ${{ steps.changed.outputs.doc_tests }}
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-dummy-anon-key

  test:
    # In the merge queue: the whole suite, dealt by vitest into shards of equal size, a runner each (5,940 files
    # took one runner 22 to 37 minutes on 2026-11-25; two take 12 to 20 each). check-workflow-parity.mjs holds the
    # list to every shard of one count, so a third of the suite cannot drop out by a typo. On a pull request: one
    # leg, the tests near the change.
    name: test ${{ matrix.part }}
    runs-on: ubuntu-latest
    # A shard is 12 to 20 minutes, a pull request's pick about 10. The one long case is a pull request that
    # changes what every test runs on (package.json, vite.config.ts, a tsconfig): its leg runs the whole suite
    # on this one runner, 22 to 37 minutes, as every run did until 2026-11-25.
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      # A red shard does not stop the others: the run then names every failing test, not the first shard's.
      fail-fast: false
      matrix:
        part: ${{ fromJSON(github.event_name == 'merge_group' && '["1/2", "2/2"]' || '["near the change"]') }}
    env:
      # The whole suite (5,750 files on 2026-11-23) passed twice in the merge queue and then vitest's own process died
      # of "JavaScript heap out of memory" while closing, with node's default cap near 2 GB. The runner has room.
      NODE_OPTIONS: --max-old-space-size=6144
      # Unit tests don't hit Supabase, but src/lib/supabase.ts throws at import
      # if these are unset. Dummy non-empty values satisfy the guard.
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-dummy-anon-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The static job's question, asked again here so no job waits on another for a runner. A docs-only change
      # ends this leg in seconds, before its install: the static job runs the doc-reading tests on every build.
      # The answer is fail-safe, so a compare that does not read here runs this leg's tests.
      - name: Which files changed (a docs-only change runs no test here)
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          HEAD: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE}...${HEAD}?per_page=300" > "$RUNNER_TEMP/compare.json" || true
          node scripts/ci-docs-only.mjs < "$RUNNER_TEMP/compare.json"

      - name: Setup Node.js
        if: steps.changed.outputs.docs_only != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.changed.outputs.docs_only != 'true'
        run: npm ci

      # A pull request's own run. scripts/lib/nearTests.mjs has the rule and its reasons: the tests whose imports
      # reach a changed file, by Vite's own import graph, and every test whose imports reach a module that reads
      # files (the source-scan tests: no graph can say which files they open). Anything the picker cannot tell
      # answers mode=all, and the step after the next runs the whole suite on this runner.
      - name: Which tests are near the change (a pull request)
        id: near
        if: github.event_name == 'pull_request' && steps.changed.outputs.docs_only != 'true'
        run: node scripts/ci-near-tests.mjs "$RUNNER_TEMP/near-tests.txt" < "$RUNNER_TEMP/compare.json"

      - name: Test near the change (a pull request)
        if: github.event_name == 'pull_request' && steps.changed.outputs.docs_only != 'true' && steps.near.outputs.mode == 'near'
        run: npx vitest run $(cat "$RUNNER_TEMP/near-tests.txt")

      - name: Test the whole suite (a pull request the picker could not narrow)
        if: github.event_name == 'pull_request' && steps.changed.outputs.docs_only != 'true' && steps.near.outputs.mode != 'near'
        run: npm test

      - name: Test this shard of the whole suite (the merge queue)
        if: github.event_name != 'pull_request' && steps.changed.outputs.docs_only != 'true'
        run: npx vitest run --shard=${{ matrix.part }}

  # The one check branch protection requires, under the name it has always had. It runs only to fail, as
  # sql-beds.yml's gate does: a skipped job takes no runner and counts as passing, so a green build never
  # waits behind the backlog for a job of seconds. check-workflow-parity.mjs holds `needs` to every other job
  # of this file, so a leg added later cannot be left outside the gate.
  checks:
    needs: [static, test]
    # always() is what holds a red leg out: without a status function GitHub adds success(), a failed leg then
    # skips this job, and a skip passes. A cancelled or timed-out leg is not 'success' either, so it fails here.
    if: always() && !(needs.static.result == 'success' && needs.test.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: A leg did not pass
        shell: bash
        run: |
          echo 'static: ${{ needs.static.result }} · test: ${{ needs.test.result }}'
          exit 1
