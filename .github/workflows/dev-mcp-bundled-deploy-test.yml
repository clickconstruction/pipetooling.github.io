name: dev-mcp bundled deploy (a test, by hand)

# A TEST, NOT THE WAY dev-mcp DEPLOYS (v2.8091). `scripts/deploy-functions.sh` stays the way every function deploys.
#
# Supabase takes a function two ways: raw source files that its server bundles, held to 5 MB, and a bundle the CLI
# builds with Docker before it uploads, held to 20 MB. The repo's script has sent raw files since 2026-11-03, and
# dev-mcp stands at 4.49 MB of them, a few thousand bytes under `check:edge-bundles`' 4.5 MB ceiling. This job answers
# one question with a real deploy: does Supabase accept dev-mcp bundled with Docker, and what size does the CLI print
# for it. A hosted runner has Docker; the Mac the sessions run on does not reach its daemon.
#
# It deploys dev-mcp alone, from main alone, and only when a person runs it and types the function's name:
#
#   gh workflow run dev-mcp-bundled-deploy-test.yml --ref main -f confirm=dev-mcp
#
# A refused deploy leaves the live function as it was. An accepted one runs the code main already holds, bundled
# another way. Whether this becomes the seat's standing deploy is the owner's decision, made after the result.
#
# Requires the SUPABASE_ACCESS_TOKEN repo secret, the one the two drift workflows use.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type dev-mcp to deploy it from main, bundled with Docker'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dev-mcp-bundled-deploy-test
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'dev-mcp'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The version the sessions deploy with, so the bundling is the one thing that differs.
      - name: Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.72.7

      # With no daemon the CLI warns and sends raw files instead, which would answer nothing. Stop here first.
      - name: Docker is up
        run: docker info --format 'Docker {{.ServerVersion}}'

      - name: What the raw upload would be
        run: node scripts/lib/edgeUploadGraph.mjs dev-mcp

      - name: Deploy dev-mcp, bundled with Docker
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -o pipefail
          supabase functions deploy dev-mcp --no-verify-jwt --project-ref yewfzhbofbbyvkvtaatw --use-docker 2>&1 | tee deploy.log

      - name: What happened
        if: always()
        run: |
          {
            echo '### dev-mcp, bundled with Docker'
            echo '```'
            if [ -f deploy.log ]; then
              grep -E 'Bundling Function|script size|Deployed Functions|Uploading asset|Docker is not running|exceeds|unexpected|[Ee]rror' deploy.log | head -40 || echo 'no line of the deploy matched'
            else
              echo 'the deploy step did not run'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # A raw upload means the CLI fell back, and the test said nothing about the bundled path.
          if [ -f deploy.log ] && grep -qE 'Uploading asset|Docker is not running' deploy.log; then
            echo '::error::The CLI sent raw source files, not a Docker bundle. This run did not test the bundled path.'
            exit 1
          fi
